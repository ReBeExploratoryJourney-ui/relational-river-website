<svg xmlns="http://www.w3.org/2000/svg" viewBox="290 200 420 820" width="420" height="820" role="img" aria-label="A river rising from a glowing spring, with streams joining as it flows">
<style>
.rv{transform-box:view-box;transform-origin:210px 96px;animation:reveal 4.2s cubic-bezier(.4,0,.35,1) .4s both}
@keyframes reveal{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.flow{stroke-dasharray:4 20;animation:flow 7s linear infinite}
.flow2{stroke-dasharray:2 34;animation:flow 11s linear infinite}
.trib{stroke-dasharray:3 16;animation:tflow 9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes tflow{to{stroke-dashoffset:-190}}
.glow{transform-box:fill-box;transform-origin:center;animation:breathe 9s ease-in-out infinite,glowin 2.4s ease-out both}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes glowin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.rv,.flow,.flow2,.trib,.glow{animation:none}}
</style>
<defs>
<linearGradient id="stream" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="1010"><stop offset="0" stop-color="#FFF8EC"/><stop offset="0.25" stop-color="#CFEFF4"/><stop offset="1" stop-color="#9FD3DC"/></linearGradient>
<radialGradient id="spring"><stop offset="0" stop-color="#FFF8EC"/><stop offset="0.22" stop-color="#F5EEE1" stop-opacity="0.85"/><stop offset="0.5" stop-color="#F5EEE1" stop-opacity="0.28"/><stop offset="1" stop-color="#F5EEE1" stop-opacity="0"/></radialGradient>
<linearGradient id="edgeH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.22" stop-color="#fff"/><stop offset="0.78" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="edgeV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.86" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="fadeH" maskUnits="userSpaceOnUse" x="290" y="200" width="420" height="820"><rect x="290" y="200" width="420" height="820" fill="url(#edgeH)"/></mask>
<mask id="fadeV" maskUnits="userSpaceOnUse" x="290" y="200" width="420" height="820"><rect x="290" y="200" width="420" height="820" fill="url(#edgeV)"/></mask>
<clipPath id="reveal"><rect class="rv" x="290" y="200" width="420" height="820"/></clipPath>
</defs>
<g mask="url(#fadeV)">
<g clip-path="url(#reveal)">
<g mask="url(#fadeH)">
