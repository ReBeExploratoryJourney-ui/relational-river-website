<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 46px; letter-spacing: -0.03em; line-height: 1.06">How the River cares for your information</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.55">The River asks for very little. You can walk all of it without giving your name, and nothing about your visit is tracked. This notice explains, in plain words, what is kept when you choose to share something, why, for how long, and the rights you have. It is written to meet the EU and UK General Data Protection Regulation (GDPR), and we offer the same care to everyone, wherever you live.</p>
<p style="margin: 0; font-size: 15px; font-style: italic; color: #C9CCD6">Last updated 21 November 2026. This notice is being reviewed before the River fully opens.</p>
</div>

<section class="torn tl pv">
<h2>Who looks after your information</h2>
<p>The Relational River is offered by the Institute of Relational Being (IRB), [legal name and registered address, once the company is formed]. IRB is the “controller” of the information described here: we decide why and how it is used, and we are responsible for it.</p>
<p>Write to us any time at <a href="mailto:privacy@relationalriver.org">privacy@relationalriver.org</a>. Our representative in the European Union, for people there who would rather write to someone in the EU, is [to be appointed].</p>
</section>

<section class="pvplain">
<h2>What is kept, why, and for how long</h2>
<div class="pvtable" role="region" aria-label="What is kept, why and for how long" tabindex="0">
<table>
<thead><tr><th scope="col">When you…</th><th scope="col">What is used</th><th scope="col">Why, and the lawful basis</th><th scope="col">How long</th></tr></thead>
<tbody>
<tr><td data-label="When you…">Visit any page</td><td data-label="What is used">Your IP address, browser type and the page asked for, handled by our host Cloudflare to deliver the page and keep the site safe. The River itself keeps no visit logs and uses no analytics.</td><td data-label="Why, and the lawful basis">To run a working, secure website. Legitimate interests (GDPR Article 6(1)(f)).</td><td data-label="How long">Cloudflare’s short-lived operational logs only.</td></tr>
<tr><td data-label="When you…">Answer questions, filter or explore</td><td data-label="What is used">Your choices at the source, in My river, and in filters stay in your browser while the page is open. They are never sent to us.</td><td data-label="Why, and the lawful basis">So the page can respond to you. Nothing is collected.</td><td data-label="How long">Gone when you close the page.</td></tr>
<tr><td data-label="When you…">Pour an offering into the Well</td><td data-label="What is used">What you write and choose (skills, experience, passions, needs, place, time, reach, kinds of exchange, who may see it), the date, and your email if you give one.</td><td data-label="Why, and the lawful basis">To keep your offering and suggest you, as you chose, for projects you might like to join. Your consent (Article 6(1)(a)), which you can withdraw at any time.</td><td data-label="How long">Until you withdraw it, and never longer than three years.</td></tr>
<tr><td data-label="When you…">Write to us</td><td data-label="What is used">Your email address and what you tell us.</td><td data-label="Why, and the lawful basis">To reply and help. Legitimate interests (Article 6(1)(f)).</td><td data-label="How long">As long as needed to help, then deleted within 12 months.</td></tr>
</tbody>
</table>
</div>
<p>Photos of the Beings of a watershed come from iNaturalist, but our own server fetches them on your behalf, so your browser does not contact iNaturalist. Our fonts are kept on our own server too, so no request goes to Google.</p>
<p>When you follow a link to another site, such as Hylo, Substack or an organisation’s own page, that site’s privacy notice applies from then on.</p>
</section>

<section class="torn tr pv">
<h2>Who it is shared with</h2>
<p>We never sell your information, never use it for advertising, and never share it for anyone else’s marketing.</p>
<ul>
<li><b>Cloudflare, Inc.</b> hosts the website and the Well’s database, as our processor under its Data Processing Addendum, and may only use the information to provide that service.</li>
<li><b>Projects and constellations,</b> only when you say yes to an invitation, and only what you agree to share.</li>
<li><b>River stewards,</b> a few trusted people who help tend the Well, under a duty of confidentiality.</li>
<li><b>Authorities,</b> only if the law truly requires it.</li>
</ul>
</section>

<section class="pvplain">
<h2>Information travelling beyond Europe</h2>
<p>IRB and Cloudflare are based in the United States, so information may be handled there. Cloudflare is certified under the EU-U.S. Data Privacy Framework and its UK extension, and its Data Processing Addendum also includes the European Commission’s Standard Contractual Clauses, so your information keeps the protection GDPR requires.</p>
</section>

<section class="torn tl pv">
<h2>Cookies and your browser</h2>
<p>The River uses no cookies for tracking, analytics or advertising, and stores nothing in your browser that isn’t essential, so there is no cookie banner to click through. Cloudflare may set one strictly necessary security cookie, <code>__cf_bm</code>, which helps tell people from automated bots, is not used to track you, and expires after 30 minutes of inactivity. If this ever changes, we will ask you first.</p>
</section>

<section class="pvplain">
<h2>Your rights</h2>
<p>Under GDPR you have the right to:</p>
<ul>
<li><b>see</b> what we hold about you, and receive a copy;</li>
<li><b>correct</b> anything that is wrong;</li>
<li><b>delete</b> your information;</li>
<li><b>limit</b> how we use it, or <b>object</b> to uses based on our legitimate interests;</li>
<li><b>take it with you,</b> in a common file format;</li>
<li><b>withdraw your consent</b> at any time, without affecting what happened before.</li>
</ul>
<p>Your offering in the Well comes with a private link where you can read it, download a copy and withdraw it yourself, straight away. For anything else, write to <a href="mailto:privacy@relationalriver.org">privacy@relationalriver.org</a>. It is free, and we will answer within one month. We may ask a question to make sure a request really comes from you.</p>
<p>The River may suggest people for a project, but it never makes decisions about you on its own: nothing happens without your yes.</p>
</section>

<section class="torn tr pv">
<h2>If you have a concern</h2>
<p>Please tell us first, and we will do our best to put it right. You can also complain to a data protection authority, in the country where you live or work, or where you think something went wrong. In Ireland, that is the <a href="https://www.dataprotection.ie/">Data Protection Commission</a>; in the UK, the <a href="https://ico.org.uk/">Information Commissioner’s Office</a>. The <a href="https://www.edpb.europa.eu/about-edpb/about-edpb/members_en">European Data Protection Board</a> lists the authority for every EU country.</p>
</section>

<section class="pvplain">
<h2>Young people</h2>
<p>Anyone may visit the River. The Well is for people aged 16 and over, and we do not knowingly keep information about anyone younger. If you think a young person has poured in an offering, please write to us and we will delete it.</p>
<h2>Keeping it safe</h2>
<p>The site is only served over a secure connection. Each private link is stored only in scrambled form, so even we cannot rebuild it, and only stewards who need to can read offerings. If something ever went wrong in a way that put your information at risk, we would tell the relevant authority within 72 hours, and tell you directly if the risk to you were high.</p>
<h2>Changes</h2>
<p>If this notice changes, we will update the date above. If a change affects what you agreed to, we will ask you again before it applies to you.</p>
</section>

<p class="note">Earth is every human’s first home. We try to tend your information the way we hope to tend the places we love: gently, honestly, and only taking what is needed.</p>
