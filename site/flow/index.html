<p style="margin: 0; font-size: 20px; line-height: 1.55; max-width: 760px">Wherever you are, you are navigating the present moment as a part of nature and this living world. Earth is every human’s first home. The Relational River is a Source, like the headwaters of any river, offered through the Institute of Relational Being. It is here to be of service to individuals, organizations, communities and the wider living world: an engaging re-source, and an open-source process and platform of reciprocity, curiosity and care for all life and this living world.</p>

    var N = [
      { k: 'Source', x: 50, y: 4, line: 'Where every journey begins, and where you return.', text: 'A few gentle questions about how you feel and what you love outside. Your answers suggest a first way in, and you can grow a private constellation of the relationships that make up your "we".', eg: 'The Relational ID inquiry', href: '/source', cta: 'Begin at the source' },
      { k: 'Streams', x: 37, y: 25, line: 'Small practices that run through ordinary days.', text: 'Sitting with a tree, listening to water, making pictures with Beings, noticing Moon. Everyday ways of relating, many of them through ReBe.', eg: 'ReBe pathways, Sit Spots, Making with Moon', href: '/streams', cta: 'See the streams' },
      { k: 'Tributaries', x: 69, y: 41, line: 'Understanding flowing in from every side.', text: 'Films, talks and readings that help the moment make sense, from energy and money to nature’s rights, identity and soil. Each is credited and linked to its makers.', eg: 'The Great Simplification, by Nate Hagens and team', href: '/tributaries', cta: 'Open a tributary' },
      { k: 'Eddies', x: 20, y: 44, line: 'Water that swirls back, so we meet things again.', text: 'When a river flows past a boulder, the water behind them curls back upstream in a trail of swirls, turning one way, then the other. Eddies are where the River holds us like that: grief tending, gratitude, the Sit Spot, the source itself. These practices return at natural turning points, a new season or a new Moon, and feel different each time.', eg: 'Good Grief Network, the Work That Reconnects', href: '/eddies', cta: 'Meet an eddy' },
      { k: 'Lakes', x: 41, y: 59, line: 'Still water, where we slow down together.', text: 'Circles, fellowships and retreats: Relational ID Circles, gatherings at Corra Woods, and local circles near you.', eg: 'Relational ID Circle, Corra Woods retreats', href: '/lakes', cta: 'Find a lake' },
      { k: 'Waterfall', x: 36, y: 70, line: 'Where gathered energy tips over the edge into motion.', text: 'Offer an idea, a hope or a question, and see which streams it might feed: offerings already in the River, people who might care, and one small first step. Shared ideas gather energy in the pool above the falls until they spill over into new circles, projects and channels.', eg: 'Private by default, never ranked, tended by stewards', href: '/waterfall', cta: 'Offer something to the falls' },
      { k: 'Local currents', x: 83, y: 57, line: 'The people already tending the place you live.', text: 'Groups in your bioregion, gathered from the maps local movements already keep. The River points you there, then steps aside.', eg: 'Transition groups, grief circles, restoration days', href: '/local-currents', cta: 'See who is near you' },
      { k: 'Channels', x: 69, y: 64, line: 'Where the river reaches out to water the land.', text: 'Ways to act, from small to large: in your own life, with neighbours, through petitions and campaigns, at work, and alongside planetary movements. Action and rest belong together, so the eddies are always close by.', eg: 'Center for Biological Diversity action alerts, and more to come', href: '/channels', cta: 'Find a way to act' },
      { k: 'Estuary', x: 64, y: 75, line: 'Where personal change meets the places we work.', text: 'Bringing the living world into workplaces, schools and councils, through Relational Resource Departments and more.', eg: 'Relational Resource Departments', href: '/estuary', cta: 'Visit the estuary' },
      { k: 'Confluences', x: 86, y: 70, line: 'Where streams meet and grow stronger.', text: 'Organisations finding collaborators, and a capital journey, open to everyone, about money as part of the living world.', eg: 'With gratitude to Nate Hagens, Indy Johar and Dark Matter Labs', href: '/capital-journey', cta: 'Open the capital journey' },
      { k: 'Ocean', x: 50, y: 93, line: 'Everything already flowing, all around the world.', text: 'A meshwork of place-based projects tending land, water, culture and one another. Find them by theme, place or need, and meet them as relationships.', eg: 'Hometree, the Bioregional Learning Centre and many more', href: '/ocean', cta: 'Explore the ocean' },
      { k: 'Groundwater', x: 13, y: 80, line: 'The hidden water that connects everything beneath the surface.', text: 'A systems view of the whole River: how the waters feed one another, where quiet threads of connection are forming, and where something new might emerge between people, projects and places. The dotted lines on the map trace it.', eg: 'With Perspectiva and Sympoiesis', href: '/groundwater', cta: 'See emerging threads' },
      { k: 'Moon', x: 92, y: 16, line: 'Moon moves the waters of Earth, and we are made of water too.', text: 'Twice a day the seas rise and fall as Earth turns beneath Moon. ' + moon.tide + ' Our bodies are mostly water, and for as long as people have lived beside coasts and rivers, Moon has shaped when we fish, plant, gather and rest. Moon’s pull on the water within us is tiny, yet pausing to notice Moon each night is a simple, embodied way to feel part of the same moving water as the oceans and the River.', eg: 'Tonight Moon is ' + moon.name + ', about ' + moon.lit + '% lit', href: '/moon', cta: 'Explore Moon practices in the River', invite: 'An invitation from ReBe: Making with Moon. Step outside, find Moon wherever they are in the sky, and pause long enough to really meet them. Then make a picture together, letting Moon’s light, the clouds and the night take part, rather than taking a photo of Moon. Over a lunar cycle, your pictures become a quiet record of a relationship. If you like, ReBe can send a gentle note for new and full Moon sessions.', inviteCta: 'Make with Moon in ReBe' }

      hasInvite: !!cur.invite, invite: cur.invite || '', inviteCta: cur.inviteCta || '',
      step: (i + 1) + ' of ' + count, name: cur.k, line: cur.line, text: cur.text, eg: cur.eg, href: cur.href, cta: cur.cta,
      prev: function () { go(i - 1); }, next: function () { go(i + 1); },
      tourLabel: this.state.tour ? 'Pause the journey' : 'Follow the whole river',
      toggleTour: function () {
        if (self.state.tour) { self.stopTour(); self.setState({ tour: false }); return; }
        self.setState({ tour: true, i: 0 });
        self.timer = setInterval(function () { var n = self.state.i + 1; if (n >= count) { self.stopTour(); self.setState({ tour: false }); } else { self.setState({ i: n }); } }, 4500);
      }
    };
  }
}
</script>
<script src="/js/river-runtime.js"></script>
</body>
