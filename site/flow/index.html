<p style="margin: 0; font-size: 20px; line-height: 1.55; max-width: 760px">Wherever you are, you are navigating the present moment as a part of nature and this living world. Earth is every human’s first home. The Relational River is a Source, like the headwaters of any river, offered through the <a href="https://instituteofrelationalbeing.org" target="_blank" rel="noopener" style="color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px">Institute of Relational Being</a>. It is here to be of service to individuals, organizations, communities and the wider living world: an engaging re-source, and an open-source process and platform of reciprocity, curiosity and care for all life and this living world.</p>
