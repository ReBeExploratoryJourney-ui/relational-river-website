<body>
<noscript><p style="color:#EDEDED;font-family:sans-serif;padding:24px">The Relational River needs JavaScript turned on to flow.</p></noscript>
<template id="rr-template">

<div style="background: linear-gradient(180deg, #231C4D 0%, #0E2849 42%, #174A5B 100%); font-family: Jost, sans-serif; color: #EDEDED; min-height: 100vh">
<header style="max-width: 1160px; margin: 0 auto; padding: 22px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="/flow" style="display: flex; align-items: center; gap: 12px; text-decoration: none; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="" style="width: 48px; height: 48px; display: block">Relational River</a>
<nav class="vnav" aria-label="Main">
<div class="vgroup"><button class="vbtn">Begin</button><div class="vmenu"><a href="/flow"><b>The River</b><span>the whole River at a glance</span></a><a href="/source"><b>The source</b><span>a minute of gentle questions</span></a><a href="/"><b>The arrival</b><span>watch the Beings gather</span></a></div></div>
<div class="vgroup"><button class="vbtn">Learn</button><div class="vmenu"><a href="/streams"><b>Streams</b><span>small practices for ordinary days</span></a><a href="/tributaries"><b>Tributaries</b><span>films, talks and readings</span></a><a href="/eddies"><b>Eddies</b><span>grief, gratitude and returning</span></a><a href="/moon"><b>Moon</b><span>tides, and Making with Moon</span></a><a href="/capital-journey"><b>Capital journey</b><span>money as part of the living world</span></a></div></div>
<div class="vgroup"><button class="vbtn">Connect</button><div class="vmenu"><a href="/lakes"><b>Lakes</b><span>circles, fellowships and retreats</span></a><a href="/local-currents"><b>Local currents</b><span>groups and circles near you</span></a><a href="/ocean"><b>Ocean and confluences</b><span>projects and collaborators worldwide</span></a><a href="/hylo"><b>Gather on Hylo</b><span>where River circles meet and organise</span></a></div></div>
<div class="vgroup"><button class="vbtn here">Act</button><div class="vmenu"><a href="/channels"><b>Channels</b><span>ways to act, from small to large</span></a><a href="/waterfall"><b>Waterfall</b><span>offer an idea, see what it feeds</span></a><a href="/estuary"><b>Estuary</b><span>workplaces, schools and councils</span></a><a href="/groundwater"><b>Groundwater</b><span>emerging threads and systems</span></a></div></div>
<a href="/my-river" class="vmine">My river</a>
</nav>
</header>

<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 36px">
<a href="/flow" style="font-size: 15px; font-style: italic; min-height: 44px; display: inline-flex; align-items: center">Back to the whole River</a>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: -20px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Estuary</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; line-height: 1.02">Where personal change meets the places we work</h1>
<p style="margin: 0; font-size: 19px; max-width: 760px; line-height: 1.55">An estuary is where river meets sea, fresh water mixing with salt: one of the most alive places on Earth. Here, the relational ways we practise on our own meet the workplaces, schools and councils where we spend our days.</p>
</div>
<div class="chips" role="group" aria-label="I’m thinking of"><span class="chiplabel">I’m thinking of</span>
<sc-for list="{{placeChips}}" as="c" hint-placeholder-count="3"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
<div class="cards">
<sc-for list="{{ideas}}" as="i" hint-placeholder-count="4">
<article class="{{i.cls}}" style="background: {{i.bg}}">
<div class="k">{{i.kind}}</div>
<h3 class="h3">{{i.title}}</h3>
<p class="p">{{i.text}}</p>
</article>
</sc-for>
</div>
<section class="torn tr" style="background: #CFE1E4; padding: 40px 44px; display: flex; flex-wrap: wrap; gap: 32px; color: #2F2B28">
<div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 12px">
<div class="k">An IRB proposal</div>
<h2 class="h2">Relational Resource Departments</h2>
<p class="p" style="font-size: 17px">Alongside human resources, a small group that tends an organisation’s relationships with people, place and the more-than-human world: the creek behind the office, the Beings in its supply chain, the bioregion it belongs to.</p>
<p class="p" style="font-size: 17px">It can begin very simply, with a few colleagues and a monthly walk.</p>
</div>
<ol class="steps" style="flex: 1 1 340px; font-size: 17px">
<li>Find two or three colleagues who feel the same pull.</li>
<li>Begin with a monthly walk, or a meeting that starts outside.</li>
<li>Bring one small practice into ordinary work, such as a minute of noticing before decisions.</li>
<li>Invite IRB for a conversation about what could grow from there.</li>
</ol>
</section>
<section class="torn tl" style="background: #FBF7EF; padding: 36px 44px; display: flex; flex-direction: column; gap: 14px; color: #2F2B28">
<h2 class="h2" style="font-size: 26px">Bring this to my workplace or school</h2>
<sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
<label for="where" class="p" style="font-weight: 600">Where do you work, study or serve?</label>
<input id="where" class="field" value="{{where}}" onChange="{{typedWhere}}" placeholder="For example: a primary school in Ennis, or a design studio in Los Angeles">
<label for="begin" class="p" style="font-weight: 600">What would you love to begin with?</label>
<textarea id="begin" class="field" rows="3" value="{{begin}}" onChange="{{typedBegin}}" placeholder="A walk, a circle, a conversation…"></textarea>
<button class="go tornbtn" style="align-self: flex-start; background: #F5EEE1" onClick="{{send}}">Share with IRB</button>
<p class="minor" style="margin: 0">Nothing is sent until you choose to share, and only what you write here.</p>
</sc-if>
<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<p class="p" style="font-size: 17px">Thank you. This form isn’t connected yet while the River is being tested, so nothing has been sent. For now, the best way to reach IRB is in its home on Hylo, where you can write to us directly.</p>
<a href="https://www.hylo.com/groups/institute-of-relational-being/chat" class="lnk">Write to IRB on Hylo</a>
</sc-if>
</section>
<section style="display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">Where this flows next</h2>
<div class="cards">
<article class="torn tl card" style="background: #E6E2F2">
<div class="k">Channels</div>
<h3 class="h3">Other ways to act</h3>
<p class="p">From your own life to planetary movements, with rest close by.</p>
<a href="/channels" class="lnk">See the channels</a>
</article>
<article class="torn tr card" style="background: #F2D3BC">
<div class="k">Capital journey</div>
<h3 class="h3">Money as part of the living world</h3>
<p class="p">A journey for organisations and philanthropy, open to everyone.</p>
<a href="/capital-journey" class="lnk">Open the capital journey</a>
</article>
<article class="torn tl card" style="background: #DCE6D2">
<div class="k">Lakes</div>
<h3 class="h3">Start with a circle</h3>
<p class="p">A Relational ID Circle can be a gentle first step for a team.</p>
<a href="/lakes" class="lnk">Find a lake</a>
</article>
</div>
</section>
</main>
<footer style="max-width: 1160px; margin: 0 auto; padding: 24px 32px 40px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; font-style: italic; color: #C9CCD6"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="Institute of Relational Being" style="width: 64px; height: 64px; display: block"><span>An open commons tended by the Institute of Relational Being. Every offering links to its makers. Examples in square brackets are placeholders while the River grows.</span></footer>
</div>
</template>

  }

      where: s.where, begin: s.begin, sent: s.sent, notSent: !s.sent,
      typedWhere: function (e) { self.setState({ where: e && e.target ? e.target.value : '' }); },
