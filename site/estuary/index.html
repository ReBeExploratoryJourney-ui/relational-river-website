<p style="margin: 0; font-size: 19px; max-width: 760px; line-height: 1.55">An estuary is where river meets sea, fresh water mixing with salt: one of the most alive places on Earth. Here, the relational ways we practise on our own meet the workplaces, schools and councils where we spend our days.</p>

<div class="k">An idea from the Institute of Relational Being</div>
<h2 class="h2">Relational Resource Departments</h2>
<p class="p" style="font-size: 17px">Alongside human resources, a small group that tends an organisation’s relationships with people, place and the more-than-human world: the creek behind the office, the Beings in its supply chain, the bioregion it belongs to.</p>
<p class="p" style="font-size: 17px">It can begin very simply, with a few colleagues and a monthly walk.</p>
</div>
<ol class="steps" style="flex: 1 1 340px; font-size: 17px">
<li>Find two or three colleagues who feel the same pull.</li>
<li>Begin with a monthly walk, or a meeting that starts outside.</li>
<li>Bring one small practice into ordinary work, such as a minute of noticing before decisions.</li>
<li>Share what you learn with others, so the idea can grow.</li>
</ol>
<div style="flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; border-top: 1.5px dashed rgba(47,43,40,0.35); padding-top: 20px">
<p class="p" style="flex: 1 1 420px; font-size: 17px; margin: 0">Would you like help setting up a Relational Resource Department in your business or organisation? Contact the Institute of Relational Being to arrange a conversation and consultation.</p>
<a href="mailto:instituteofrelationalbeing@gmail.com?subject=A%20Relational%20Resource%20Department%20for%20our%20organisation&amp;body=Hello%20IRB%2C%0A%0AWe%20would%20like%20to%20talk%20about%20setting%20up%20a%20Relational%20Resource%20Department.%0A%0AOur%20organisation%3A%0AWhere%20we%20are%3A%0AWhat%20we%20hope%20for%3A%0A%0AThank%20you%2C%0A" class="go tornbtn" style="background: #F5EEE1">Contact IRB for a consultation</a>

<div class="k">For founders and leaders</div>
<h2 class="h2" style="font-size: 26px">Ready to bring this into how you lead and build?</h2>
<p class="p" style="font-size: 17px">The first canal in the River rises lock by lock from Relational Resource Departments toward <a href="https://essense.school/" target="_blank" rel="noopener" style="color: #2F2B28">ESSENSE Business School</a>, which helps founders and leaders design business in tune with life.</p>

</section>
<section class="torn tr" style="background: #DCE6D2; padding: 32px 40px; display: flex; flex-direction: column; gap: 10px; color: #2F2B28">
<div class="k">Kinship in how we lead</div>
<h2 class="h2" style="font-size: 26px">When the living world has a voice in decisions</h2>
<p class="p" style="font-size: 17px; max-width: 800px">Kincentric Leadership offers an open toolkit for leading in kinship with all life: eight principles, thirty-four capacities, twelve case studies and more than a hundred practices for organisations, communities and movements.</p>
<p class="p" style="font-size: 17px; max-width: 800px">With The Repatterning Collective, they host the Co-creation with the More-than-Human sandbox: an hour of dialogue roughly once a month on approaches such as interspecies councils, nature on the board and rights of nature, each followed by a written synthesis anyone can read.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px 24px">
<a href="https://www.kincentricleadership.org/" target="_blank" rel="noopener" class="lnk">Kincentric Leadership</a>
<a href="https://repatterningcollective.substack.com/" target="_blank" rel="noopener" class="lnk">Sandbox sessions and syntheses</a>
</div>
<p class="p" style="margin: 0; font-size: 14px; font-style: italic">Both are wellsprings of the River. No formal partnership.</p>
