<header style="max-width: 1160px; margin: 0 auto; padding: 22px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="/flow" style="display: flex; align-items: center; gap: 12px; text-decoration: none; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="" style="width: 48px; height: 48px; display: block">Relational River</a>

<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 36px">
<a href="/flow" style="font-size: 15px; font-style: italic; min-height: 44px; display: inline-flex; align-items: center">Back to the whole River</a>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: -20px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Springs</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; line-height: 1.02">Bubbling up now</h1>
<p style="margin: 0; font-size: 19px; max-width: 760px; line-height: 1.55">A spring is where fresh water rises to the surface. These are offerings with a closing date: cohorts, courses and gatherings you can join if you move soon. Each one shows how long is left, and quietly slips away once its doors close. Some are shared by people, and some are <i>noticed by the River</i>, gathered each week with help from AI (<a href="/ai" style="color: inherit">how the River uses AI</a>).</p>
</div>
<div class="chips" role="group" aria-label="Format"><span class="chiplabel">Format</span>
<sc-for list="{{fmtChips}}" as="c" hint-placeholder-count="3"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
<div class="chips" role="group" aria-label="Cost"><span class="chiplabel">Cost</span>
<sc-for list="{{costChips}}" as="c" hint-placeholder-count="3"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
<sc-if value="{{none}}" hint-placeholder-val="{{ false }}"><p class="p" style="color: #EDEDED; font-size: 17px">Nothing is bubbling up with those choices just now. New springs rise all the time, so do come back.</p></sc-if>
<div class="cards">
<sc-for list="{{springs}}" as="s" hint-placeholder-count="3">
<article id="{{s.anchor}}" class="{{s.cls}}" style="background: {{s.bg}}">
<div class="soon">{{s.left}}</div>
<div class="k">{{s.kind}}</div>
<h3 class="h3">{{s.title}}</h3>
<div class="minor">With <a href="{{s.hostHref}}" style="color: inherit">{{s.host}}</a></div>
<p class="p">{{s.text}}</p>
<div class="minor">{{s.when}} · {{s.where}} · in {{s.lang}}</div>
<div class="minor"><b>{{s.cost}}</b><sc-if value="{{s.noticed}}" hint-placeholder-val="{{ false }}"> · Noticed by the River</sc-if></div>
<a href="{{s.href}}" class="lnk">{{s.cta}}</a>
<button class="aboard" aria-pressed="{{s.aboardOn}}" onClick="{{s.aboard}}">{{s.aboardLabel}}</button>
</article>
</sc-for>
</div>
<section class="torn tl" style="background: #FBF7EF; padding: 34px 40px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between; color: #2F2B28">
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 8px">
<h2 class="h2" style="font-size: 26px; color: #2F2B28">Know of a spring?</h2>
<p class="p" style="font-size: 17px">If you know of an offering with a closing date that belongs in the River, share it, with its link and the date doors close, in the Institute of Relational Being’s group on Hylo.</p>
</div>
<a href="https://www.hylo.com/groups/institute-of-relational-being" class="go tornbtn" style="background: #F5EEE1">Share a spring</a>
</section>

<h2 class="h2">Where this flows next</h2>

<div class="k">Lakes</div>

<p class="p">Fellowships, circles and gatherings you can join at any time.</p>
<a href="/lakes" class="lnk">Find a lake</a>
</article>
<article class="torn tr card" style="background: #DCE6D2">
<div class="k">Ocean</div>
<h3 class="h3">Projects around the world</h3>
<p class="p">The organisations behind these offerings, and many more.</p>
<a href="/ocean" class="lnk">Explore the ocean</a>
</article>
<article class="torn tl card" style="background: #F5E3B0">
<div class="k">The Well</div>

<a href="/well" class="lnk">Visit the Well</a>
</article>
</div>
</section>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":2000}}'>
class Component extends DCLogic {
  // ---- My Boat: kept on this device only (see /boat) ----
  boatRead() { try { var b = JSON.parse(localStorage.getItem('rr.boat.v1') || 'null'); return b && b.v === 1 ? b : null; } catch (x) { return null; } }
  boatHas(list, id) { var b = this.boatRead(); return !!(b && Array.isArray(b[list]) && b[list].some(function (g) { return g && g.id === id; })); }
  boatToggle(list, item) {
    var b = this.boatRead();
    if (!b) { try { sessionStorage.setItem('rr.boat.pending', JSON.stringify({ list: list, item: item })); } catch (x) {} window.location.href = '/boat'; return; }
    if (!Array.isArray(b[list])) { b[list] = []; }
    var had = b[list].some(function (g) { return g && g.id === item.id; });
    if (had && list === 'tending') { window.location.href = '/boat#tending'; return; }
    b[list] = b[list].filter(function (g) { return !g || g.id !== item.id; });
    if (!had) { var now = new Date().toISOString(), it = {}; for (var k in item) { it[k] = item[k]; } it.at = now; if (list === 'tending') { it.since = now; it.notes = []; } b[list].push(it); }
    b.dirty = true;
    try { localStorage.setItem('rr.boat.v1', JSON.stringify(b)); } catch (x) {}
    if (window.RiverBoat) { window.RiverBoat.touched(); }
    this.setState({ boatTick: (this.state.boatTick || 0) + 1 });
  }
  aboardFor(list, item) {
    var self = this, on = this.boatHas(list, item.id), tend = list === 'tending';
    return { aboardOn: on ? 'true' : 'false', aboardLabel: on ? (tend ? 'Tending in my Boat' : 'Aboard my Boat') : (tend ? 'Tend this in my Boat' : 'Bring aboard'), aboard: function () { self.boatToggle(list, item); } };
  }
  constructor(props) { super(props); this.state = { fmt: 'all', cost: 'all' }; }
  componentDidMount() { var self = this; try { fetch('/data/springs.json').then(function (r) { return r.ok ? r.json() : null; }).then(function (d) { if (d && d.springs) { self.setState({ data: d.springs }); } self.showLinked(); }).catch(function () { self.showLinked(); }); } catch (e) {} }
  // Links shared beyond the River (Murmurations profiles) point to /springs?spring=<id>: bring that spring into view.
  showLinked() { try { var id = new URLSearchParams(location.search).get('spring'); if (!id || !/^[a-z0-9-]+$/.test(id)) { return; } setTimeout(function () { var el = document.getElementById('spring-' + id); if (el) { var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; el.scrollIntoView({ behavior: still ? 'auto' : 'smooth', block: 'center' }); } }, 300); } catch (e) {} }
  chipVals(opts, key) {
    var self = this, cur = this.state[key];
    return opts.map(function (o) { var on = cur === o[0]; return { label: o[1], on: on ? 'true' : 'false', cls: on ? 'chip on' : 'chip', pick: function () { var s = {}; s[key] = o[0]; self.setState(s); } }; });
  }
