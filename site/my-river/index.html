<body>
<noscript><p style="color:#EDEDED;font-family:sans-serif;padding:24px">The Relational River needs JavaScript turned on to flow.</p></noscript>
<template id="rr-template">

<div style="background: linear-gradient(180deg, #231C4D 0%, #0E2849 42%, #174A5B 100%); font-family: Jost, sans-serif; color: #EDEDED; min-height: 100vh">
<header style="max-width: 1160px; margin: 0 auto; padding: 22px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="/flow" style="display: flex; align-items: center; gap: 12px; text-decoration: none; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="" style="width: 48px; height: 48px; display: block">Relational River</a>
<nav class="vnav" aria-label="Main">
<div class="vgroup"><button class="vbtn">Begin</button><div class="vmenu"><a href="/flow"><b>The River</b><span>the whole River at a glance</span></a><a href="/source"><b>The source</b><span>a minute of gentle questions</span></a><a href="/"><b>The arrival</b><span>watch the Beings gather</span></a></div></div>
<div class="vgroup"><button class="vbtn">Learn</button><div class="vmenu"><a href="/streams"><b>Streams</b><span>small practices for ordinary days</span></a><a href="/tributaries"><b>Tributaries</b><span>films, talks and readings</span></a><a href="/eddies"><b>Eddies</b><span>grief, gratitude and returning</span></a><a href="/moon"><b>Moon</b><span>tides, and Making with Moon</span></a><a href="/capital-journey"><b>Capital journey</b><span>money as part of the living world</span></a></div></div>
<div class="vgroup"><button class="vbtn">Connect</button><div class="vmenu"><a href="/lakes"><b>Lakes</b><span>circles, fellowships and retreats</span></a><a href="/local-currents"><b>Local currents</b><span>groups and circles near you</span></a><a href="/ocean"><b>Ocean and confluences</b><span>projects and collaborators worldwide</span></a><a href="/hylo"><b>Gather on Hylo</b><span>where River circles meet and organise</span></a></div></div>
<div class="vgroup"><button class="vbtn">Act</button><div class="vmenu"><a href="/channels"><b>Channels</b><span>ways to act, from small to large</span></a><a href="/waterfall"><b>Waterfall</b><span>offer an idea, see what it feeds</span></a><a href="/estuary"><b>Estuary</b><span>workplaces, schools and councils</span></a><a href="/groundwater"><b>Groundwater</b><span>emerging threads and systems</span></a></div></div>
<a href="/my-river" class="vmine here">My river</a>
</nav>
</header>

<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; line-height: 1">My river</h1>
<p style="margin: 0; font-size: 19px; max-width: 680px; line-height: 1.5">Wherever you are is the right place. Move downstream when you feel ready, sideways when something calls, and back when an eddy brings you round.</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
<nav aria-label="The waters" class="torn tall tl" style="flex: 1 1 300px; max-width: 360px; background: #FBF7EF; padding: 34px 22px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box">
<div style="font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; padding: 0 12px 10px">The waters</div>
<sc-for list="{{waters}}" as="w" hint-placeholder-count="9">
<button class="{{w.cls}}" aria-current="{{w.cur}}" onClick="{{w.pick}}"><span class="dot" aria-hidden="true"></span><span style="display: flex; flex-direction: column"><span>{{w.name}}</span><span style="font-size: 13px; font-weight: 400; font-style: italic">{{w.hint}}</span></span></button>
</sc-for>
</nav>

<section aria-live="polite" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase">{{here}}</div>
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 36px; letter-spacing: -0.02em">{{title}}</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.5; max-width: 620px">{{text}}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px">
<sc-for list="{{offers}}" as="o" hint-placeholder-count="3">
<article class="torn {{o.tilt}}" style="background: {{o.bg}}; padding: 28px 26px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">{{o.kind}}</div>
<h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 20px; line-height: 1.2">{{o.title}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.5">{{o.text}}</p>
<div style="font-size: 14px; font-style: italic">{{o.by}}</div>
<a href="{{o.href}}" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">{{o.cta}}</a>
</article>
</sc-for>
</div>
</section>
</div>

<section class="torn tr" style="background: #E6E2F2; padding: 40px 44px; display: flex; flex-wrap: wrap; gap: 36px; align-items: center">
<svg viewBox="0 0 260 200" role="img" aria-label="A constellation of relationships: you in the centre, joined to a tree, water, food, ancestors, neighbours and Moon" style="flex: 0 1 260px; width: 100%; max-width: 260px; height: auto">
<g stroke="#5B4A8B" stroke-width="1.3" fill="none"><path d="M130 100 L60 50 M130 100 L200 44 M130 100 L226 118 M130 100 L180 172 M130 100 L76 166 M130 100 L32 112"></path></g>
<circle cx="130" cy="100" r="13" fill="#5B4A8B"></circle>
<g fill="#FBF7EF" stroke="#5B4A8B" stroke-width="1.5"><circle cx="60" cy="50" r="9"></circle><circle cx="200" cy="44" r="9"></circle><circle cx="226" cy="118" r="9"></circle><circle cx="180" cy="172" r="9"></circle><circle cx="76" cy="166" r="9"></circle><circle cx="32" cy="112" r="9"></circle></g>
<g font-family="Jost, sans-serif" font-size="12" fill="#2F2B28"><text x="44" y="30">Oak</text><text x="186" y="24">Moon</text><text x="214" y="146">Creek</text><text x="168" y="196">Bread</text><text x="44" y="194">Ancestors</text><text x="4" y="92">Neighbours</text></g>
</svg>
<div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em">Your constellation</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.55">A private map of the relationships that make up your "we": Beings you have met through ReBe, places, foods, waters, ancestors, communities. When an eddy brings you back to the source, your earlier constellation sits beside the new one, so you can see how your "we" has grown.</p>
<p style="margin: 0; font-size: 14px; font-style: italic">Yours alone: never shared unless you choose, downloadable and deletable any time.</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center"><a href="/source" class="go tornbtn" style="background: #F5EEE1">Keep my constellation</a><span style="font-size: 14px; font-style: italic">(the only part that needs an account)</span></div>
</div>
</section>

<section class="torn tl" style="background: #DCE6D2; padding: 36px 44px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center">
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase">Your circles</div>
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em">Where you gather, on Hylo</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.55">If you choose to connect Hylo, the groups you belong to appear here beside your River, such as IRB’s circles or a private network you belong to, with their next gatherings. Private groups stay private: only you see them here. Only group names and public events flow in, and nothing from your River flows out.</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center"><a href="/hylo" class="go tornbtn" style="background: #F5EEE1">Connect Hylo, if you wish</a><span style="font-size: 14px; font-style: italic">Optional: everything else works without it.</span></div>
</div>
<ul style="flex: 1 1 300px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px" aria-label="Example of connected groups">
<li style="background: #FBF7EF; padding: 14px 18px; border-radius: 12px 16px 12px 18px"><b>Institute of Relational Being</b><br><span style="font-size: 14px; font-style: italic">[Next: a Relational ID Circle, Thursday evening]</span></li>
<li style="background: #FBF7EF; padding: 14px 18px; border-radius: 12px 16px 12px 18px"><b>[A private network you belong to]</b><br><span style="font-size: 14px; font-style: italic">[Next: a monthly gathering, online · visible only to you]</span></li>
</ul>
</section>
</main>
<footer style="max-width: 1160px; margin: 0 auto; padding: 24px 32px 40px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; font-style: italic; color: #C9CCD6"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="Institute of Relational Being" style="width: 64px; height: 64px; display: block"><span>An open commons tended by the Institute of Relational Being, with gratitude to every project it points to.</span></footer>
</div>
</template>
