<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 36px">
<a href="/my-river" style="font-size: 15px; font-style: italic; min-height: 44px; display: inline-flex; align-items: center">Back to my river</a>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: -20px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Tributary · energy</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; line-height: 1">Everything runs on energy</h1>
<p style="margin: 0; font-size: 19px; max-width: 700px; line-height: 1.5">Much of modern life rests on a few centuries of cheap, abundant energy from fossil fuels. Understanding that helps everything else make sense, and it is easier to take in than it sounds.</p>
</div>

<article class="torn tl" style="background: #CFE1E4; padding: 44px 48px; display: flex; flex-wrap: wrap; gap: 36px; align-items: center">
<div style="flex: 0 1 340px; width: 100%; max-width: 340px; aspect-ratio: 16 / 9; background: #2F2B28; color: #F3ECDF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 6px">
<svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true" fill="none" stroke="#F3ECDF" stroke-width="1.6"><circle cx="12" cy="12" r="10"></circle><path d="M10 8l6 4-6 4z" fill="#F3ECDF"></path></svg>
<span style="font-size: 13px; font-style: italic">Plays on the makers' own site</span>
</div>
<div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase">Film · 32 minutes · four acts · transcripts available</div>
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">The Great Simplification</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.5">An animated film by Nate Hagens and team: Energy Blind, The Human Superorganism, The Human Being, and The Great Simplification. A clear, humane overview of energy, our economy and the transition ahead.</p>
<div style="font-size: 15px; font-style: italic">Made by Nate Hagens and the Institute for the Study of Energy and Our Future</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center"><a href="https://thegreatsimplification.com/animations" class="go tornbtn" style="background: #F5EEE1">Watch on their site</a><button class="chip" onClick="{{watched}}">I've watched it</button></div>
</div>
</article>

<section class="torn tr" style="background: #FBF7EF; padding: 36px 44px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 24px">Before you watch</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.55; max-width: 760px">Parts of this may feel heavy. That is a normal, human response, and a sign that you care. Watch in pieces if you like, take a breath outside between acts, and come back to the river whenever you are ready.</p>
</section>

<sc-if value="{{hasWatched}}" hint-placeholder-val="{{ false }}">
<section aria-live="polite" style="display: flex; flex-direction: column; gap: 22px">
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">How did it land?</h2>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{lands}}" as="c" hint-placeholder-count="4"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
<sc-if value="{{hasLand}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 18px; font-style: italic; max-width: 720px">{{reply}}</p>
</sc-if>
</section>
</sc-if>

<section style="display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em">Gentle questions to sit with</h2>
<ul style="margin: 0; padding-left: 22px; font-size: 18px; line-height: 1.8; font-style: italic">
<li>Which energy reached you today, and from where?</li>
<li>What in your life would you keep, even with far less energy?</li>
<li>Who, human or more-than-human, would you want beside you in that simpler world?</li>
</ul>
</section>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px">
<article class="torn tl" style="background: #E6E2F2; padding: 32px 30px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">Eddy · if it feels heavy</div>
<h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 21px">Grief and care, together</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Good Grief Network circles and the Work That Reconnects help people hold what they feel with others, and turn it toward care.</p>
<a href="/local-currents" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">Find a circle near you</a>
</article>
<article class="torn tr" style="background: #F2D3BC; padding: 32px 30px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">Further downstream</div>
<h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 21px">Money, energy and value</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Nate Hagens and Indy Johar's conversation, Optionality Collapse, carries this further into what it means to hold and use money now.</p>
<a href="/capital-journey" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">Open the capital journey</a>
</article>
<article class="torn tl" style="background: #DCE6D2; padding: 32px 30px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">This returns</div>
<h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 21px">Watching again, later</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.5">This film comes round again further downstream, as something you might share with a workplace, a family or a circle.</p>
<a href="/my-river" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">Back to my river</a>
</article>

</main>
<footer style="max-width: 1160px; margin: 0 auto; padding: 24px 32px 40px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; font-style: italic; color: #C9CCD6"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="Institute of Relational Being" style="width: 64px; height: 64px; display: block"><span>An open commons tended by the Institute of Relational Being. Every offering links to its makers and is listed with their blessing.</span><a href="/privacy" style="color: #EDEDED; min-height: 44px; display: inline-flex; align-items: center">Privacy</a></footer>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1640}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { watched: false, land: null }; }
  renderVals() {
    var self = this, s = this.state;
    var replies = {
      heavy: 'Thank you for staying with it. You don’t have to carry this alone: the grief and care eddy below is a good next step, and the rest can wait.',
      eye: 'Many people feel that. When you’re ready, the capital journey and the local currents show what people are already doing.',
      familiar: 'Then you might enjoy going further downstream, or sharing this with someone who is just arriving.',
      unsure: 'That is a fine place to be. Perhaps step outside for a few minutes and let it settle before deciding anything.'
    };
    var opts = [['heavy', 'Heavy'], ['eye', 'Eye-opening'], ['familiar', 'Familiar'], ['unsure', 'Not sure yet']];
    return {
      watched: function () { self.setState({ watched: true }); },
      hasWatched: s.watched,
      lands: opts.map(function (o) { var on = s.land === o[0]; return { label: o[1], on: on ? 'true' : 'false', cls: on ? 'chip on' : 'chip', pick: function () { self.setState({ land: o[0] }); } }; }),
      hasLand: !!s.land,
      reply: s.land ? replies[s.land] : ''
    };
  }
}
</script>
