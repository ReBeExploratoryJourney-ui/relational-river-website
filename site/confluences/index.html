<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 36px">
<a href="/flow" style="font-size: 15px; font-style: italic; min-height: 44px; display: inline-flex; align-items: center">Back to the whole River</a>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: -20px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Confluences</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; line-height: 1.02">Many ways in</h1>
<p style="margin: 0; font-size: 19px; max-width: 760px; line-height: 1.55">The Relational River is one way in: a meshwork of remembrance and relational development, where we slow down and grow real relationships with the Beings, people and places around us.</p>
<p style="margin: 0; font-size: 19px; max-width: 760px; line-height: 1.55">Other currents tend other parts of how we find each other and work together: mapping, gathering knowledge, organising locally. Where streams meet, the water grows. We point to these kindred currents with gratitude, and say plainly how the River relates to each.</p>
</div>

<section class="torn tl" style="background: #FBF7EF; padding: 32px 40px; display: flex; flex-direction: column; gap: 10px; color: #2F2B28">
<h2 class="h2" style="font-size: 24px">How the River meets other currents</h2>
<ul class="steps" style="font-size: 17px">
<li>We link to kindred work rather than copy it. Each current here is best placed to tend its own part.</li>
<li>We share the River’s offerings in open formats, so other maps and directories can find them without anyone joining another platform.</li>
<li>Each current below says whether any partnership is involved. Unless it says so, there is none.</li>
</ul>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">Kindred currents</h2>
<div class="cards">
<article class="torn tl card" style="background: #CFE1E4">
<div class="k">Gathering and organising</div>
<h3 class="h3">Hylo</h3>
<p class="p">An open-source home for communities to build trust, share knowledge, make sense together and coordinate bioregional action. River circles already meet here, in the Institute of Relational Being’s group, alongside kindred communities such as the Planetary Health Alliance’s member network.</p>
<p class="meta" style="margin: 0">Relationship: where the River’s circles gather</p>
<a href="/hylo" class="lnk">Gather on Hylo</a>
</article>
<article class="torn tr card" style="background: #E6E2F2">
<div class="k">Knowledge for connectors</div>
<h3 class="h3">Catalist</h3>
<p class="p">A knowledge ecosystem for network weavers, event organisers and ecosystem mappers: a personal library, community spaces and a global map, so insight can flow between people and networks. Catalist seeded OMNI-Mapping, below.</p>
<p class="meta" style="margin: 0">Relationship: none</p>
<a href="https://www.catalist.network" target="_blank" rel="noopener" class="lnk">Explore Catalist</a>
</article>
<article class="torn tl card" style="background: #DCE6D2">
<div class="k">An open protocol</div>
<h3 class="h3">Murmurations</h3>
<p class="p">Like starlings moving together without a leader: an open protocol from the Open Co-op that lets groups share data across platforms and networks, while each keeps its own.</p>
<p class="meta" style="margin: 0">Relationship: the River shares its offerings this way</p>
<a href="https://murmurations.network" target="_blank" rel="noopener" class="lnk">About Murmurations</a>
</article>
<article class="torn tr card" style="background: #F2D3BC">
<div class="k">Maps that build on each other</div>
<h3 class="h3">OMNI-Mapping</h3>
<p class="p">A project of the Buckminster Fuller Institute’s Design Lab, inspired by Fuller’s design science, helping organisations make maps that are useful where they are and reusable everywhere.</p>
<p class="meta" style="margin: 0">Relationship: none</p>
<a href="https://www.bfi.org/programs/bfi-design-lab/omni-mapping-project/" target="_blank" rel="noopener" class="lnk">About OMNI-Mapping</a>
</article>
<article class="torn tl card" style="background: #F5E3B0">
<div class="k">Local, face to face</div>
<h3 class="h3">Karrot</h3>
<p class="p">A free, open-source tool for grassroots groups who coordinate face-to-face activities on a local, voluntary basis. It grew from food-saving circles and now serves many kinds of community.</p>
<p class="meta" style="margin: 0">Relationship: none</p>
<a href="https://karrot.world" target="_blank" rel="noopener" class="lnk">Visit Karrot</a>
</article>
<article class="torn tr card" style="background: #FBF7EF">
<div class="k">Finding more</div>
<h3 class="h3">Digital Spaces Directory</h3>
<p class="p">New_ Public’s directory of more than two hundred digital spaces designed with care for people and public life. A good place to look for the space that suits your group.</p>
<p class="meta" style="margin: 0">Relationship: none</p>
<a href="https://newpublic.org/directory" target="_blank" rel="noopener" class="lnk">Open the directory</a>
</article>
</div>
</section>

<section class="torn tr" style="background: #CFE1E4; padding: 32px 40px; display: flex; flex-direction: column; gap: 10px; color: #2F2B28">
<div class="k">Shared openly</div>
<h2 class="h2" style="font-size: 26px">The River’s offerings, readable by other maps</h2>
<p class="p" style="font-size: 17px; max-width: 780px">The River, the Canal and each open Spring are published as small Murmurations profiles, hosted by the River itself. Any map or directory that reads Murmurations can find them through the Murmurations index. A Spring’s profile always names and links its makers, and lets go on its own once the Spring closes.</p>
<p class="p" style="font-size: 17px; max-width: 780px">If your offering appears in our Springs and you publish your own profile, tell us and we will point to yours instead.</p>
<a href="/murmurations/index.json" class="lnk">See the River’s profiles</a>
</section>

<section class="torn tl" style="background: #E6E2F2; padding: 34px 42px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between; color: #2F2B28">
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 8px">
<h2 class="h2" style="font-size: 26px">Know a kindred current?</h2>
<p class="p" style="font-size: 17px">If you tend, or love, a platform that helps people find each other and work together, share it with the Institute of Relational Being on Hylo.</p>
</div>
<a href="https://www.hylo.com/groups/institute-of-relational-being" class="go tornbtn" style="background: #F5EEE1">Suggest a current on Hylo</a>
</section>

</article>

<h3 class="h3">Groups near you</h3>
<p class="p">Circles already tending the place you live, by bioregion.</p>
<a href="/local-currents" class="lnk">Find local currents</a>
