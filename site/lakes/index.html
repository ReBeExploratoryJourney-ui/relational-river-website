<div class="vgroup"><button class="vbtn">Begin</button><div class="vmenu"><a href="/flow"><b>The River</b><span>the whole River at a glance</span></a><a href="/source"><b>The source</b><span>a minute of gentle questions</span></a><a href="/"><b>The arrival</b><span>watch the Beings gather</span></a></div></div>

<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 36px">
<a href="/flow" style="font-size: 15px; font-style: italic; min-height: 44px; display: inline-flex; align-items: center">Back to the whole River</a>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: -20px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Lakes</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; line-height: 1.02">Still water, where we slow down together</h1>
<p style="margin: 0; font-size: 19px; max-width: 760px; line-height: 1.55">Lakes are where a river rests and gathers. People gather here too, in circles, fellowships and retreats where we can slow down, listen, and be changed in good company.</p>
</div>
<div class="chips" role="group" aria-label="Format"><span class="chiplabel">Format</span>
<sc-for list="{{fmtChips}}" as="c" hint-placeholder-count="3"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
<div class="cards">
<sc-for list="{{lakes}}" as="l" hint-placeholder-count="4">
<article class="{{l.cls}}" style="background: {{l.bg}}">
<div class="k">{{l.kind}}</div>
<h3 class="h3">{{l.title}}</h3>
<p class="p">{{l.text}}</p>
<sc-if value="{{l.idLink}}" hint-placeholder-val="{{ false }}"><a href="https://onrelationalbeing.substack.com/p/relational-identity-ecological-intersectionality" class="minor" style="min-height: 44px; display: inline-flex; align-items: center">What is Relational ID? Read the exploration on IRB’s Substack</a></sc-if>
<div class="minor">{{l.notes}}</div>
<a href="{{l.href}}" class="lnk">{{l.cta}}</a>
</article>
</sc-for>
</div>
<section style="display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">What a circle can feel like</h2>
<div class="cards">
<article class="torn tl card" style="background: #F5EEE1"><div class="k">1 · Arrive</div><p class="p">We open with the circle’s agreements and a round of introductions: who we are, and a Being we are in relationship with.</p></article>
<article class="torn tr card" style="background: #F5EEE1"><div class="k">2 · Listen</div><p class="p">One person speaks at a time, from the heart. Others listen without fixing, advising or commenting.</p></article>
<article class="torn tl card" style="background: #F5EEE1"><div class="k">3 · Practise</div><p class="p">Between gatherings, each of us carries a small practice outside: a Sit Spot, a picture made together, an evening with Moon.</p></article>
<article class="torn tr card" style="background: #F5EEE1"><div class="k">4 · Return</div><p class="p">We close by naming what we are carrying onward, and thank one another and the land.</p></article>
</div>
</section>
<section class="torn tl care">
<h2 class="h3" style="font-size: 24px">Held with care</h2>
<p class="p" style="max-width: 820px">Good circles have a host and shared agreements. What is shared in a circle stays in the circle, and stories are only passed on with permission. You can always step back, and nothing is ever required of you. If a circle doesn’t feel like this, it is fine to look for another.</p>
</section>
<section style="display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">Where this flows next</h2>
<div class="cards">
<article class="torn tl card" style="background: #CFE1E4">
<div class="k">Gather on Hylo</div>
<h3 class="h3">Where circles meet between gatherings</h3>
<p class="p">Meet others tending the River between gatherings, in the Institute of Relational Being’s group on Hylo.</p>
<a href="/hylo" class="lnk">Gather on Hylo</a>
</article>
<article class="torn tr card" style="background: #E6E2F2">
<div class="k">Eddies</div>
<h3 class="h3">When it feels heavy</h3>
<p class="p">Grief and gratitude practices to come back to, alone or together.</p>
<a href="/eddies" class="lnk">Visit the eddies</a>
</article>
<article class="torn tl card" style="background: #DCE6D2">
<div class="k">Streams</div>
<h3 class="h3">Practices to bring with you</h3>
<p class="p">Small daily practices that circles often share.</p>
<a href="/streams" class="lnk">See the streams</a>
</article>
</div>
</section>
</main>

</div>
