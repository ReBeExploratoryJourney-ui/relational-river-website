<sc-if value="{{h.filled}}" hint-placeholder-val="{{ true }}">
<svg class="rope" viewBox="0 0 100 44" aria-hidden="true"><path d="M50 0 C 46 18, 58 26, 64 42" fill="none" stroke="#D8C39A" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2"></path></svg>
<button class="hboat" aria-expanded="{{h.openAttr}}" aria-label="{{h.label}}" onClick="{{h.toggle}}"><span class="art"><img src="{{h.art}}" alt="" style="width: 100%; height: 100%; display: block"></span><span class="hname2">{{h.name}}<sc-if value="{{h.wyrd}}" hint-placeholder-val="{{ false }}"><svg class="wyrdmark" viewBox="0 0 32 32" role="img" aria-label="carries a wyrd spiral"><path d="M16 5 C 24 5, 28 11, 27 16 C 26 22, 20 25, 16 24 C 12 23, 10.5 19.5, 11.5 16.5 C 12.5 13.5, 15.5 12.5, 17.5 13.5 C 19.2 14.4, 19 16.4, 17.8 17.2" fill="none" stroke="#9A6E1E" stroke-width="3" stroke-linecap="round"></path><path d="M4 28 C 8 26, 12 30, 16 28 S 24 26, 28 28" fill="none" stroke="#9A6E1E" stroke-width="2.4" stroke-linecap="round"></path></svg></sc-if></span></button>
<div class="hpop">
<article class="torn {{h.tilt}} hcard" style="background: {{h.bg}}">
<button class="hclose" onClick="{{h.close}}">Close</button>
<h3 class="hname">{{h.name}}</h3>
<sc-if value="{{h.hasPlace}}" hint-placeholder-val="{{ false }}"><div class="hplace">{{h.place}}</div></sc-if>
<p class="p" style="margin: 0; font-size: 16px; line-height: 1.5">{{h.working}}</p>
<sc-if value="{{h.hasInvite}}" hint-placeholder-val="{{ false }}"><p class="p" style="margin: 0; font-size: 15px; line-height: 1.5"><b>How to join in:</b> {{h.invite}}</p></sc-if>
<sc-if value="{{h.hasTags}}" hint-placeholder-val="{{ false }}"><div class="htags"><sc-for list="{{h.tags}}" as="t" hint-placeholder-count="2"><span class="htag">{{t.label}}</span></sc-for></div></sc-if>
<div class="hfoot">
<sc-if value="{{h.hasHylo}}" hint-placeholder-val="{{ false }}"><a class="hylo hylobtn" href="{{h.hylo}}" target="_blank" rel="noopener" aria-label="{{h.hyloLabel}}"><img src="/assets/hylo-merkaba.svg" alt=""><span><b>Meet them on Hylo</b><small>Opens their Hylo profile, where you can send a message</small></span></a></sc-if>
<button class="hreport" onClick="{{h.report}}">{{h.reportLabel}}</button>
</div>
<sc-if value="{{h.reporting}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="{{h.rid}}" style="font-size: 14px; font-weight: 600">What concerns you? (optional)</label>
<textarea id="{{h.rid}}" class="hfield" rows="2" maxlength="500" onChange="{{h.typeReason}}"></textarea>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><button class="fchip on" onClick="{{h.send}}">Send to the stewards</button><button class="hreport" onClick="{{h.cancel}}">Never mind</button></div>
</div>
</sc-if>
<sc-if value="{{h.reported}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 14px; font-style: italic">Thank you. The Harbour’s stewards will take a look.</p></sc-if>
</article>
</div>
</sc-if>
<sc-if value="{{h.empty}}" hint-placeholder-val="{{ false }}"><div class="ghost">{{h.ghost}}</div></sc-if>
</div>
</sc-for>
</div>
</div>
<p style="margin: 0; font-size: 15px; font-style: italic">Hover over a Boat, or tap it on a phone, to read its card.</p>

<section class="torn tr" style="background: #F5E3B0; padding: 34px 42px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between; color: #2F2B28">
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 8px">
<h2 class="h2" style="font-size: 26px">Moor your own Boat</h2>
<p class="p" style="font-size: 17px">If you are working on something and would welcome others, open your Boat to the Harbour. You write your card, you can change it any time, and you can leave whenever you like.</p>
</div>
<a href="/boat#harbour" class="go tornbtn" style="background: #F5EEE1">Moor your Boat</a>
</section>

<section id="care" class="torn tl" style="background: #FBF7EF; padding: 32px 40px; display: flex; flex-direction: column; gap: 10px; color: #2F2B28">
<div class="k">Care agreements</div>
<h2 class="h2" style="font-size: 26px">How we moor together</h2>
<ul class="steps" style="font-size: 17px">
<li>Be kind and honest about who you are and what you are working on.</li>
<li>Share only your own words and work, and no one else’s personal details.</li>
<li>The Harbour is for connecting and collaborating, not for advertising, selling or recruiting into unrelated schemes.</li>
<li>Meet people on Hylo with the same care, and respect a quiet “no, thank you”.</li>
<li>Honour Indigenous knowledge and its keepers. Stories, ceremonies and teachings are shared only with their consent.</li>
<li>Stewards from the Institute of Relational Being look over the Harbour regularly, and may rest a card out of view if it does not follow these agreements.</li>
<li>If three people raise a concern about a card within a week, it rests out of view until a steward has looked at it.</li>
<li>You can update your card or leave the Harbour at any time, and leaving takes effect straight away.</li>
</ul>
<p class="p" style="font-size: 15px">The Harbour is part of the River’s <a href="/privacy" style="color: #2F2B28">privacy promise</a>. Questions or concerns can also go to the Institute of Relational Being’s group on <a href="https://www.hylo.com/groups/institute-of-relational-being" target="_blank" rel="noopener" style="color: #2F2B28">Hylo</a>.</p>
</section>

<footer style="max-width: 1160px; margin: 0 auto; padding: 24px 32px 40px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; font-style: italic; color: #C9CCD6"><a href="https://instituteofrelationalbeing.org" target="_blank" rel="noopener" aria-label="The Institute of Relational Being (opens in a new tab)" style="display: block; min-height: 44px"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="" style="width: 64px; height: 64px; display: block"></a><span>An open commons tended by the Institute of Relational Being. Every offering links to its makers.</span><a href="/privacy" style="color: #EDEDED; min-height: 44px; display: inline-flex; align-items: center">Privacy</a><a href="/ai" style="color: #EDEDED; min-height: 44px; display: inline-flex; align-items: center">How the River uses AI</a></footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1600}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { boats: null, problem: '', theme: 'all', reporting: '', reasons: {}, reported: {}, open: '' }; }
  componentDidMount() {
    var self = this, rb = window.RiverBoat;
    if (!rb || !rb.harbourList) { this.setState({ boats: [], problem: 'The Harbour could not be reached just now. Please try again in a little while.' }); return; }
    rb.harbourList().then(function (rows) { self.setState({ boats: Array.isArray(rows) ? rows : [] }); }, function (e) { self.setState({ boats: [], problem: e.message }); });
  }
  renderVals() {
    var self = this, s = this.state;
    var THEMES = [['land', 'Land and water'], ['beings', 'Beings and bioregions'], ['grief', 'Grief and care'], ['money', 'Money and value'], ['work', 'Work and leadership'], ['learning', 'Learning and seeing'], ['gathering', 'Gathering and community'], ['art', 'Art and story']];
    var LABEL = {}; THEMES.forEach(function (t) { LABEL[t[0]] = t[1]; });
    var all = s.boats || [];
    var shown = s.theme === 'all' ? all : all.filter(function (h) { return (h.themes || []).indexOf(s.theme) >= 0; });
    var BG = ['#CFE1E4', '#DCE6D2', '#E6E2F2', '#F2D3BC', '#F5E3B0', '#FBF7EF'];
    var okHylo = function (u) { return typeof u === 'string' && /^https:\/\/(www\.)?hylo\.com\//.test(u) ? u : ''; };
    return {
      loading: s.boats === null,
      problem: s.problem,
      empty: s.boats !== null && !s.problem && shown.length === 0,
      emptyTitle: all.length ? 'No Boats with that theme yet' : 'The Harbour is quiet for now',
      emptyText: all.length ? 'Try another theme, or moor your own Boat with this one.' : 'Be one of the first to moor your Boat here, and invite others into what you are working on.',
      filters: [['all', 'All Boats']].concat(THEMES).map(function (t) { var on = s.theme === t[0]; return { label: t[1], on: on ? 'true' : 'false', cls: on ? 'fchip on' : 'fchip', pick: function () { self.setState({ theme: t[0] }); } }; }),
      berths: (function () {
        var LK = window.RiverBoatLooks;
        var filled = shown.map(function (h, i) {
          var id = h.owner_id, hylo = okHylo(h.hylo_url), rep = s.reporting === id, open = s.open === id;
          return {
            cls: 'berth' + (open ? ' open' : ''), filled: true, empty: false, wyrd: (h.keeps || []).indexOf('spiral') >= 0, openAttr: open ? 'true' : 'false',
            art: LK ? LK.uri(LK.byId(h.look).id || 'river', (h.keeps || []).filter(function (k) { return /^(pennant|lantern|garland|crescent|star|ripples|spiral)$/.test(k); })) : '', label: h.display_name + '’s Boat. Show their card',
            toggle: function () { self.setState({ open: self.state.open === id ? '' : id }); },
            close: function () { self.setState({ open: '' }); },
            tilt: i % 2 ? 'tr' : 'tl', bg: BG[i % BG.length], name: h.display_name, place: h.place || '', hasPlace: !!h.place,
            working: h.working_on, invite: h.invitation || '', hasInvite: !!h.invitation,
            tags: (h.themes || []).filter(function (k) { return LABEL[k]; }).map(function (k) { return { label: LABEL[k] }; }), hasTags: (h.themes || []).some(function (k) { return LABEL[k]; }),
            hylo: hylo, hasHylo: !!hylo, hyloLabel: 'Meet ' + h.display_name + ' on Hylo: opens their Hylo profile, where you can send a message (opens in a new tab)',
            reportLabel: s.reported[id] ? 'Concern sent' : 'Raise a concern', reporting: rep && !s.reported[id], reported: !!s.reported[id], rid: 'r' + i,
            report: function () { if (self.state.reported[id]) { return; } self.setState({ reporting: rep ? '' : id, open: id }); },
            typeReason: function (e) { self.state.reasons[id] = e && e.target ? e.target.value : ''; },
            cancel: function () { self.setState({ reporting: '' }); },
            send: function () {
              window.RiverBoat.harbourReport(id, self.state.reasons[id] || '').then(function () { var r = {}; for (var k in self.state.reported) { r[k] = 1; } r[id] = 1; self.setState({ reported: r, reporting: '' }); },
                function (e) { self.setState({ problem: e.message }); });
            }
          };
        });
        var w = (typeof window !== 'undefined' && window.innerWidth) || 1200, cols = w >= 960 ? 4 : w >= 641 ? 3 : 2;

        var n0 = filled.length;
        for (var k = n0; k < total; k++) { filled.push({ cls: 'berth empty', filled: false, empty: true, ghost: k === n0 ? 'A berth, waiting for you' : '' }); }
        return filled;
      })()
    };
  }
}
</script>
