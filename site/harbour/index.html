<body>
<noscript><p style="color:#EDEDED;font-family:sans-serif;padding:24px">The Relational River needs JavaScript turned on to flow.</p></noscript>
<template id="rr-template">

<div style="background: linear-gradient(180deg, #231C4D 0%, #0E2849 42%, #174A5B 100%); font-family: Jost, sans-serif; color: #EDEDED; min-height: 100vh">
<header style="max-width: 1160px; margin: 0 auto; padding: 22px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="/flow" style="display: flex; align-items: center; gap: 12px; text-decoration: none; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="" style="width: 48px; height: 48px; display: block">Relational River</a>
<nav class="vnav" aria-label="Main">
<div class="vgroup"><button class="vbtn">Begin</button><div class="vmenu"><a href="/flow"><b>The River</b><span>the whole River at a glance</span></a><a href="/source"><b>The source</b><span>a minute of gentle questions</span></a><a href="/"><b>The arrival</b><span>watch the Beings gather</span></a></div></div>
<div class="vgroup"><button class="vbtn">Learn</button><div class="vmenu"><a href="/streams"><b>Streams</b><span>small practices for ordinary days</span></a><a href="/tributaries"><b>Tributaries</b><span>films, talks and readings</span></a><a href="/ways-of-seeing"><b>Ways of seeing</b><span>three horizons, emergence, philosophy</span></a><a href="/eddies"><b>Eddies</b><span>grief, gratitude and returning</span></a><a href="/moon"><b>Moon</b><span>tides, and Making with Moon</span></a><a href="/capital-journey"><b>Capital journey</b><span>money as part of the living world</span></a></div></div>
<div class="vgroup"><button class="vbtn here">Connect</button><div class="vmenu"><a href="/springs"><b>Springs</b><span>offerings to join soon</span></a><a href="/lakes"><b>Lakes</b><span>circles, fellowships and retreats</span></a><a href="/islands"><b>Islands of coherence</b><span>steady places in turbulent water</span></a><a href="/local-currents"><b>Local currents</b><span>groups and circles near you</span></a><a href="/ocean"><b>Ocean</b><span>projects and collaborators worldwide</span></a><a href="/confluences"><b>Confluences</b><span>kindred platforms, many ways in</span></a><a href="/harbour"><b>Harbour</b><span>Boats open to collaborating</span></a><a href="/hylo"><b>Gather on Hylo</b><span>where River circles meet and organise</span></a><a href="/well"><b>The Well</b><span>wonder, wit, wisdom and wealth to share</span></a></div></div>
<div class="vgroup"><button class="vbtn">Act</button><div class="vmenu"><a href="/channels"><b>Channels</b><span>ways to act, from small to large</span></a><a href="/waterfall"><b>Waterfall</b><span>offer an idea, see what it feeds</span></a><a href="/estuary"><b>Estuary</b><span>workplaces, schools and councils</span></a><a href="/canal"><b>The Canal</b><span>guided paths toward deeper offerings</span></a><a href="/groundwater"><b>Groundwater</b><span>emerging threads and systems</span></a></div></div>
<a href="/boat" class="vmine">Your Boat</a>
</nav>
</header>

<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 36px">
<a href="/flow" style="font-size: 15px; font-style: italic; min-height: 44px; display: inline-flex; align-items: center">Back to the whole River</a>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: -20px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">The Harbour</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; line-height: 1.02">Boats open to connecting</h1>
<p style="margin: 0; font-size: 19px; max-width: 760px; line-height: 1.55">In the Harbour, collaborators moor their Boats when they are open to meeting others, especially when they are working on something and would welcome company in the process. Each card shares only what its owner chose to write.</p>
<p style="margin: 0; font-size: 19px; max-width: 760px; line-height: 1.55">When something here sparks, reach out on Hylo, where conversations and collaborations can grow.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase" id="flabel">Find Boats by theme</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px" role="group" aria-labelledby="flabel"><sc-for list="{{filters}}" as="f" hint-placeholder-count="9"><button class="{{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
</div>

<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-style: italic; font-size: 17px">Looking around the Harbour…</p></sc-if>
<sc-if value="{{problem}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 17px">{{problem}}</p></sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<section class="torn tl" style="background: #FBF7EF; padding: 32px 40px; display: flex; flex-direction: column; gap: 10px; color: #2F2B28">
<h2 class="h2" style="font-size: 24px">{{emptyTitle}}</h2>
<p class="p" style="font-size: 17px">{{emptyText}}</p>
<a href="/boat#harbour" class="lnk">Moor your Boat</a>
</section>
</sc-if>
<div class="hgrid">
<sc-for list="{{boats}}" as="h" hint-placeholder-count="3">
<article class="torn {{h.tilt}} hcard" style="background: {{h.bg}}">
<h3 class="hname">{{h.name}}</h3>
<sc-if value="{{h.hasPlace}}" hint-placeholder-val="{{ false }}"><div class="hplace">{{h.place}}</div></sc-if>
<p class="p" style="margin: 0; font-size: 16px; line-height: 1.5">{{h.working}}</p>
<sc-if value="{{h.hasInvite}}" hint-placeholder-val="{{ false }}"><p class="p" style="margin: 0; font-size: 15px; line-height: 1.5"><b>How to join in:</b> {{h.invite}}</p></sc-if>
<sc-if value="{{h.hasTags}}" hint-placeholder-val="{{ false }}"><div class="htags"><sc-for list="{{h.tags}}" as="t" hint-placeholder-count="2"><span class="htag">{{t.label}}</span></sc-for></div></sc-if>
<div class="hfoot">
<sc-if value="{{h.hasHylo}}" hint-placeholder-val="{{ false }}"><a class="hylo" href="{{h.hylo}}" target="_blank" rel="noopener" aria-label="{{h.hyloLabel}}"><img src="/assets/hylo-merkaba.svg" alt="">Hylo</a></sc-if>
<button class="hreport" onClick="{{h.report}}">{{h.reportLabel}}</button>
</div>
<sc-if value="{{h.reporting}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="{{h.rid}}" style="font-size: 14px; font-weight: 600">What concerns you? (optional)</label>
<textarea id="{{h.rid}}" class="hfield" rows="2" maxlength="500" onChange="{{h.typeReason}}"></textarea>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><button class="fchip on" onClick="{{h.send}}">Send to the stewards</button><button class="hreport" onClick="{{h.cancel}}">Never mind</button></div>
</div>
</sc-if>
<sc-if value="{{h.reported}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 14px; font-style: italic">Thank you. The Harbour’s stewards will take a look.</p></sc-if>
</article>
</sc-for>
</div>

<section class="torn tr" style="background: #F5E3B0; padding: 34px 42px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between; color: #2F2B28">
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 8px">
<h2 class="h2" style="font-size: 26px">Moor your own Boat</h2>
<p class="p" style="font-size: 17px">If you are working on something and would welcome others, open your Boat to the Harbour. You write your card, you can change it any time, and you can leave whenever you like.</p>
</div>
<a href="/boat#harbour" class="go tornbtn" style="background: #F5EEE1">Moor your Boat</a>
</section>

<section id="care" class="torn tl" style="background: #FBF7EF; padding: 32px 40px; display: flex; flex-direction: column; gap: 10px; color: #2F2B28">
<div class="k">Care agreements</div>
<h2 class="h2" style="font-size: 26px">How we moor together</h2>
<ul class="steps" style="font-size: 17px">
<li>Be kind and honest about who you are and what you are working on.</li>
<li>Share only your own words and work, and no one else’s personal details.</li>
<li>The Harbour is for connecting and collaborating, not for advertising, selling or recruiting into unrelated schemes.</li>
<li>Meet people on Hylo with the same care, and respect a quiet “no, thank you”.</li>
<li>Honour Indigenous knowledge and its keepers. Stories, ceremonies and teachings are shared only with their consent.</li>
<li>Stewards from the Institute of Relational Being look over the Harbour regularly, and may rest a card out of view if it does not follow these agreements.</li>
<li>If three people raise a concern about a card within a week, it rests out of view until a steward has looked at it.</li>
<li>You can update your card or leave the Harbour at any time, and leaving takes effect straight away.</li>
</ul>
<p class="p" style="font-size: 15px">The Harbour is part of the River’s <a href="/privacy" style="color: #2F2B28">privacy promise</a>. Questions or concerns can also go to the Institute of Relational Being’s group on <a href="https://www.hylo.com/groups/institute-of-relational-being" target="_blank" rel="noopener" style="color: #2F2B28">Hylo</a>.</p>
</section>

<footer style="max-width: 1160px; margin: 0 auto; padding: 24px 32px 40px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; font-style: italic; color: #C9CCD6"><a href="https://instituteofrelationalbeing.org" target="_blank" rel="noopener" aria-label="The Institute of Relational Being (opens in a new tab)" style="display: block; min-height: 44px"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="" style="width: 64px; height: 64px; display: block"></a><span>An open commons tended by the Institute of Relational Being. Every offering links to its makers.</span><a href="/privacy" style="color: #EDEDED; min-height: 44px; display: inline-flex; align-items: center">Privacy</a><a href="/ai" style="color: #EDEDED; min-height: 44px; display: inline-flex; align-items: center">How the River uses AI</a></footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1600}}'>

    var LABEL = {}; THEMES.forEach(function (t) { LABEL[t[0]] = t[1]; });

      emptyTitle: all.length ? 'No Boats with that theme yet' : 'The Harbour is quiet for now',

      filters: [['all', 'All Boats']].concat(THEMES).map(function (t) { var on = s.theme === t[0]; return { label: t[1], on: on ? 'true' : 'false', cls: on ? 'fchip on' : 'fchip', pick: function () { self.setState({ theme: t[0] }); } }; }),
      boats: shown.map(function (h, i) {
        var id = h.owner_id, hylo = okHylo(h.hylo_url), rep = s.reporting === id;
        return {
          tilt: i % 2 ? 'tr' : 'tl', bg: BG[i % BG.length], name: h.display_name, place: h.place || '', hasPlace: !!h.place,
          working: h.working_on, invite: h.invitation || '', hasInvite: !!h.invitation,
          tags: (h.themes || []).filter(function (k) { return LABEL[k]; }).map(function (k) { return { label: LABEL[k] }; }), hasTags: (h.themes || []).some(function (k) { return LABEL[k]; }),
          hylo: hylo, hasHylo: !!hylo, hyloLabel: 'Open ' + h.display_name + '’s profile on Hylo (opens in a new tab)',
          reportLabel: s.reported[id] ? 'Concern sent' : 'Raise a concern', reporting: rep && !s.reported[id], reported: !!s.reported[id], rid: 'r' + i,
          report: function () { if (self.state.reported[id]) { return; } self.setState({ reporting: rep ? '' : id }); },
          typeReason: function (e) { self.state.reasons[id] = e && e.target ? e.target.value : ''; },
          cancel: function () { self.setState({ reporting: '' }); },
          send: function () {
            window.RiverBoat.harbourReport(id, self.state.reasons[id] || '').then(function () { var r = {}; for (var k in self.state.reported) { r[k] = 1; } r[id] = 1; self.setState({ reported: r, reporting: '' }); },
              function (e) { self.setState({ problem: e.message }); });
          }
        };
      })
    };
  }
}
