<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Ways of seeing</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 50px; letter-spacing: -0.03em; line-height: 1.04">Lenses for a living world</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.55">Three short lessons, each a different lens on how change happens: how futures grow out of the present, how the new emerges when we slow down, and how philosophy can become a daily practice. Each is offered by people and organisations who live this work; follow the links to learn from them directly.</p>
<nav class="chips" aria-label="Lessons on this page" style="margin-top: 6px">
<a class="chip" href="#horizons">Three horizons</a><a class="chip" href="#emergence">Emergence</a><a class="chip" href="#practice">Philosophy as practice</a><a class="chip" href="#land">Learning on the land</a>
</nav>

<section id="horizons" class="torn tall tl" style="background: #FBF7EF; padding: 40px 44px; display: flex; flex-direction: column; gap: 16px; color: #2F2B28">
<div class="k">Lesson one</div>
<h2 class="h2">Three horizons: seeing the future in the present</h2>
<p class="p" style="font-size: 17px; max-width: 800px">Three Horizons is a simple way to think about transformation, developed by Bill Sharpe and colleagues at the International Futures Forum. It imagines three patterns, all alive right now, each rising or falling over time. Tap a horizon to explore it.</p>
<div class="hz-wrap">
<svg class="hz" viewBox="0 0 600 300" role="img" aria-label="Three curves over time: the first horizon starts high and falls, the second rises and falls in the middle, the third starts low and rises.">
<line x1="40" y1="260" x2="580" y2="260" stroke="#8C8178" stroke-width="1.5"></line>

<text x="560" y="284" font-size="14" fill="#4A443F" text-anchor="end" font-family="Jost, sans-serif">time</text>
<text x="22" y="40" font-size="14" fill="#4A443F" font-family="Jost, sans-serif" transform="rotate(-90 22 40)" text-anchor="end">prevalence</text>
<path d="M40 60 C 200 60, 300 120, 380 200 S 520 250, 580 252" fill="none" stroke="#8A4B2A" stroke-width="{{w1}}" stroke-linecap="round" opacity="{{o1}}"></path>
<path d="M60 250 C 160 240, 220 110, 310 105 S 460 220, 560 250" fill="none" stroke="#2B4A5E" stroke-width="{{w2}}" stroke-linecap="round" opacity="{{o2}}"></path>

<div class="hz-notes">
<div><div class="k">Two kinds of second horizon</div><p class="p">Many innovations of the middle horizon get absorbed back into business as usual, which keeps the old system going a little longer. Others help open the way to something truly new. Practitioners sometimes call these H2 minus and H2 plus.</p></div>
<div><div class="k">Caring for both ends</div><p class="p">Three Horizons asks us to tend the old as it ends and the new as it begins. Graham Leicester of the International Futures Forum puts it this way: “We must be hospice workers for the dying culture and midwives for the new.”</p></div>
<div><div class="k">Where the River sits</div><p class="p">Islands of coherence, the Well and the threads in the groundwater are third-horizon seeds and second-horizon bridges: ways of living the future we hope for, now, in relationship.</p></div>
</div>
<div class="partner">
<div><div class="k">Partner: Third Horizon Earth</div><p class="p">A nonpartisan knowledge and practice platform, based in Geneva, that works with regenerative pioneers. It gathers peer-based intelligence and tools, connects the dots between people and projects, and advocates for the conditions regenerative change needs, locally and globally.</p></div>
<div class="plinks"><a href="https://thirdhorizon.earth/" class="go tornbtn" style="background: #DCE6D2">Visit Third Horizon Earth</a><a href="https://www.h3uni.org" class="lnk">H3Uni: learning for the third horizon</a><a href="https://www.thinknpc.org/resource-hub/systems-practice-toolkit/the-three-horizons-framework/" class="lnk">A practical guide to Three Horizons</a></div>

<section id="emergence" style="display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch">
<div style="flex: 1 1 480px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Lesson two</div>
<h2 class="h2">Emergence: the times are urgent, let us slow down</h2>
<p class="p" style="font-size: 18px; color: #EDEDED">Emergence is how something new arises from many relationships at once, in ways no single part could plan: a murmuration of starlings, a forest, a movement. It asks for a different kind of attention than control.</p>
<p class="p" style="font-size: 18px; color: #EDEDED">The poet, philosopher and psychologist Báyò Akómoláfé, founder of The Emergence Network, is known for the invitation “the times are urgent, let us slow down.” He is careful to say that slowing down is not about speed or taking a holiday, but about deepening awareness and noticing the others in the room. His idea of <i>postactivism</i> asks whether the ways we respond to crisis can repeat the very patterns we hope to change, and invites us to <i>make sanctuary</i>: places of radical hospitality where the human is no longer the centre of everything.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px">
<a href="https://emergencenetwork.org/" class="go tornbtn" style="background: #E6E2F2">Visit The Emergence Network</a>
<a href="https://emergencenetwork.org/postactivism-crossroads-archive/" class="lnk" style="color: #EDEDED; align-self: center">Explore postactivism</a>
<a href="https://emergencenetwork.org/play-translocal-calendar/" class="lnk" style="color: #EDEDED; align-self: center">Their translocal calendar</a>
</div>
</div>
<div class="torn tr card" style="flex: 1 1 320px; background: #E6E2F2">
<div class="k">A practice to try</div>
<h3 class="h3">Slow noticing</h3>
<ul class="steps" style="font-size: 16px">
<li>Choose a place you pass every day.</li>
<li>Stop for five minutes and notice who else is there: Beings, sounds, light.</li>
<li>Ask what you might not be seeing because you were hurrying.</li>
<li>Let it change one small thing in how you act today.</li>
</ul>
<a href="/eddies" class="lnk">More slow practices in the eddies</a>
</div>

<section id="practice" class="torn tl" style="background: #F5EEE1; padding: 36px 42px; display: flex; flex-direction: column; gap: 14px; color: #2F2B28">
<div class="k">Lesson three</div>
<h2 class="h2">Philosophy as practice: life as a lab</h2>
<p class="p" style="font-size: 17px; max-width: 820px">Philosophy does not have to stay in books. The Institute for Practical ekoPhilosophy, founded and led by Dr Jessica Böhme, treats philosophy as a practical response to the crises of our time. It treats everyday life as a living laboratory, values first-person experience as a way of knowing, and welcomes the more-than-human world as a participant in knowing, not just an object of study.</p>
<div class="cards" style="grid-template-columns: repeat(auto-fit, minmax(230px, 1fr))">
<article class="torn tr card" style="background: #DCE6D2"><div class="k">PhilosophyGym</div><h3 class="h3">Practising sense-making</h3><p class="p">A space to practise making sense of messy times, for the public and for organisations.</p><a href="https://www.institute-pep.com/philosophygym2627" class="lnk">About the PhilosophyGym</a></article>
<article class="torn tl card" style="background: #CFE1E4"><div class="k">Life as Lab Fellowship</div><h3 class="h3">Living the questions</h3><p class="p">A fellowship for treating your own life as a place of philosophical experiment.</p><a href="https://www.institute-pep.com/fellowship" class="lnk">About the fellowship</a></article>
<article class="torn tr card" style="background: #E6E2F2"><div class="k">Life as Lab Playground</div><h3 class="h3">Play with The Emergence Network</h3><p class="p">A playground hosted with The Emergence Network, where these two partners meet.</p><a href="https://emergencenetwork.org/theplaygrounds/" class="lnk">Visit the playground</a></article>
<article class="torn tl card" style="background: #F5E3B0"><div class="k">PhilosophyGyms in Europe</div><h3 class="h3">Gyms across the EU</h3><p class="p">A European network of PhilosophyGyms.</p><a href="https://www.philosophygyms.eu" class="lnk">philosophygyms.eu</a></article>
</div>
<p class="p" style="font-size: 16px; font-style: italic">The River itself is a kind of lab: a provotype, changing as we learn together.</p>
</section>

<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Learning on the land</div>
<h2 class="h2">Regeneration, learned with the forest</h2>
<p class="p" style="font-size: 18px; color: #EDEDED">Some lessons can only be learned with your hands in the soil. Siendo Naturaleza, which means “being nature”, is a learning centre in the Peruvian Amazon, founded by Eliane Cohen, an alumna of Schumacher College. Eliane and Siendo Naturaleza have collaborated with the Institute of Relational Being many times over recent years. It offers land-based learning and applied research toward regenerative, culturally rooted ways of restoring biodiversity and strengthening communities, with programmes for local communities and for learners from around the world.</p>
<p class="p" style="font-size: 18px; color: #EDEDED">Its short courses, from one to three weeks, include regenerative agriculture, systems thinking, deep ecology and ecological architecture. There are also internships, research residencies, placements and university partnerships.</p>
