<div class="vgroup"><button class="vbtn">Act</button><div class="vmenu"><a href="/channels"><b>Channels</b><span>ways to act, from small to large</span></a><a href="/waterfall"><b>Waterfall</b><span>offer an idea, see what it feeds</span></a><a href="/estuary"><b>Estuary</b><span>workplaces, schools and councils</span></a><a href="/groundwater"><b>Groundwater</b><span>emerging threads and systems</span></a></div></div>

<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 36px">
<a href="/flow" style="font-size: 15px; font-style: italic; min-height: 44px; display: inline-flex; align-items: center">Back to the whole River</a>
<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: center; margin-top: -20px">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Eddies</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; line-height: 1.02">Water that swirls back, so we meet things again</h1>
<p style="margin: 0; font-size: 19px; max-width: 700px; line-height: 1.55">Behind a boulder, river water curls back upstream in a trail of swirls, turning one way, then the other. Eddies are where the River holds us like that: places to rest, grieve, give thanks and return. They come round at natural turning points, and feel different each time.</p>
</div>

</svg></div>
</div>
<section class="torn tr" style="background: #FBF7EF; padding: 32px 40px; display: flex; flex-direction: column; gap: 10px; color: #2F2B28">
<div class="k">The next turning points</div>
<h2 class="h3" style="font-size: 24px">{{turnTitle}}</h2>
<ul class="steps" style="list-style: none; padding-left: 0">
<sc-for list="{{turns}}" as="t" hint-placeholder-count="3"><li><b>{{t.name}}</b> · {{t.when}}</li></sc-for>
</ul>
<p class="minor" style="margin: 0">{{hemiNote}}</p>
<div class="chips"><span class="chiplabel">Seasons for</span><sc-for list="{{hemiChips}}" as="c" hint-placeholder-count="2"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
</section>
<div class="cards">
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<article class="{{it.cls}}" style="background: {{it.bg}}">
<div class="k">{{it.kind}}</div>
<h3 class="h3">{{it.title}}</h3>
<p class="p">{{it.text}}</p>
<div class="minor">{{it.meta}}</div>
<button class="toggle" aria-expanded="{{it.openAttr}}" onClick="{{it.toggle}}">{{it.toggleLabel}}</button>
<sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
<ol class="steps"><sc-for list="{{it.steps}}" as="st" hint-placeholder-count="4"><li>{{st}}</li></sc-for></ol>
</sc-if>
<sc-if value="{{it.hasCredit}}" hint-placeholder-val="{{ false }}"><div class="minor">{{it.credit}}</div></sc-if>
<sc-if value="{{it.hasLink}}" hint-placeholder-val="{{ false }}"><a href="{{it.href}}" class="lnk">{{it.cta}}</a></sc-if>
</article>
</sc-for>
</div>
<section class="torn tl care">
<h2 class="h3" style="font-size: 24px">If it becomes too much</h2>
<p class="p" style="max-width: 820px">Grief, anxiety or despair about the world are human responses, and signs of how much you care. If they become too heavy to carry, please reach out to someone you trust. If you are in crisis or thinking about harming yourself, you deserve support right now: in the US call or text 988; in Ireland and the UK call Samaritans on 116 123; anywhere else, findahelpline.com lists free, confidential lines near you.</p>
</section>
<section style="display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">Where this flows next</h2>
<div class="cards">
<article class="torn tl card" style="background: #CFE1E4">
<div class="k">Lakes</div>
<h3 class="h3">Grieve and give thanks together</h3>
<p class="p">Circles where these practices are shared in good company, held by a host.</p>
<a href="/lakes" class="lnk">Find a lake</a>
</article>
<article class="torn tr card" style="background: #F2D3BC">
<div class="k">Tributaries</div>
<h3 class="h3">Understanding, gently</h3>
<p class="p">Films and readings that help the moment make sense, with care close by.</p>
<a href="/tributaries" class="lnk">Open a tributary</a>
</article>
<article class="torn tl card" style="background: #DCE6D2">
<div class="k">Moon</div>
<h3 class="h3">A turning point twice a month</h3>
<p class="p">New and full Moon are natural times to return.</p>
<a href="/moon" class="lnk">About Moon</a>
</article>
</div>
</section>
</main>
<footer style="max-width: 1160px; margin: 0 auto; padding: 24px 32px 40px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; font-style: italic; color: #C9CCD6"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="Institute of Relational Being" style="width: 64px; height: 64px; display: block"><span>An open commons tended by the Institute of Relational Being. Every offering links to its makers. Examples in square brackets are placeholders while the River grows.</span><a href="/privacy" style="color: #EDEDED; min-height: 44px; display: inline-flex; align-items: center">Privacy</a></footer>
</div>
