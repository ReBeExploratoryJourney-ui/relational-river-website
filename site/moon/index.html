<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; line-height: 1.02">Moon moves the waters, and we are water too</h1>
<p style="margin: 0; font-size: 19px; max-width: 700px; line-height: 1.55">Twice a day the seas rise and fall as Earth turns beneath Moon. For as long as people have lived beside coasts and rivers, Moon has shaped when we fish, plant, gather and rest. Pausing to notice Moon is a simple, embodied way to feel part of the same moving water as the oceans and the River.</p>
</div>

<svg viewBox="0 0 120 120" width="170" height="170" style="overflow: visible" role="img" aria-label="Moon tonight, about {{moonLit}}% lit"><defs><radialGradient id="mglow" cx="50%" cy="50%" r="50%"><stop offset="55%" stop-color="#F6E7B8" stop-opacity="0.9"></stop><stop offset="75%" stop-color="#F2D88E" stop-opacity="0.35"></stop><stop offset="100%" stop-color="#F2D88E" stop-opacity="0"></stop></radialGradient><filter id="msoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"></feGaussianBlur></filter><filter id="medge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="0.9"></feGaussianBlur></filter><mask id="mlit"><path d="{{moonPath}}" fill="#fff" filter="url(#msoft)"></path></mask><mask id="mdisc"><circle cx="60" cy="60" r="45.5" fill="#fff" filter="url(#medge)"></circle></mask></defs><circle cx="60" cy="60" r="72" fill="url(#mglow)" opacity="{{moonGlow}}"></circle><g mask="url(#mdisc)"><circle cx="60" cy="60" r="46" fill="#26304F" opacity="0.82"></circle><image href="/assets/65d5e771747b3670dcaa271a5a85ddc8.png" x="14" y="14" width="92" height="92" opacity="0.16" preserveAspectRatio="xMidYMid slice"></image><image href="/assets/65d5e771747b3670dcaa271a5a85ddc8.png" x="14" y="14" width="92" height="92" mask="url(#mlit)" preserveAspectRatio="xMidYMid slice"></image></g></svg>
<div class="h3" style="text-align: center">Tonight Moon is {{moonName}}</div>
<div class="minor" style="text-align: center">about {{moonLit}}% lit</div>
</div>
</div>
<section class="torn tl" style="background: #CFE1E4; padding: 32px 40px; display: flex; flex-direction: column; gap: 10px; color: #2F2B28">
<div class="k">Tides and turning points</div>
<p class="p" style="font-size: 17px">{{tide}}</p>
<p class="p" style="font-size: 17px"><b>Next new Moon:</b> {{nextNew}} &nbsp;·&nbsp; <b>Next full Moon:</b> {{nextFull}}</p>
<p class="minor" style="margin: 0">Moon’s pull on the water within us is tiny. The invitation is to notice, not to measure.</p>
</section>

</sc-if>
