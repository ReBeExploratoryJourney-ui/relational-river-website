<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 400; font-size: 52px; line-height: 1.05; color: #DCDCDC">The River points the way. Hylo is where we meet.</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.55">Hylo is a not-for-profit, open-source community platform made for purpose-driven and place-based groups, with a living map, nested groups, events, and requests and offers. Rather than building its own social network, the Relational River flows into Hylo, so circles, projects and networks can gather in a commons that shares the River’s values.</p>

<div class="torn tr" style="background: #E6E2F2; padding: 26px 26px; display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase">4 · Grow together</div><h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-size: 20px">Two open commons</h3><p style="margin: 0; font-size: 15px; line-height: 1.5">The River and Hylo are both open-source and made with their communities. We hope to explore with the Hylo team how the two can work together more closely.</p></div>
