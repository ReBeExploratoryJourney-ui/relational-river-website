<main style="max-width: 1160px; margin: 0 auto; padding: 24px 32px 64px; display: flex; flex-direction: column; gap: 40px">
<section style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 18px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">The source</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 64px; line-height: 0.98; letter-spacing: -0.03em">Arrive wherever you are.</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; max-width: 560px">The Relational River is a free guide to the living world and the many people already tending it. There is nothing to know first and nothing to get right. A few gentle questions help us suggest where to begin.</p>
<p style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-style: italic; font-size: 18px; line-height: 1.5; max-width: 560px; color: #E8C77A">Earth is every human’s first home. All our ancestors once lived in close relationship with the land and ecology they were a part of, and that belonging is still here for each of us.</p>
<p style="margin: 0; font-size: 15px; font-style: italic; color: #C9CCD6">No account needed. Nothing is scored. You can always choose differently.</p>
</div>
<svg viewBox="0 0 360 300" role="img" aria-label="A spring rising from the ground and becoming a stream" style="flex: 0 1 360px; width: 100%; max-width: 360px; height: auto">
<path d="M20 240 C 90 225, 130 250, 190 238 S 300 228, 340 244" fill="none" stroke="#9FB6BE" stroke-width="2"></path>
<path d="M176 236 C 170 200, 190 170, 178 130 S 150 70, 176 30" fill="none" stroke="#9FD3DC" stroke-width="5" stroke-linecap="round"></path>
<path d="M190 236 C 196 205, 214 182, 206 150" fill="none" stroke="#9FD3DC" stroke-width="3" stroke-linecap="round"></path>
<circle cx="176" cy="30" r="8" fill="#CFE1E4" stroke="#9FD3DC" stroke-width="2"></circle>
<path d="M120 238 C 120 220, 110 205, 98 196 M120 238 C 122 222, 134 210, 146 204" fill="none" stroke="#A9C79A" stroke-width="2.5" stroke-linecap="round"></path>
<path d="M250 236 C 252 214, 262 200, 274 192" fill="none" stroke="#A9C79A" stroke-width="2.5" stroke-linecap="round"></path>

</section>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="font-size: 19px; font-weight: 600; padding: 0; margin-bottom: 12px">How are you feeling about the state of the world right now? <span style="font-weight: 400; font-style: italic; font-size: 15px">(choose as many as feel true)</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{feelings}}" as="c" hint-placeholder-count="6"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
</fieldset>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="font-size: 19px; font-weight: 600; padding: 0; margin-bottom: 12px">What do you already love outside? <span style="font-weight: 400; font-style: italic; font-size: 15px">(choose any)</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{loves}}" as="c" hint-placeholder-count="6"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
</fieldset>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="font-size: 19px; font-weight: 600; padding: 0; margin-bottom: 12px">How do you most like to take things in? <span style="font-weight: 400; font-style: italic; font-size: 15px">(choose any)</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{ways}}" as="c" hint-placeholder-count="5"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 8px; max-width: 420px">
<label for="area" style="font-size: 19px; font-weight: 600">Where do you live, roughly? <span style="font-weight: 400; font-style: italic; font-size: 15px">(optional, only to find groups near you)</span></label>
<input id="area" type="text" placeholder="A town, a valley, a watershed" style="font-family: Jost, sans-serif; font-size: 16px; padding: 12px 14px; min-height: 44px; box-sizing: border-box; border: 1.5px solid #8C8178; border-radius: 10px 14px 10px 16px; background: #FFFFFF; color: #2F2B28">
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<button class="go tornbtn" onClick="{{show}}">Show me where to begin</button>
<span style="font-size: 15px; font-style: italic; color: #5A524B">or <a href="/my-river">just wander the river</a></span>
</div>
</section>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<section aria-live="polite" style="display: flex; flex-direction: column; gap: 22px">
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em">Here is one gentle way in</h2>
<p style="margin: 0; font-size: 17px; font-style: italic; max-width: 700px">{{intro}}</p>

<article class="torn {{k.tilt}}" style="background: {{k.bg}}; padding: 32px 30px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase">{{k.water}}</div>
<h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 22px; line-height: 1.15">{{k.title}}</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.5">{{k.text}}</p>
<sc-if value="{{k.idLink}}" hint-placeholder-val="{{ false }}"><a href="https://onrelationalbeing.substack.com/p/relational-identity-ecological-intersectionality" style="font-size: 14px; font-style: italic; min-height: 44px; display: inline-flex; align-items: center">What is Relational ID? Read the exploration on IRB’s Substack</a></sc-if>
<div style="font-size: 14px; font-style: italic">{{k.by}}</div>
<a href="{{k.href}}" style="margin-top: 6px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">{{k.cta}}</a>
</article>
</sc-for>
</div>
<div class="torn tr" style="background: #E6E2F2; padding: 28px 34px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<p style="margin: 0; font-size: 17px; max-width: 640px">Try drawing a <strong>constellation</strong> of the relationships that make up your “we”: you in the middle, and the Beings, places and people you belong with all around. My river shows how.</p>
<a href="/my-river" class="go tornbtn" style="background: #F5EEE1">Draw my constellation</a>
</div>
</section>
</sc-if>
</main>

</div>
</template>

    };
  }
}
