.tornbtn{-webkit-mask-image:url(/assets/232fefe1f5d15d4abbe5b6dde9a575e8.png);mask-image:url(/assets/232fefe1f5d15d4abbe5b6dde9a575e8.png);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;background-image:url(/assets/0aab009eb547b7652846ddf7be52a067.jpg)!important;background-size:520px!important;background-blend-mode:multiply;color:#2F2B28}

<body>
<noscript><p style="color:#EDEDED;font-family:sans-serif;padding:24px">The Relational River needs JavaScript turned on to flow.</p></noscript>
<template id="rr-template">

<div style="background: linear-gradient(180deg, #231C4D 0%, #0E2849 42%, #174A5B 100%); font-family: Jost, sans-serif; color: #EDEDED; min-height: 100vh">
<header style="max-width: 1160px; margin: 0 auto; padding: 22px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="/flow" style="display: flex; align-items: center; gap: 12px; text-decoration: none; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="" style="width: 48px; height: 48px; display: block">Relational River</a>
<nav class="vnav" aria-label="Main">
<div class="vgroup"><button class="vbtn">Begin</button><div class="vmenu"><a href="/flow"><b>The River</b><span>the whole River at a glance</span></a><a href="/source"><b>The source</b><span>a minute of gentle questions</span></a><a href="/"><b>The arrival</b><span>watch the Beings gather</span></a></div></div>
<div class="vgroup"><button class="vbtn">Learn</button><div class="vmenu"><a href="/tributaries"><b>Tributaries</b><span>films, talks and readings</span></a><a href="/tributaries"><b>Eddies</b><span>grief, gratitude and returning practices</span></a><a href="Capital/my-river"><b>Capital journey</b><span>money as part of the living world</span></a></div></div>
<div class="vgroup"><button class="vbtn here">Connect</button><div class="vmenu"><a href="/local-currents"><b>Local currents</b><span>groups and circles near you</span></a><a href="/ocean"><b>Ocean and confluences</b><span>projects and collaborators worldwide</span></a><a href="/hylo"><b>Gather on Hylo</b><span>where River circles meet and organise</span></a></div></div>
<div class="vgroup"><button class="vbtn">Act</button><div class="vmenu"><a href="/channels"><b>Channels</b><span>ways to act, from small to large</span></a><a href="/waterfall"><b>Waterfall</b><span>offer an idea, see what it feeds</span></a><a href="/channels"><b>Groundwater</b><span>emerging threads and systems</span></a></div></div>
<a href="/my-river" class="vmine">My river</a>
</nav>
</header>

<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">The ocean</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; line-height: 1">Everything already flowing</h1>
<p style="margin: 0; font-size: 19px; max-width: 740px; line-height: 1.5">A meshwork of projects around the world, tending land, water, culture and one another. Find them by theme, place or what they need, and meet them as relationships.</p>
</div>

<div role="group" aria-label="Filter by theme" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="5"><button class="{{t.cls}}" aria-pressed="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
</div>

<div aria-live="polite" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="6">
<article class="torn {{p.tilt}}" style="background: #FBF7EF; padding: 28px 28px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">{{p.place}}</div>
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 21px">{{p.name}}</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5">{{p.text}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><span class="tag">{{p.theme}}</span></div>
<a href="{{p.href}}" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">Visit their site</a>
</article>
</sc-for>
</div>
<p style="margin: -12px 0 0; font-size: 14px; font-style: italic; color: #C9CCD6">Sample listings for this mockup. Each project appears only once it has said yes.</p>

<section style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Networks gathering on Hylo</div>
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">Where the conversation lives</h2>
<p style="margin: 0; font-size: 17px; max-width: 740px; line-height: 1.5">Many networks in the ocean already gather on Hylo, a not-for-profit, open-source commons with nested groups and a living map. The River shows the way to them, and the conversations stay with the groups themselves.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px">
<article class="torn tl" style="background: #DCE6D2; padding: 28px 28px; display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">Home group · on Hylo</div><h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 21px">Institute of Relational Being</h3><p style="margin: 0; font-size: 15px; line-height: 1.5">Circles, gatherings in Laurel and Fryman Canyons and at Corra Woods, and the people tending the Relational River together.</p><a href="https://www.hylo.com/groups/institute-of-relational-being/chat" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">Join IRB on Hylo</a></article>
<article class="torn tr" style="background: #DCE6D2; padding: 28px 28px; display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">Networks · on Hylo</div><h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 21px">[A network that has chosen to be listed]</h3><p style="margin: 0; font-size: 15px; line-height: 1.5">Many networks on Hylo are private and held by invitation. They appear here only if their members decide together to be found.</p><a href="/hylo" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">Gather on Hylo</a></article>
<article class="torn tl" style="background: #FBF7EF; padding: 28px 28px; display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">Your network?</div><h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 21px">[A network you steward on Hylo]</h3><p style="margin: 0; font-size: 15px; line-height: 1.5">Add your Hylo network with its link, themes and bioregions, and it can appear here and in Local currents.</p><a href="/hylo" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">Add a Hylo group</a></article>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Confluences</div>
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em">Where streams meet</h2>
<p style="margin: 0; font-size: 18px; max-width: 720px; line-height: 1.5">Each project keeps a simple profile of what it offers and what it needs, so organisations working in parallel can find each other. The River suggests connections; the projects decide.</p>
</div>
<article class="torn tl" style="background: #CFE1E4; padding: 38px 44px; display: flex; flex-wrap: wrap; gap: 32px">
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">Example profile</div>
<h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 26px">Corra Woods</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.5">County Clare, between Lough Derg and Lough Graney. A home for retreats, workshops and residencies of the Institute of Relational Being.</p>
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 8px">
<h4 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 17px">Offers</h4>
<ul style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.7"><li>Space for gatherings</li><li>Relational practice and facilitation</li><li>[Seasonal residencies]</li></ul>
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 8px">
<h4 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 17px">Looking for</h4>
<ul style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.7"><li>Local partners in woodland care</li><li>Ecologists for a baseline survey</li><li>[Volunteers for spring]</li></ul>
</div>
<div style="flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 14px; align-items: center"><a href="/ocean" class="go tornbtn">Suggest a connection</a><span style="font-size: 14px; font-style: italic">A possible match nearby: Hometree, native woodland restoration in Clare</span></div>
</article>
<div class="torn tr" style="background: #F2D3BC; padding: 28px 38px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<p style="margin: 0; font-size: 17px; max-width: 680px">Holding wealth and wondering where it might help? Begin with the capital journey: learning first, then meeting projects as relationships.</p>
<a href="Capital/my-river" class="go tornbtn">Open the capital journey</a>
</div>
</section>
</main>
<footer style="max-width: 1160px; margin: 0 auto; padding: 24px 32px 40px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; font-style: italic; color: #C9CCD6"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="Institute of Relational Being" style="width: 64px; height: 64px; display: block"><span>An open commons tended by the Institute of Relational Being, with gratitude to every project it points to.</span></footer>
</div>
</template>

</body>
</html>
