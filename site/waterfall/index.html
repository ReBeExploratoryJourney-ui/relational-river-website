<link href="/fonts/fonts.css" rel="stylesheet">
<style>
body{margin:0}
a{color:#EDEDED}a:hover{color:#FFFFFF}
.torn{color:#2F2B28}.torn a{color:#2F2B28}.torn a:hover{color:#3E3270}
a:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px dashed #9FD3DC;outline-offset:3px}
.torn{-webkit-mask-image:url(/assets/621b5e5167095299f6f29e7b96675bac.png);mask-image:url(/assets/621b5e5167095299f6f29e7b96675bac.png);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;background-image:url(/assets/0aab009eb547b7652846ddf7be52a067.jpg)!important;background-size:520px!important;background-blend-mode:multiply}
.tornbtn{-webkit-mask-image:url(/assets/232fefe1f5d15d4abbe5b6dde9a575e8.png);mask-image:url(/assets/232fefe1f5d15d4abbe5b6dde9a575e8.png);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;background-image:url(/assets/0aab009eb547b7652846ddf7be52a067.jpg)!important;background-size:520px!important;background-blend-mode:multiply;color:#2F2B28}
.chip{-webkit-mask-image:url(/assets/16dc687d69c8a9da92896e785f4647a8.png);mask-image:url(/assets/16dc687d69c8a9da92896e785f4647a8.png);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;background-image:url(/assets/0aab009eb547b7652846ddf7be52a067.jpg)!important;background-size:520px!important;background-blend-mode:multiply;border:none!important}
.tl{transform:rotate(-0.8deg)}.tr{transform:rotate(0.7deg)}
.chip{font-family:Jost,sans-serif;font-size:15px;color:#2F2B28;background:#FBF7EF;padding:9px 16px;min-height:44px;cursor:pointer}
.chip.on{background:#9FD3DC;font-weight:600}
.go{font-family:'Averia Serif Libre',Georgia,serif;font-weight:700;font-size:19px;color:#2F2B28;background:#F5EEE1;border:none;padding:16px 30px;min-height:52px;cursor:pointer;text-decoration:none;display:inline-block}
.go:disabled{opacity:.55;cursor:not-allowed}
.nav a{text-decoration:none;font-size:15px;padding:12px 4px;min-height:44px;display:inline-flex;align-items:center}
@keyframes fall{to{stroke-dashoffset:-60}}
.curtain{stroke-dasharray:10 14;animation:fall 1.4s linear infinite}
.curtain.c2{animation-duration:1.9s}.curtain.c3{animation-duration:1.6s}
@keyframes mist{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.55;transform:translateY(-4px)}}
.mist{animation:mist 4s ease-in-out infinite}
@keyframes drop{0%{transform:translate(0,0);opacity:1}55%{transform:translate(0,190px);opacity:1}100%{transform:translate(0,230px);opacity:0}}
.drop{animation:drop 1.6s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes spread{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
.spread{stroke-dasharray:200;animation:spread 1.2s ease-out .9s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s ease-out both}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.drop{opacity:0}}
.vnav{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.vgroup{position:relative}
.vbtn{font-family:Jost,sans-serif;font-size:16px;color:#EDEDED;background:transparent;border:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px}
.vbtn:hover,.vgroup:focus-within .vbtn{background:rgba(220,220,220,0.12)}
.vbtn.here{font-weight:600;text-decoration:underline;text-underline-offset:7px;text-decoration-color:#9FD3DC;text-decoration-thickness:2px}
.vmenu{display:none;position:absolute;right:0;top:100%;z-index:30;min-width:280px;background:#F5EEE1;border-radius:12px 16px 12px 18px;padding:8px;box-shadow:0 14px 34px rgba(0,0,0,0.4)}
.vgroup:hover .vmenu,.vgroup:focus-within .vmenu{display:block}
.vmenu a{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 12px;min-height:44px;text-decoration:none;color:#2F2B28;border-radius:8px}
.vmenu a:hover,.vmenu a:focus-visible{background:#E6DDCC;color:#2F2B28}
.vmenu b{font-weight:600;font-size:15px}
.vmenu span{font-size:13px;color:#5A524B}
.vmine{font-weight:600;font-size:16px;padding:9px 16px;min-height:44px;display:inline-flex;align-items:center;border:1.5px solid #9FD3DC;border-radius:8px;text-decoration:none;margin-left:6px}
.vmine.here{background:rgba(159,211,220,0.18)}
@media (max-width: 700px){
.torn{-webkit-mask-image:url(/assets/09ceeae36cf3c1b66d92f6027bd916aa.png),url(/assets/19506af6ec26f2d77dc8f8be13783a4e.png),linear-gradient(#000,#000)!important;mask-image:url(/assets/09ceeae36cf3c1b66d92f6027bd916aa.png),url(/assets/19506af6ec26f2d77dc8f8be13783a4e.png),linear-gradient(#000,#000)!important;-webkit-mask-size:100% 30px,100% 30px,calc(100% - 3px) calc(100% - 56px)!important;mask-size:100% 30px,100% 30px,calc(100% - 3px) calc(100% - 56px)!important;-webkit-mask-position:top center,bottom center,center!important;mask-position:top center,bottom center,center!important;-webkit-mask-repeat:no-repeat!important;mask-repeat:no-repeat!important}
}
@media (max-width: 700px){
.vnav{position:relative;width:100%}
.vgroup{position:static}
.vmenu{left:0;right:0;min-width:0;width:auto}
}
</style>
<style>body{background:#0E2849}</style>
</head>
<body>
<noscript><p style="color:#EDEDED;font-family:sans-serif;padding:24px">The Relational River needs JavaScript turned on to flow.</p></noscript>
<template id="rr-template">

<div style="background: linear-gradient(180deg, #231C4D 0%, #0E2849 42%, #174A5B 100%); font-family: Jost, sans-serif; color: #EDEDED; min-height: 100vh">
<header style="max-width: 1160px; margin: 0 auto; padding: 22px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="/flow" style="display: flex; align-items: center; gap: 12px; text-decoration: none; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 700; font-size: 26px"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="" style="width: 48px; height: 48px; display: block">Relational River</a>
<nav class="vnav" aria-label="Main">
<div class="vgroup"><button class="vbtn">Begin</button><div class="vmenu"><a href="/flow"><b>The River</b><span>the whole River at a glance</span></a><a href="/source"><b>The source</b><span>a minute of gentle questions</span></a><a href="/"><b>The arrival</b><span>watch the Beings gather</span></a></div></div>
<div class="vgroup"><button class="vbtn">Learn</button><div class="vmenu"><a href="/streams"><b>Streams</b><span>small practices for ordinary days</span></a><a href="/tributaries"><b>Tributaries</b><span>films, talks and readings</span></a><a href="/eddies"><b>Eddies</b><span>grief, gratitude and returning</span></a><a href="/moon"><b>Moon</b><span>tides, and Making with Moon</span></a><a href="/capital-journey"><b>Capital journey</b><span>money as part of the living world</span></a></div></div>
<div class="vgroup"><button class="vbtn">Connect</button><div class="vmenu"><a href="/lakes"><b>Lakes</b><span>circles, fellowships and retreats</span></a><a href="/local-currents"><b>Local currents</b><span>groups and circles near you</span></a><a href="/ocean"><b>Ocean and confluences</b><span>projects and collaborators worldwide</span></a><a href="/hylo"><b>Gather on Hylo</b><span>where River circles meet and organise</span></a><a href="/well"><b>The Well</b><span>wonder, wit, wisdom and wealth to share</span></a></div></div>
<div class="vgroup"><button class="vbtn here">Act</button><div class="vmenu"><a href="/channels"><b>Channels</b><span>ways to act, from small to large</span></a><a href="/waterfall"><b>Waterfall</b><span>offer an idea, see what it feeds</span></a><a href="/estuary"><b>Estuary</b><span>workplaces, schools and councils</span></a><a href="/groundwater"><b>Groundwater</b><span>emerging threads and systems</span></a></div></div>
<a href="/my-river" class="vmine">My river</a>
</nav>
</header>

<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 34px">
<div style="display: flex; flex-wrap: wrap; gap: 36px; align-items: center">
<div style="flex: 1 1 480px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #C9CCD6">The waterfall</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 400; font-size: 54px; line-height: 1.05; color: #DCDCDC">Where gathered energy spills into new streams</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.55">Water gathers quietly in the lake until it reaches an edge, then cascades into motion. Offer an idea, a hope or a question to the falls, and see which streams it might feed: offerings already in the River, people who might care, and one small first step.</p>
</div>
<div style="flex: 0 1 360px; width: 100%; max-width: 360px; position: relative">
<img src="/assets/3e2f8e1980a595d86c0e38594cf1309d.svg" alt="" style="position: absolute; left: 0; top: 0; width: 100%; height: auto; display: block">
<svg viewBox="0 0 360 340" aria-hidden="true" style="position: relative; width: 100%; height: auto; display: block">
<g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-opacity="0.85"><path class="curtain" d="M128 101 C 123 118, 111 190, 96 274" stroke-width="2.4"></path><path class="curtain c2" d="M140 101 C 136 118, 126 190, 115 281" stroke-width="3"></path><path class="curtain c3" d="M152 102 C 149 118, 142 190, 134 288" stroke-width="2"></path><path class="curtain" d="M163 103 C 161 118, 156 190, 151 279" stroke-width="3.2"></path><path class="curtain c2" d="M174 104 C 173 118, 171 190, 168 286" stroke-width="2.6"></path><path class="curtain c3" d="M186 104 C 186 118, 187 190, 187 277" stroke-width="2.4"></path><path class="curtain" d="M197 103 C 198 118, 201 190, 204 284" stroke-width="3"></path><path class="curtain c2" d="M208 102 C 210 118, 215 190, 222 275" stroke-width="2"></path><path class="curtain c3" d="M219 102 C 222 118, 230 190, 239 282" stroke-width="3.2"></path><path class="curtain" d="M231 101 C 235 118, 246 190, 258 289" stroke-width="2.6"></path><path class="curtain c2" d="M241 100 C 246 118, 259 190, 273 280" stroke-width="2.4"></path></g>
<g class="mist" fill="#FFFFFF" fill-opacity="0.55"><path d="M148 290 Q137 296 130 297 Q123 297 115 296 Q107 296 100 295 Q93 294 96 290 Q98 286 106 284 Q115 283 123 283 Q131 284 139 285 Q146 287 147 289 L148 290 Z"></path><path d="M215 294 Q206 302 199 303 Q192 303 184 303 Q176 303 166 301 Q156 300 151 297 Q146 294 151 291 Q156 288 166 286 Q176 284 184 284 Q192 285 199 286 Q206 287 210 291 L215 294 Z"></path><path d="M275 290 Q262 296 255 296 Q248 297 240 297 Q233 296 226 295 Q219 294 222 290 Q225 286 233 285 Q240 283 249 283 Q257 283 265 285 Q272 287 274 288 L275 290 Z"></path></g>
<g class="mist" fill="#DFF3F6" fill-opacity="0.3"><circle cx="110" cy="272" r="14"></circle><circle cx="150" cy="266" r="18"></circle><circle cx="196" cy="262" r="20"></circle><circle cx="240" cy="268" r="16"></circle><circle cx="270" cy="276" r="12"></circle><circle cx="176" cy="278" r="22"></circle></g>
<sc-if value="{{falling}}" hint-placeholder-val="{{ false }}">
<circle class="drop" cx="180" cy="70" r="9" fill="#E8C77A"></circle>
</sc-if>
<sc-if value="{{hasResult}}" hint-placeholder-val="{{ false }}">
<g fill="none" stroke="#E8C77A" stroke-width="3" stroke-linecap="round"><path class="spread" d="M190 305 C 150 315, 100 320, 40 334"></path><path class="spread" d="M190 305 C 190 318, 188 326, 186 338"></path><path class="spread" d="M190 305 C 230 315, 280 322, 330 334"></path></g>
</sc-if>
</svg>
</div>
</div>

<section class="torn tl" style="background: #FBF7EF; padding: 44px 48px; display: flex; flex-direction: column; gap: 18px" aria-labelledby="offer-title">
<h2 id="offer-title" style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 700; font-size: 28px">Offer something to the falls</h2>
<label for="idea" style="font-size: 17px; font-weight: 600">Your idea, hope or question</label>
<textarea id="idea" rows="4" value="{{idea}}" onChange="{{typed}}" placeholder="For example: a seed library for our watershed, or bringing grief circles into my school" style="font-family: Jost, sans-serif; font-size: 17px; line-height: 1.5; padding: 14px 16px; box-sizing: border-box; width: 100%; border: 1.5px solid #8C8178; border-radius: 12px 16px 12px 18px; background: #FFFFFF; color: #2F2B28; resize: vertical"></textarea>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><span style="font-size: 14px; font-style: italic">Or try one:</span>
<sc-for list="{{samples}}" as="s" hint-placeholder-count="3"><button class="chip" onClick="{{s.pick}}">{{s.label}}</button></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<button class="go tornbtn" onClick="{{offer}}" disabled="{{cannotOffer}}">Offer it to the falls</button>
<span style="font-size: 14px; font-style: italic; color: #5A524B">{{remaining}}</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5A524B">Your idea stays private to you. Nothing is shared unless you choose to add it to the pool below, and you can withdraw it at any time. In this mockup nothing is saved at all.</p>
</section>

<sc-if value="{{showCare}}" hint-placeholder-val="{{ false }}">
<section class="torn tr rise" aria-live="polite" style="background: #E6E2F2; padding: 38px 44px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 700; font-size: 26px">Before anything else, we'd like to check in</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.55">What you wrote sounds like it might be carrying a lot. You matter more than any idea. If you are in danger or thinking about ending your life, please contact local emergency services, or reach a crisis line where you are (in the US, call or text 988). Talking with someone you trust can help too.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.55">When you feel ready, the grief and care eddy offers gentle company with others who understand.</p>
<a href="/eddies" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">Visit the grief and care eddy</a>
</section>
</sc-if>

<sc-if value="{{hasResult}}" hint-placeholder-val="{{ false }}">
<section aria-live="polite" class="rise" style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #C9CCD6">What the falls noticed</div>
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 400; font-size: 34px; color: #DCDCDC">{{reflection}}</h2>
<p style="margin: 0; font-size: 15px; font-style: italic; color: #C9CCD6">These are suggestions from the River's own library, not answers. The real wisdom is in the people and places they point to.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px">
<sc-for list="{{streams}}" as="o" hint-placeholder-count="3">
<article class="torn {{o.tilt}}" style="background: {{o.bg}}; padding: 28px 26px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">{{o.water}}</div>
<h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 700; font-size: 20px">{{o.title}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.5">{{o.text}}</p>
<sc-if value="{{o.idLink}}" hint-placeholder-val="{{ false }}"><a href="https://onrelationalbeing.substack.com/p/relational-identity-ecological-intersectionality" style="font-size: 14px; font-style: italic; min-height: 44px; display: inline-flex; align-items: center">What is Relational ID? Read the exploration on IRB’s Substack</a></sc-if>
<div style="font-size: 14px; font-style: italic">{{o.by}}</div>
<a href="{{o.href}}" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">{{o.cta}}</a>
</article>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px">
<div class="torn tl" style="background: #E8C77A; padding: 28px 30px; display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">One small first step</div><p style="margin: 0; font-size: 17px; line-height: 1.5">{{step}}</p></div>
<div class="torn tr" style="background: #E6E2F2; padding: 28px 30px; display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">A question to sit with</div><p style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.4">{{question}}</p></div>
</div>
<sc-if value="{{careNote}}" hint-placeholder-val="{{ false }}">
<p class="torn tl" style="margin: 0; background: #FBF7EF; padding: 22px 28px; font-size: 15px; line-height: 1.5">A note of care: ideas involving Indigenous land, knowledge or stories begin with relationship and consent. The River will only connect you with Indigenous-led groups in the ways they choose.</p>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center">
<sc-if value="{{canShare}}" hint-placeholder-val="{{ true }}"><button class="go tornbtn" onClick="{{share}}">Add it to the pool above the falls</button></sc-if>
<button class="chip" onClick="{{again}}">Offer something else</button>
</div>
</section>
</sc-if>

<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #C9CCD6">The pool above the falls</div>
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 400; font-size: 36px; color: #DCDCDC">Ideas gathering energy</h2>
<p style="margin: 0; font-size: 17px; max-width: 760px; line-height: 1.55">Shared ideas gather here. Add your energy if you'd join, have a skill, or have space to offer. There are no likes or rankings. When enough energy gathers, an idea spills over into a new stream: a circle, a local project, or a new channel. Stewards welcome each shared idea before it appears.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px">
<sc-for list="{{pool}}" as="p" hint-placeholder-count="2">
<article class="torn {{p.tilt}}" style="background: {{p.bg}}; padding: 28px 28px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase"><span>{{p.where}}</span><span style="text-transform: none; letter-spacing: 0; font-style: italic">{{p.status}}</span></div>
<h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 700; font-size: 20px">{{p.title}}</h3>
<div role="img" aria-label="{{p.meterLabel}}" style="display: flex; gap: 6px">
<sc-for list="{{p.dots}}" as="d" hint-placeholder-count="5"><span style="width: 18px; height: 18px; border-radius: 48% 52% 46% 54%; border: 2px solid #4F7A84; background: {{d.fill}}; display: block"></span></sc-for>
</div>
<div style="font-size: 14px; font-style: italic">{{p.gathered}}</div>
<sc-if value="{{p.open}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button class="chip" onClick="{{p.join}}">I'd join</button>
<button class="chip" onClick="{{p.skill}}">I have a skill</button>
<button class="chip" onClick="{{p.space}}">I have space</button>
</div>
</sc-if>
<sc-if value="{{p.spilled}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 15px; font-weight: 600">It has spilled over into a new stream. A steward will help the people gathered meet for the first time, and can open a Hylo group so the stream has a home.</p>
<a href="/hylo" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">See how new streams gather on Hylo</a>
</sc-if>
<sc-if value="{{p.mine}}" hint-placeholder-val="{{ false }}"><button class="chip" onClick="{{p.withdraw}}">Withdraw my idea</button></sc-if>
</article>
</sc-for>
</div>
</section>

<section class="torn tr" style="background: #CFE1E4; padding: 32px 40px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 700; font-size: 22px">How the falls is cared for</h2>
<ul style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.7">
<li>Suggestions come only from offerings, partners and practices already in the River, each credited and linked to its makers.</li>
<li>Your ideas are private by default; sharing is a clear choice, and anything shared can be withdrawn.</li>
<li>Stewards welcome shared ideas before they appear, and nothing is ranked or scored.</li>
<li>If something you write sounds heavy, the falls pauses and offers care first.</li>
<li>Ideas touching Indigenous land, knowledge or stories begin with relationship and consent.</li>
<li>A gentle limit of a few offerings a day keeps the falls sustainable and unhurried.</li>
<li>When a stream spills over, the people who added energy are asked before anyone shares their name, and its new home on Hylo is opened only with their agreement.</li>
</ul>
</section>
<div class="torn tl" style="background: #F5E3B0; padding: 28px 38px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<p style="margin: 0; font-size: 17px; max-width: 680px">Ideas need hands. The Well is where people offer their wonder, wit, wisdom and wealth, so an idea from the falls can find the people who could bring it to life.</p>
<a href="/well" class="go tornbtn">Visit the Well</a>
</div>
</main>
