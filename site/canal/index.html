<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; line-height: 1.02">Where people guide the flow</h1>
<p style="margin: 0; font-size: 19px; max-width: 760px; line-height: 1.55">A river finds its own way. A canal is water guided by people who are helping to reveal potentially beneficial and regenerative ways forward, dug by hand and with care. No one here claims to know the way: each canal is offered with curiosity and humility by a named keeper, who says why they dug it.</p>
<p style="margin: 0; font-size: 19px; max-width: 760px; line-height: 1.55">Canals have locks. A lock lifts a boat to a higher level, one chamber at a time, only when you are ready. At every lock there is a quiet way back to the wild River.</p>
</div>

<section class="torn tl" style="background: #FBF7EF; padding: 32px 40px; display: flex; flex-direction: column; gap: 10px; color: #2F2B28">
<h2 class="h2" style="font-size: 24px">How canals are kept</h2>
<ul class="steps" style="font-size: 17px">
<li>Every canal is signed by its keeper, with their reason for guiding the water this way.</li>
<li>Every canal says plainly whether any partnership, referral or money is involved.</li>
<li>Canals point toward offerings. The River introduces; it never sells.</li>
</ul>
</section>

<section style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="k">Canal one · kept by Joe Culhane</div>
<h2 class="h2" style="font-size: 38px">From relational practice to relational business</h2>
<p class="p" style="font-size: 18px; max-width: 780px">For founders, leaders and anyone approaching the edges of their own discovery: people already living relationally who feel ready to let it change how they lead, and how they navigate the world of business.</p>
</div>

<div class="torn tr" style="background: #CFE1E4; padding: 32px 40px; display: flex; flex-direction: column; gap: 12px; color: #2F2B28">
<div class="k">The keeper’s note</div>
<p class="quote">“I met Beena Sharma, Partner and Leadership Development Architect at ESSENSE Business School, at a gathering in November 2026. We connected deeply and found ourselves aligned in many ways, and that led me to discover this path.”</p>
<p class="meta" style="margin: 0">Joe Culhane, Institute of Relational Being</p>
<p class="p" style="margin-top: 6px"><b>Relationship:</b> no partnership, referral or commission. Joe simply believes this is an excellent offering to help people find their way to.</p>
</div>

<p class="p" style="font-size: 17px; max-width: 780px"><a href="https://essense.school/" target="_blank" rel="noopener">ESSENSE Business School</a> helps founders and leaders design business in tune with life, weaving together inner development, business redesign and living-systems leadership. Its own path moves through four movements: Re-Sense, Re-Fine, Re-Design and Re-Source.</p>

<div class="k">Lock one · begin where you work</div>
<h3 class="h3">Relational Resource Departments</h3>
<p class="p">An idea from the Institute of Relational Being: a small group that tends an organisation’s relationships with people, place and the more-than-human world. It can begin with a few colleagues and a monthly walk.</p>
<p class="meta" style="margin: 0">Free · whenever you are ready</p>
<a href="/estuary" class="lnk">Visit the estuary</a>
</article></li>
<li class="lock"><div class="lockno" aria-hidden="true">2</div><article class="lockcard torn tr" style="background: #FBF7EF">
<div class="k">Lock two · sense the shift</div>
<h3 class="h3">Sense the Shift conversations</h3>
<p class="p">Live online conversations from ESSENSE, each pairing one invited thinker with a moderated room, to explore a shift in business and the world and what it means for your own decisions. Coming up: Business and Stewardship with Darshita Gillies on 3 December 2026 (join free or give what you can), and Business and Imagination with Phoebe Tickell on 17 December 2026.</p>
<p class="meta" style="margin: 0">About 90 minutes · online · from free</p>
<a href="/springs" class="lnk">See them in the Springs</a>
</article></li>
<li class="lock"><div class="lockno" aria-hidden="true">3</div><article class="lockcard torn tl" style="background: #E6E2F2">
<div class="k">Lock three · re-design</div>
<h3 class="h3">Business Re-Design Lab</h3>
<p class="p">A three-month live online cohort with six facilitated workshops, for aligning an existing business more closely with life.</p>
<p class="meta" style="margin: 0">Three months · online · £1,250, as listed on their site</p>
<a href="https://essense.school/re-design-lab" target="_blank" rel="noopener" class="lnk">About the Re-Design Lab</a>

<p class="p">ESSENSE’s twelve-month flagship journey for founders and leaders, launching in 2027. Alongside it they offer residential Shadow Work immersions and The Field, an ongoing community for sense-making together.</p>
<p class="meta" style="margin: 0">Twelve months · launching 2027 · register interest</p>
<a href="https://essense.school/apply" target="_blank" rel="noopener" class="lnk">Register interest with ESSENSE</a>
