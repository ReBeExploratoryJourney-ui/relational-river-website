<body>
<noscript><p style="color:#EDEDED;font-family:sans-serif;padding:24px">The Relational River needs JavaScript turned on to flow.</p></noscript>
<template id="rr-template">

<div style="background: linear-gradient(180deg, #231C4D 0%, #0E2849 42%, #174A5B 100%); font-family: Jost, sans-serif; color: #EDEDED; min-height: 100vh">
<header style="max-width: 1160px; margin: 0 auto; padding: 22px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="/flow" style="display: flex; align-items: center; gap: 12px; text-decoration: none; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="" style="width: 48px; height: 48px; display: block">Relational River</a>
<nav class="vnav" aria-label="Main">
<div class="vgroup"><button class="vbtn">Begin</button><div class="vmenu"><a href="/flow"><b>The River</b><span>the whole River at a glance</span></a><a href="/source"><b>The source</b><span>a minute of gentle questions</span></a><a href="/"><b>The arrival</b><span>watch the Beings gather</span></a></div></div>
<div class="vgroup"><button class="vbtn">Learn</button><div class="vmenu"><a href="/streams"><b>Streams</b><span>small practices for ordinary days</span></a><a href="/tributaries"><b>Tributaries</b><span>films, talks and readings</span></a><a href="/eddies"><b>Eddies</b><span>grief, gratitude and returning</span></a><a href="/moon"><b>Moon</b><span>tides, and Making with Moon</span></a><a href="/capital-journey"><b>Capital journey</b><span>money as part of the living world</span></a></div></div>
<div class="vgroup"><button class="vbtn here">Connect</button><div class="vmenu"><a href="/lakes"><b>Lakes</b><span>circles, fellowships and retreats</span></a><a href="/local-currents"><b>Local currents</b><span>groups and circles near you</span></a><a href="/ocean"><b>Ocean and confluences</b><span>projects and collaborators worldwide</span></a><a href="/hylo"><b>Gather on Hylo</b><span>where River circles meet and organise</span></a><a href="/well"><b>The Well</b><span>wonder, wit, wisdom and wealth to share</span></a></div></div>
<div class="vgroup"><button class="vbtn">Act</button><div class="vmenu"><a href="/channels"><b>Channels</b><span>ways to act, from small to large</span></a><a href="/waterfall"><b>Waterfall</b><span>offer an idea, see what it feeds</span></a><a href="/estuary"><b>Estuary</b><span>workplaces, schools and councils</span></a><a href="/groundwater"><b>Groundwater</b><span>emerging threads and systems</span></a></div></div>
<a href="/my-river" class="vmine">My river</a>
</nav>
</header>

<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Local currents</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 52px; letter-spacing: -0.03em; line-height: 1">The people already near you</h1>
<p style="margin: 0; font-size: 19px; max-width: 720px; line-height: 1.5">Groups by bioregion: your watershed and its living neighbours, not just a postcode. We only ever use a rough area, and you can browse without sharing one at all.</p>
</div>

<div role="group" aria-label="Choose a bioregion" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{regions}}" as="r" hint-placeholder-count="3"><button class="{{r.cls}}" aria-pressed="{{r.on}}" onClick="{{r.pick}}">{{r.label}}</button></sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start">
<figure class="torn tall tl" style="flex: 1 1 340px; max-width: 420px; margin: 0; background: #DCE6D2; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase">Beings of this watershed</div>
<sc-if value="{{hasBeings}}" hint-placeholder-val="{{ false }}">
<div class="beings">
<sc-for list="{{beings}}" as="b" hint-placeholder-count="4">
<a class="{{b.cls}}" href="{{b.url}}" target="_blank" rel="noopener"><img src="{{b.img}}" alt="{{b.alt}}" loading="lazy"><span class="bname">{{b.name}}</span><span class="bcredit">{{b.credit}}</span></a>
</sc-for>
</div>
</sc-if>
<sc-if value="{{noBeings}}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 320 260" role="img" aria-label="{{mapLabel}}" style="width: 100%; height: auto">
<path d="M40 70 C 70 20, 170 10, 230 40 S 310 120, 280 180 S 170 250, 100 230 S 10 130, 40 70 Z" fill="#F3ECDF" stroke="#4F7A84" stroke-width="2" stroke-dasharray="6 5"></path>
<path d="M150 40 C 140 90, 170 120, 150 160 S 120 210, 140 240" fill="none" stroke="#4F7A84" stroke-width="4" stroke-linecap="round"></path>
<path d="M90 100 C 110 120, 130 130, 152 140 M230 90 C 210 120, 180 140, 158 150" fill="none" stroke="#4F7A84" stroke-width="2.5" stroke-linecap="round"></path>
<circle cx="110" cy="80" r="8" fill="#7E9A6B"></circle><circle cx="205" cy="70" r="8" fill="#7E9A6B"></circle><circle cx="120" cy="180" r="8" fill="#7E9A6B"></circle><circle cx="220" cy="170" r="8" fill="#7E9A6B"></circle><circle cx="170" cy="120" r="8" fill="#7E9A6B"></circle>
</svg>
</sc-if>
<figcaption style="font-size: 15px; font-style: italic">{{mapLabel}}</figcaption>
<p style="margin: 0; font-size: 14px; line-height: 1.5">{{beingsNote}}</p>
<a href="/my-river" style="font-weight: 600; font-size: 15px; min-height: 44px; display: inline-flex; align-items: center">Meet a Being near you in ReBe</a>
</figure>

<section aria-live="polite" style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<article class="torn {{g.tilt}}" style="background: #FBF7EF; padding: 26px 30px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">{{g.kind}}</div>
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 21px">{{g.name}}</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5">{{g.text}}</p>
<sc-if value="{{g.idLink}}" hint-placeholder-val="{{ false }}"><a href="https://onrelationalbeing.substack.com/p/relational-identity-ecological-intersectionality" style="font-size: 14px; font-style: italic; min-height: 44px; display: inline-flex; align-items: center">What is Relational ID? Read the exploration on IRB’s Substack</a></sc-if>
<div style="font-size: 14px; font-style: italic">{{g.notes}}</div>
<sc-if value="{{g.hylo}}" hint-placeholder-val="{{ false }}"><div style="display: inline-flex; align-self: flex-start; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; background: #DCE6D2; padding: 4px 10px; border-radius: 10px 14px 10px 12px">Meets on Hylo</div></sc-if>
<a href="{{g.href}}" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">{{g.cta}}</a>
</article>
</sc-for>
</section>
</div>

<section aria-live="polite" style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Threads in this place</div>
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em">Who is already weaving here</h2>
<p style="margin: 0; font-size: 18px; max-width: 760px; line-height: 1.5">Organisations and projects in {{placeName}} whose work runs alongside each other, gathered by the River from open, public sources. Each thread shows how it was noticed and where the facts come from.</p>
</div>
<div class="thcards">
<sc-for list="{{threadCards}}" as="th" hint-placeholder-count="3">
<article class="{{th.cls}}" style="background: {{th.bg}}">
<div class="thk">{{th.kindLabel}}</div>
<h3 class="thh">{{th.title}}</h3>
<p class="thp">{{th.text}}</p>
<div class="orgs"><sc-for list="{{th.orgs}}" as="o" hint-placeholder-count="2"><a href="{{o.url}}" class="org" target="_blank" rel="noopener">{{o.name}}<span>{{o.where}}</span></a></sc-for></div>
<p class="thp how">{{th.how}}</p>
<details class="srcs"><summary>Sources</summary><ul><sc-for list="{{th.sources}}" as="s" hint-placeholder-count="2"><li><a href="{{s.url}}" target="_blank" rel="noopener">{{s.label}}</a></li></sc-for></ul></details>
</article>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; font-style: italic; color: #C9CCD6">Only organisations and projects are threaded. Connections between people stay private and by choice. <a href="/groundwater" style="color: #EDEDED">How the River weaves threads</a></p>
</section>

<section class="torn tr" style="background: #E6E2F2; padding: 32px 40px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between">
<p style="margin: 0; font-size: 17px; max-width: 680px">Run a local group? Add it yourself and keep it up to date. Already gathering on Hylo? Add your Hylo link and people can find and join you there. Listings are reviewed lightly against the River's principles, and you can change or remove yours at any time.</p>
<a href="/ocean" class="go tornbtn" style="background: #F5EEE1">Add our group</a>
</section>
</main>
<footer style="max-width: 1160px; margin: 0 auto; padding: 24px 32px 40px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; font-style: italic; color: #C9CCD6"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="Institute of Relational Being" style="width: 64px; height: 64px; display: block"><span>Groups in square brackets are examples for this mockup. Indigenous-led groups appear only as their communities wish.</span><a href="/privacy" style="color: #EDEDED; min-height: 44px; display: inline-flex; align-items: center">Privacy</a></footer>
</div>
</template>

    var TH = this.state.threads || /*THREADS*/{"as_of": "November 2026", "threads": [{"id": "seed-keepers", "regions": ["la", "clare"], "themes": ["land"], "kind": "noticed", "title": "Seed keepers on two shores", "waters": ["streams", "local", "ocean"], "text": "Three organisations keep living seed in circulation. Irish Seed Savers, near Lough Derg in East Clare, holds Ireland’s heritage seeds, grains and apple trees. In the Los Angeles basin, the Seed Library of Los Angeles helps residents grow and save open-pollinated seed, and the Theodore Payne Foundation offers seed from more than 200 California native species.", "how": "Noticed by the River: each lists seed saving as its core work in its public profile. Irish Seed Savers is close to Corra Woods; the LA pair share one basin.", "orgs": [["Irish Seed Savers", "https://irishseedsavers.ie/", "Scarriff, County Clare"], ["Seed Library of Los Angeles", "https://ecologycenter.org/directory/directory-entries/seed-library-of-los-angeles-slola/", "Los Angeles basin"], ["Theodore Payne Foundation", "https://theodorepayne.org/shop-for-plants-seeds-books-more/", "Sun Valley, Los Angeles"]], "sources": [["Irish Seed Savers", "https://irishseedsavers.ie/"], ["The Clare Echo on 30 years of Irish Seed Savers", "https://clareecho.ie/green-clare-scariff-based-irish-seed-savers-association-celebrate-30th-anniversary"], ["Ecology Center directory: SLOLA", "https://ecologycenter.org/directory/directory-entries/seed-library-of-los-angeles-slola/"], ["Theodore Payne Foundation seeds", "https://theodorepayne.org/shop-for-plants-seeds-books-more/"]]}, {"id": "la-watershed", "regions": ["la"], "themes": ["land"], "kind": "noticed", "title": "Carers of the Los Angeles watershed", "waters": ["local", "channels"], "text": "TreePeople is based in Coldwater Canyon Park on Mulholland Drive in the Santa Monica Mountains, a short walk along the ridge from Laurel Canyon, and serves as Watershed Coordinator for the Santa Clara River Watershed. Friends of the Los Angeles River has led the Great LA River CleanUp for over 35 years, with the Los Angeles Conservation Corps and the Conservation Corps of Long Beach among its partners.", "how": "Noticed by the River: both organisations publicly describe their work as caring for water across the LA basin. The FoLAR and Conservation Corps partnership is documented.", "orgs": [["TreePeople", "https://www.treepeople.org/home", "Coldwater Canyon, Santa Monica Mountains"], ["Friends of the Los Angeles River", "https://folar.org/", "Along the LA River"]], "sources": [["TreePeople: Coldwater Canyon Park", "https://treepeople.org/?p=6682"], ["TreePeople’s work with water", "https://treepeople.org/?p=20264"], ["PBS SoCal: It takes a village to clean the L.A. River", "https://pbssocal.org/shows/earth-focus/it-takes-a-village-to-clean-the-l-a-river"], ["NBC Los Angeles: 36th Great LA River Cleanup", "https://www.nbclosangeles.com/the-scene/help-la-river-shimmer-and-thrive-by-volunteering-at-a-decades-old-cleanup/3950010/"]]}, {"id": "land-return", "regions": ["la"], "themes": ["land"], "kind": "documented", "title": "Land returning to the Tongva", "waters": ["channels", "confluences", "local"], "text": "In 2022 the Tongva Taraxat Paxaavxa Conservancy, a Tongva-led nonprofit, received a one-acre site in Altadena, Huhuunga: the first land returned to the Tongva in Los Angeles County in nearly two centuries. Resource Generation Los Angeles and the Native American Land Conservancy supported the effort.", "how": "Documented in the Conservancy’s own public statements and in reporting. Shared here as public history, with the Conservancy’s own site as the first source. The River follows their lead on anything more.", "orgs": [["Tongva Taraxat Paxaavxa Conservancy", "https://www.tongva.land/purpose", "Tovaangar (greater Los Angeles)"], ["Resource Generation", "https://resourcegeneration.org/", "United States"]], "sources": [["Tongva Taraxat Paxaavxa Conservancy: purpose and vision", "https://www.tongva.land/purpose"], ["First Nations Development Institute: returning the people’s land", "https://www.firstnations.org/stories/returning-the-peoples-land-to-the-tongva-community/"], ["LAist: why a property worth millions was returned to the Tongva", "https://laist.com/news/la-history/why-a-property-worth-millions-was-returned-to-tongva-tribe"]]}, {"id": "irish-environmental-network", "regions": ["clare"], "themes": ["land", "bio"], "kind": "documented", "title": "One network beneath Clare and Tipperary", "waters": ["local", "confluences"], "text": "Irish Seed Savers in Scarriff is a member of the Irish Environmental Network. Across Lough Derg, Cloughjordan Ecovillage in County Tipperary, Ireland’s first ecovillage, receives annual funding through that same network for its education and advocacy work.", "how": "Documented in public records of each organisation. The River noticed they share a network and a lake: Lough Derg lies between them.", "orgs": [["Irish Seed Savers", "https://irishseedsavers.ie/", "Scarriff, County Clare"], ["Cloughjordan Ecovillage", "https://www.thevillage.ie/", "Cloughjordan, County Tipperary"]], "sources": [["Wikipedia: Irish Seed Savers Association", "https://en.wikipedia.org/wiki/Irish_Seed_Savers_Association"], ["The Wheel: Cloughjordan Ecovillage case study", "https://www.wheel.ie/sites/default/files/media/file-uploads/2023-07/A3%20EMERGE%20case%20studies%20-%20Cloughjordan%20Ecovillage.pdf"]]}, {"id": "ecovillages", "regions": ["clare", "world"], "themes": ["bio"], "kind": "documented", "title": "A local ecovillage in a global web", "waters": ["ocean", "lakes"], "text": "Cloughjordan Ecovillage is part of the Global Ecovillage Network, which links ecovillages and intentional communities around the world. Cloughjordan is home to Ireland’s first member-owned community supported agriculture farm.", "how": "Documented by the ecovillage, the Global Ecovillage Network and reporting.", "orgs": [["Cloughjordan Ecovillage", "https: living through educational activities. The Burren Programme’s results are published in a public evaluation, so other regions can learn from it.", "how": "Noticed by the River: both publish what they have learned for others to use.", "orgs": [["Cloughjordan Ecovillage", "https://www.thevillage.ie/", "County Tipperary"], ["Burren Programme", "https://www.burrenprogramme.com/", "County Clare"]], "sources": [["Transnational Institute: the future is now at Cloughjordan", "https://www.tni.org/en/article/the-future-is-now-at-irelands-cloughjordan-ecovillage"], ["EU CAP Network: evaluation of the Burren Programme", "https://eu-cap-network.ec.europa.eu/sites/default/files/publication/2023-05/evaluation-of-the-burren-programme.pdf"]]}, {"id": "murmurations", "regions": ["world"], "themes": ["bio"], "kind": "documented", "title": "Maps that talk to each other", "waters": ["source", "confluences", "ocean"], "text": "Murmurations is an open protocol that lets organisations publish their own profiles, which an index then gathers without owning them. Transition Towns and the EcoRestoration Alliance have worked on feeding their maps into it, and the CoBot search tool built on it now reaches over 80,000 organisations.", "how": "Documented by the Murmurations and Open Co-op communities. Open data like this is where the River’s automatic threads will come from.", "orgs": [["Murmurations", "https://murmurations.network/", "Open protocol"], ["The Open Co-op", "https://open.coop/", "Worldwide"]], "sources": [["CoBot: about", "https://murm-search.vercel.app/about.html"], ["Loomio: Murmurations update", "https://loomio.com/d/q1ifbNLP/murmurations-ontology-agnostic-decentralised-mapping"], ["The Open Co-op: introducing CoBot", "https://open.coop/?p=5277"]]}, {"id": "hylo-farms", "regions": ["world"], "themes": ["land"], "kind": "documented", "title": "Farms finding each other on Hylo", "waters": ["confluences", "waterfall"], "text": "Hylo created a Farm group type through an API integration with OpenTEAM, so farms and ranches can share profiles, products and their location on Hylo’s map. Hylo Projects also carry places and times, so work in progress appears on the map too.", "how": "Documented in Hylo’s own release notes.", "orgs": [["Hylo", "https://hylo.com", "Worldwide"], ["OpenTEAM", "https://openteam.community/", "Worldwide"]], "sources": [["Terran Collective: community infrastructure for regenerative agriculture", "https://medium.com/terran-collective/community-infrastructure-for-regenerative-agriculture-to-overgrow-the-system-hylo-product-update-c91286990a36"], ["Hylo 3.0.0 release notes", "https://medium.com/terran-collective/holonic-architecture-hylo-3-0-0-release-notes-d109bdae22d8"]]}, {"id": "open-gatherings", "regions": ["world", "la"], "themes": ["bio"], "kind": "noticed", "title": "Gatherings anyone can find", "waters": ["lakes", "waterfall", "ocean"], "text": "Hylo’s public map and public events show gatherings from groups anywhere that choose to be open. Dandelion lists events from community-led organisers, the Institute of Relational Being among them. The Global Regeneration CoLab keeps an open community calendar of regenerative gatherings.", "how": "Noticed by the River: two open places where gatherings are published. Only events their hosts mark as public appear.", "orgs": [["Hylo: the Commons", "https://hylozoic.gitbook.io/hylo/hylo-user-manual/the-commons", "Worldwide"], ["IRB on Dandelion", "https://dandelion.events/o/relational-being-rebe", "Los Angeles"], ["Global Regeneration CoLab", "https://sites.google.com/grc.earth/grc-home/home", "Worldwide"]], "sources": [["Hylo user manual: the Commons", "https://hylozoic.gitbook.io/hylo/hylo-user-manual/the-commons"], ["Institute of Relational Being on Dandelion", "https://dandelion.events/o/relational-being-rebe"]]}, {"id": "bioregional-weavers", "regions": ["world"], "themes": ["bio"], "kind": "documented", "title": "Bioregional weavers, near and far", "waters": ["ocean", "confluences", "local"], "text": "The Global Regeneration CoLab offers peer-to-peer support to changemakers working on regenerative projects, and was started to meet the challenges of bioregional regeneration together. In Europe, the Bioregional Weaving Labs Collective, led by Ashoka and Commonland, has weaving labs in eight countries. One of these is in south-east Ireland, around County Waterford, and is now its own organisation. The Collective has also mapped more than 150 bioregional initiatives so people can find others working in their region.", "how": "Documented on each network’s own pages. The River noticed they share one practice, weaving a region’s people and projects together, and that their calendars and maps are open to all.", "orgs": [["Global Regeneration CoLab", "https://sites.google.com/grc.earth/grc-home/home", "Worldwide"], ["Bioregional Weaving Labs Collective", "https://bioregionalweavinglabs.substack.com/p/bioregional-weaving-guide", "Europe"], ["Bioregional Weaving Lab South East Ireland", "https://bioregion.ie/", "County Waterford"]], "sources": [["Global Regeneration CoLab", "https://sites.google.com/grc.earth/grc-home/home"], ["Daniel Wahl: Accelerating bioregional regeneration and the GRC", "https://medium.com/activate-the-future/accelerating-bioregional-regeneration-e94347f785ea"], ["GIY: about the Bioregional Weaving Labs Collective", "https://giy.ie/?p=4250"], ["GIY: Bioregional Weaving Lab South East Ireland", "https://giy.ie/programmes/bioregional-weaving-lab"], ["The Bioregional Weaving Guide", "https://bioregionalweavinglabs.substack.com/p/bioregional-weaving-guide"]]}, {"id": "after-fire", "regions": ["la"], "themes": ["land", "grief"], "kind": "noticed", "title": "Tending land after fire", "waters": ["eddies", "local"], "text": "When the Eaton fire burned Huhuunga in January 2025, Tongva leaders said traditional land-tending practices had lessened the damage. TreePeople keeps a Wildfire Resilience Fund for Los Angeles’ hills and neighbourhoods.", "how": "Noticed by the River: two responses to fire in the same mountains, shared gently, from public reporting and the organisations’ own pages.", "orgs": [["Tongva Taraxat Paxaavxa Conservancy", "https://www.tongva.land/purpose", "Altadena"], ["TreePeople", "https://www.treepeople.org/home", "Santa Monica Mountains"]], "sources": [["Wikipedia: Tongva Taraxat Paxaavxa Conservancy (citing the Los Angeles Times, January 2025)", "https://en.wikipedia.org/wiki/Tongva_Taraxat_Paxaavxa_Conservancy"], ["TreePeople", "https://www.treepeople.org/home"]]}, {"id": "mountain-watersheds", "kind": "noticed", "title": "Two carers of the Santa Monica Mountains", "waters": ["local", "channels"], "regions": ["la"], "themes": ["land"], "text": "Since 1961 the Resource Conservation District of the Santa Monica Mountains has run programmes in watershed management, restoration, research and education across the range, from Point Mugu to Topanga. TreePeople tends the eastern end of the same mountains from Coldwater Canyon Park.", "how": "Noticed by the River: two organisations caring for the creeks and slopes of one mountain range, Laurel Canyon’s own.", "orgs": [["Resource Conservation District of the Santa Monica Mountains", "https://rcdsmm.org/who-we-are/", "Santa Monica Mountains"], ["TreePeople", "https://www.treepeople.org/home", "Coldwater Canyon"]], "sources": [["RCDSMM: who we are", "https://rcdsmm.org/who-we-are/"], ["RCDSMM: about the district", "https://rcdsmm.org/who-we-are/about-the-rcdsmm/"], ["TreePeople: Coldwater Canyon Park", "https://treepeople.org/?p=6682"]]}, {"id": "burren-learning-landscape", "kind": "noticed", "title": "The Burren as a learning landscape", "waters": ["local", "tributaries"], "regions": ["clare"], "themes": ["land", "bio"], "text": "Burrenbeo Trust, a landscape charity founded in 2008 and based in Kinvara, works to connect people to their places and their part in caring for them. It promotes the Burren as a learning landscape whose models others can use. Its neighbour the Burren Programme pays farmers for the health of the habitats they tend.", "how": "Noticed by the River: two Burren organisations, one teaching people to care for the landscape and one rewarding farmers who do.", "orgs": [["Burrenbeo Trust", "https://burrenbeo.com/?p=69", "Kinvara, the Burren"], ["Burren Programme", "https://www.burrenprogramme.com/", "The Burren, County Clare"]], "sources": [["Burrenbeo Trust: about", "https://burrenbeo.com/?p=69"], ["Burrenbeo Trust: learning landscape", "https://burrenbeo.com/?p=73"], ["gov.ie: Burren Programme", "https://www.gov.ie/en/press-release/2383e-minister-hackett-announces-the-commencement-of-2020-farmer-payments-under-the-burren-programme"]]}, {"id": "restoration-communities", "kind": "noticed", "title": "Restoring land, many communities at a time", "waters": ["ocean", "channels"], "regions": ["world"], "themes": ["land", "bio"], "text": "Ecosystem Restoration Communities, called Ecosystem Restoration Camps until 2023, grew from an idea of the ecologist and filmmaker John D. Liu in 2016. Local people and volunteers restore degraded land together, and the network now offers courses and a global knowledge exchange. Liu is also an Ecosystem Ambassador for Commonland, which co-leads the Bioregional Weaving Labs Collective.", "how": "Noticed by the River: Commonland appears in the public story of both networks.", "orgs": [["Ecosystem Restoration Communities", "https://ecosystemrestorationcamps.org/the-evolution-of-the-camps-movement/", "Worldwide"], ["Commonland", "https://www.commonland.com/", "Worldwide"]], "sources": [["ERC: the evolution of the camps movement", "https://ecosystemrestorationcamps.org/the-evolution-of-the-camps-movement/"], ["GlobalGiving: Ecosystem Restoration Communities report, May 2023", "https://cl.globalgiving.org/projects/empower-local-communities-to-restore-their-ecosystems/reports/?pageNo=3"], ["MIT Solve: Ecosystem Restoration Camps", "https://solve.mit.edu/solutions/29920"], ["GIY: about the Bioregional Weaving Labs Collective", "https://giy.ie/?p=4250"]]}, {"id": "grief-to-action", "kind": "documented", "title": "From grief for the world, to action", "waters": ["eddies", "ocean"], "regions": ["world"], "themes": ["grief"], "text": "Good Grief Network, a US nonprofit, brings people together to work through collective grief and eco-distress, in 10-week peer groups led by people it has trained. Its founder, LaUra Schmidt, has spoken of the Work That Reconnects, developed by Joanna Macy, as a model for resisting the privatisation of our pain. Facilitators in the Work That Reconnects Network hold similar spaces around the world.", "how": "Documented in reporting by Inside Climate News, and in each organisation’s own pages.", "orgs": [["Good Grief Network", "https://www.goodgriefnetwork.org/", "Worldwide, online"], ["Work That Reconnects Network", "https://workthatreconnects.org/", "Worldwide"]], "sources": [["Inside Climate News: group sessions for eco-distress", "https://insideclimatenews.org/?p=85867"], ["Good Grief Network: about", "https://www.goodgriefnetwork.org/?p=4550"], ["Psychiatric Times: group interventions for climate distress", "https://psychiatrictimes.com/view/group-interventions-climate-change-distress"]]}, {"id": "bioregional-finance", "kind": "documented", "title": "Money flowing toward bioregions", "waters": ["ocean", "confluences"], "regions": ["world"], "themes": ["money", "bio"], "text": "The Regenerative Communities Network is a global learning and action network for regenerative economies rooted in place. It began forming in 2017 with Capital Institute and has been run by its members since 2021. The BioFi Project grew out of a 2024 book on Bioregional Financing Facilities by the BioFi Project, Dark Matter Labs and the Buckminster Fuller Institute, and now helps bioregions design ways to fund regeneration.", "how": "Documented on the organisations’ own pages. The River noticed they share one aim: money that serves the health of a whole bioregion.", "orgs": [["Regenerative Communities Network", "https://capitalinstitute.org/regenerative-communities/", "Worldwide"], ["The BioFi Project", "https://www.bfi.org/programs/bfi-design-lab/the-biofi-project/", "Worldwide"], ["Dark Matter Labs", "https://darkmatterlabs.org/", "Worldwide"]], "sources": [["Capital Institute: Regenerative Communities Network", "https://capitalinstitute.org/regenerative-communities/"], ["Cascadia Department of Bioregion: on the RCN", "https://cascadiabioregion.org/department-of-bioregion/tag/Bioregional+Organizing"], ["Buckminster Fuller Institute: the BioFi Project", "https://www.bfi.org/programs/bfi-design-lab/the-biofi-project/"]]}]}/*END THREADS*/;
