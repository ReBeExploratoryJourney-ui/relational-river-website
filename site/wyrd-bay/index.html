body{margin:0}

a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px dashed #9FD3DC;outline-offset:3px}
.fogpage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;box-sizing:border-box;gap:14px}
.fogsvg{width:min(520px,90vw);height:auto}
.fogh{margin:0;font-family:'Averia Serif Libre',Georgia,serif;font-weight:400;font-size:36px}

.scenewrap{width:100%;max-height:62vh;overflow:hidden}
.bayscene{display:block;width:100%;height:auto;max-height:62vh;min-height:300px}
.ring{transform-box:fill-box;transform-origin:center}
.r1{animation:wyspin 160s linear infinite}
.r2{animation:wyspin 110s linear infinite reverse}
.r3{animation:wyspin 70s linear infinite}
@keyframes wyspin{to{transform:rotate(360deg)}}
.core{transform-box:fill-box;transform-origin:center;animation:wypulse 9s ease-in-out infinite}
@keyframes wypulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.tw{animation:wytw 5s ease-in-out infinite}.t2{animation-delay:-1.7s}.t3{animation-delay:-3.3s}

.glim{animation:wyglim 6s ease-in-out infinite;opacity:.2}.g2{animation-delay:-2s}.g3{animation-delay:-4s}

.lant{animation:wybob 7s ease-in-out infinite}.l2{animation-delay:-2.4s}.l3{animation-delay:-4.6s}

.refl{animation:wyrefl 9s ease-in-out infinite}
@keyframes wyrefl{0%,100%{opacity:.7}50%{opacity:1}}
.weave{transform-box:fill-box;transform-origin:center}
.aurora{animation:wyaur 26s ease-in-out infinite alternate}.aur2{animation:wyaur 34s ease-in-out infinite alternate-reverse}
@keyframes wyaur{0%{transform:translateX(-40px)}100%{transform:translateX(40px)}}
.thread{stroke-width:1.1;stroke-opacity:.38;stroke-dasharray:3 7;animation:wythread 8s ease-in-out infinite}.th2{animation-delay:-2.6s}.th3{animation-delay:-5.2s}
@keyframes wythread{0%,100%{stroke-opacity:.18}50%{stroke-opacity:.55}}
.bayscene.pre .threads,.bayscene.pre .sparks{opacity:0}
.bayscene.bloom .threads{animation:wyfadein 3.6s ease-out 1.2s both}
@keyframes wyfadein{from{opacity:0}to{opacity:1}}
.spark{animation:wyrise 7s linear infinite;opacity:0}.s2{animation-delay:-1.4s}.s3{animation-delay:-2.8s}.s4{animation-delay:-4.2s}.s5{animation-delay:-5.6s}
@keyframes wyrise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-170px);opacity:0}}
.bayscene.pre .weave{opacity:0;transform:scale(.55)}
.bayscene.bloom .weave{animation:wybloom 2.8s cubic-bezier(.2,.7,.2,1) both}

.kick{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#E8C77A}
.bayh1{margin:0;font-family:'Averia Serif Libre',Georgia,serif;font-weight:800;font-size:64px;letter-spacing:-.03em;line-height:1}

.lede{margin:0;font-size:19px;line-height:1.6;max-width:780px}
.note{margin:0;font-family:'Averia Serif Libre',Georgia,serif;font-style:italic;font-size:21px;line-height:1.5;color:#E8C77A;max-width:780px}
.baynav{display:flex;flex-wrap:wrap;gap:6px 22px}
.baynav a{min-height:44px;display:inline-flex;align-items:center;font-size:16px;text-underline-offset:6px;text-decoration-color:#9FD3DC}
.bh2{margin:0;font-family:'Averia Serif Libre',Georgia,serif;font-weight:800;font-size:36px;letter-spacing:-.02em}
.gold{color:#E8C77A}
.k{font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.h2{margin:0;font-family:'Averia Serif Libre',Georgia,serif;font-weight:800;font-size:30px;letter-spacing:-.02em}
.h3{margin:0;font-family:'Averia Serif Libre',Georgia,serif;font-weight:800;font-size:21px}
.p{margin:0;font-size:16px;line-height:1.55}
.minor{font-size:14px;font-style:italic}
.lnk{font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.links{display:flex;flex-wrap:wrap;gap:0 18px}
.steps{margin:4px 0 0;padding-left:22px;font-size:16px;line-height:1.6}
.steps li{margin-bottom:4px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px;align-items:start}
.qcard{padding:34px 30px 28px;display:flex;flex-direction:column;gap:9px;color:#2F2B28}
.wordcard,.testcard,.mform,.scrollcard{padding:32px 40px;display:flex;flex-direction:column;gap:10px;color:#2F2B28}

.wy-entry{position:fixed;inset:0;z-index:200;overflow:hidden;background:#1A1D45}

.we-boat svg{display:block;width:100%;height:100%}
.we-fog{position:absolute;left:-30%;top:-20%;width:160%;height:140%;pointer-events:none;will-change:transform}

.we-word{position:absolute;left:0;right:0;top:46%;margin:0;text-align:center;font-family:'Averia Serif Libre',Georgia,serif;font-style:italic;font-size:28px;color:#14163A;opacity:0;padding:0 24px}
.we-skip{position:absolute;right:20px;bottom:20px;font-family:Jost,sans-serif;font-size:15px;min-height:44px;padding:8px 16px;background:rgba(20,22,58,.55);color:#EFE6D2;border:1px solid rgba(239,230,210,.5);border-radius:12px 16px 10px 14px;cursor:pointer}

<sc-if value="{{veiled}}" hint-placeholder-val="{{ false }}">

<main class="baymain">
<div style="display: flex; flex-direction: column; gap: 12px">
<div class="kick">You found the way</div>
<h1 class="bayh1" tabindex="-1">Wyrd Bay</h1>
<p class="lede">Wyrd is an old word. In Old English it named the turning of what comes to be: a weave of becoming that no one holds alone. This bay is for those who work with and within that becoming. Liminal agents, Wyrd Workers and anyone who quests are welcome here.</p>
<p class="lede">Come to cultivate connections, take up a quest with others, or sit alone by the water. Both are welcome, and you can change your mind as the tide does.</p>
<p class="note">Nothing here knows the way. That is rather the point.</p>
</div>

<nav class="baynav" aria-label="In the Bay"><a href="#quests">Quests</a><a href="#flotsam">Flotsam</a><a href="#moorings">Moorings</a><a href="#scrolls">Send a scroll</a><a href="#lantern">The lantern test</a></nav>

<section class="torn tl wordcard" style="background: #D9D3EA">
<div class="k">A word about a crowded word</div>
<p class="p">“Liminal” has been carried into many rooms lately. In the Bay we try to use it with care, remembering where it came from: the <i>limen</i>, the threshold, in the rites of passage that Arnold van Gennep described, and the betwixt-and-between time that Victor Turner explored. A threshold is not a brand. It is where you are not yet who you will be.</p>
</section>

<section id="quests" style="display: flex; flex-direction: column; gap: 18px">
<div class="k gold">Quests</div>
<h2 class="bh2">Take up a quest</h2>
<p class="lede">Small invitations, taken alone or with others. None of them has a right answer. Stow one in your Boat to keep tending it, and look to the Moorings if you would like companions.</p>
<div class="qgrid">
<sc-for list="{{quests}}" as="q" hint-placeholder-count="8">
<article class="torn {{q.tilt}} qcard" style="background: {{q.bg}}">
<div class="k">{{q.mode}}</div>
<h3 class="h3">{{q.title}}</h3>
<p class="p">{{q.text}}</p>
<button class="toggle" aria-expanded="{{q.openAttr}}" onClick="{{q.toggle}}">{{q.toggleLabel}}</button>
<sc-if value="{{q.open}}" hint-placeholder-val="{{ false }}"><ol class="steps"><sc-for list="{{q.steps}}" as="st" hint-placeholder-count="3"><li>{{st}}</li></sc-for></ol></sc-if>
<sc-if value="{{q.hasSeekers}}" hint-placeholder-val="{{ false }}"><button class="seek" onClick="{{q.seeSeekers}}">{{q.seekLabel}}</button></sc-if>
<sc-if value="{{q.hasHint}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 14px; font-style: italic; line-height: 1.45">{{q.aboardHint}}</p></sc-if><button class="aboard" aria-pressed="{{q.aboardOn}}" onClick="{{q.aboard}}">{{q.aboardLabel}}</button>
</article>
</sc-for>
</div>
</section>

<section id="flotsam" style="display: flex; flex-direction: column; gap: 18px">
<div class="k gold">Flotsam</div>
<h2 class="bh2">What the tide brought in</h2>
<p class="lede">Washed up on this shore: makers and works that help people meet mystery with curiosity rather than control. Each links to its makers. The Bay adds slowly, and only what passes the lantern test below.</p>
<div class="qgrid">
<sc-for list="{{flotsam}}" as="f" hint-placeholder-count="10">
<article class="torn {{f.tilt}} qcard" style="background: {{f.bg}}">
<div class="k">{{f.kind}}</div>
<h3 class="h3">{{f.title}}</h3>
<div class="minor">{{f.by}}</div>
<p class="p">{{f.text}}</p>
<div class="links"><sc-for list="{{f.links}}" as="l" hint-placeholder-count="2"><a href="{{l.href}}" class="lnk" target="_blank" rel="noopener">{{l.label}}</a></sc-for></div>
<button class="aboard" aria-pressed="{{f.aboardOn}}" onClick="{{f.aboard}}">{{f.aboardLabel}}</button>
</article>
</sc-for>
</div>
</section>

<section id="lantern" class="torn tr testcard" style="background: #F5E3B0">
<div class="k">The lantern test</div>
<h2 class="h2" style="font-size: 28px">Enchantment, or glamour?</h2>
<p class="p">Patrick Curry suggests that the counterfeit of enchantment is glamour: wonder that has been manufactured to sell something or to steer us. Before anything washes up in the Bay, we hold a lantern to it and ask:</p>
<ul class="steps">
<li>Does it come from real depth of practice or lineage, rather than borrowing the word “liminal”?</li>
<li>Does it keep the mystery open, rather than selling certainty or a shortcut?</li>
<li>Is it entangled, weaving humans into the rest of nature and the cosmos?</li>
<li>Does it honour the keepers of the knowledge it draws on, and leave ceremony with those it belongs to?</li>
<li>Does it leave you more curious and more kind?</li>
</ul>
<p class="p">Know of something that would pass? Bring it to the Institute of Relational Being’s group on <a href="https://www.hylo.com/groups/institute-of-relational-being" target="_blank" rel="noopener">Hylo</a>, and say it came from the Bay.</p>
</section>

<section id="moorings" style="display: flex; flex-direction: column; gap: 18px">
<div class="k gold">Moorings</div>
<h2 class="bh2">Wyrd Workers moored here</h2>
<p class="lede">Those who choose to be findable leave a card at the moorings: what they are tending at the threshold, and whether they are questing alone, looking for companions, or open to either.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px" role="group" aria-label="Show moorings"><sc-for list="{{mFilters}}" as="m" hint-placeholder-count="4"><button class="{{m.cls}}" aria-pressed="{{m.on}}" onClick="{{m.pick}}">{{m.label}}</button></sc-for></div>
<sc-if value="{{mQuestNote}}" hint-placeholder-val="{{ false }}"><p class="p" style="font-style: italic">{{mQuestNote}} <button class="seek" onClick="{{mClearQuest}}">Show all moorings</button></p></sc-if>
<sc-if value="{{mLoading}}" hint-placeholder-val="{{ false }}"><p class="p" style="font-style: italic">Looking along the moorings…</p></sc-if>
<sc-if value="{{mProblem}}" hint-placeholder-val="{{ false }}"><p class="p">{{mProblem}}</p></sc-if>
<sc-if value="{{mEmpty}}" hint-placeholder-val="{{ false }}"><p class="p" style="font-style: italic">{{mEmptyText}}</p></sc-if>
<div class="qgrid">
<sc-for list="{{moorings}}" as="h" hint-placeholder-count="2">
<article class="torn {{h.tilt}} qcard" style="background: {{h.bg}}">
<div class="k">{{h.openTo}}</div>
<h3 class="h3">{{h.name}}</h3>
<p class="p">{{h.threshold}}</p>
<sc-if value="{{h.hasQuest}}" hint-placeholder-val="{{ false }}"><div class="minor">Quest: {{h.quest}}</div></sc-if>
<div class="hfoot">
<sc-if value="{{h.hasHylo}}" hint-placeholder-val="{{ false }}"><a class="hylo" href="{{h.hylo}}" target="_blank" rel="noopener" aria-label="{{h.hyloLabel}}"><img src="/assets/hylo-merkaba.svg" alt="">Hylo</a></sc-if>
<button class="hreport" onClick="{{h.report}}">{{h.reportLabel}}</button>
</div>
<sc-if value="{{h.reporting}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="{{h.rid}}" style="font-size: 14px; font-weight: 600">What concerns you? (optional)</label>
<textarea id="{{h.rid}}" class="field" rows="2" maxlength="500" onChange="{{h.typeReason}}"></textarea>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><button class="chip on" onClick="{{h.send}}">Send to the stewards</button><button class="hreport" onClick="{{h.cancel}}">Never mind</button></div>
</div>
</sc-if>
<sc-if value="{{h.reported}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 14px; font-style: italic">Thank you. The Bay’s stewards will take a look.</p></sc-if>
</article>
</sc-for>
</div>

<section class="torn tl mform" style="background: #EDE3CC">
<h3 class="h2" style="font-size: 26px">{{mFormTitle}}</h3>
<sc-if value="{{mNoBoat}}" hint-placeholder-val="{{ false }}"><p class="p">To moor here, first build your Boat and keep it with an IRB account, so your card is always yours to change or take down.</p><a href="/boat" class="lnk">Go to your Boat</a></sc-if>
<sc-if value="{{mNeedsAccount}}" hint-placeholder-val="{{ false }}"><p class="p">To moor here, keep your Boat with your IRB account first, so your card is always yours to change or take down.</p><a href="/boat#keeping" class="lnk">Keep your Boat with an account</a></sc-if>
<sc-if value="{{mReady}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{mMoored}}" hint-placeholder-val="{{ false }}"><p class="p" style="font-style: italic">{{mStatus}}</p></sc-if>
<div class="fld"><label class="alabel" for="wyName">Name on your card</label><input id="wyName" class="field" type="text" maxlength="60" value="{{mName}}" onChange="{{mTypeName}}"></div>
<div class="fld"><label class="alabel" for="wyThr">What you are tending at the threshold</label><textarea id="wyThr" class="field" rows="3" maxlength="400" value="{{mThr}}" onChange="{{mTypeThr}}" placeholder="A question you are living, a change you sense coming, a strange thread you are following"></textarea></div>
<div class="fld"><div class="alabel" id="wyOpenL">How you are questing</div><div style="display: flex; flex-wrap: wrap; gap: 10px" role="group" aria-labelledby="wyOpenL"><sc-for list="{{mOpenChips}}" as="c" hint-placeholder-count="3"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div></div>
<div class="fld"><div class="alabel" id="wyQuestL">A quest you would welcome company on (optional)</div><div style="display: flex; flex-wrap: wrap; gap: 10px" role="group" aria-labelledby="wyQuestL"><sc-for list="{{mQuestChips}}" as="c" hint-placeholder-count="8"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div></div>
<div class="fld"><label class="alabel" for="wyHylo">Your Hylo profile (optional)</label><input id="wyHylo" class="field" type="url" inputmode="url" maxlength="300" value="{{mHylo}}" onChange="{{mTypeHylo}}" placeholder="https://www.hylo.com/members/…"></div>
<button class="{{mAgreeCls}}" aria-pressed="{{mAgreeOn}}" onClick="{{mAgree}}" style="align-self: flex-start">I will moor with care, following the Bay’s agreements below</button>
<sc-if value="{{mMsg}}" hint-placeholder-val="{{ false }}"><p class="p" role="status">{{mMsg}}</p></sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center"><button class="go tornbtn" style="background: #F5EEE1" onClick="{{mSave}}">{{mSaveLabel}}</button><sc-if value="{{mMoored}}" hint-placeholder-val="{{ false }}"><button class="hreport" onClick="{{mLeave}}">Cast off</button></sc-if></div>
</div>
</sc-if>
<ul class="steps" style="font-size: 15px; margin-top: 8px">
<li>Be kind, honest and playful, and share only your own words.</li>
<li>The Bay is for questing and connecting, not for selling, recruiting or certainty-peddling.</li>
<li>Leave ceremonies and teachings with their keepers. Share them only with consent.</li>
<li>Respect a quiet “no, thank you”. Mystery includes other people’s boundaries.</li>
<li>Stewards from the Institute of Relational Being look in regularly. If three people raise a concern about a card within a week, it rests out of view until a steward has looked.</li>
<li>You can change your card or cast off at any time, and casting off takes effect straight away.</li>
</ul>
</section>
</section>

<section id="scrolls" class="torn tr scrollcard" style="background: #EDE3CC">
<div class="k">Scrolls</div>
<h2 class="h2" style="font-size: 28px">Send a scroll</h2>
<p class="p">Know someone who might love the River, and might one day find their way here? Seal a scroll for them. It invites them into the Relational River, then offers clues to the Bay, unfolding one at a time, without ever giving the way away.</p>
<p class="p" style="font-size: 15px">Nothing you write is stored anywhere. It travels only inside the link you send.</p>
<div class="fld"><label class="alabel" for="scFrom">From (optional)</label><input id="scFrom" class="field" type="text" maxlength="40" value="{{scFrom}}" onChange="{{scTypeFrom}}" placeholder="Your name, or how they know you"></div>
<div class="fld"><label class="alabel" for="scNote">A few words for them (optional)</label><textarea id="scNote" class="field" rows="3" maxlength="300" value="{{scNote}}" onChange="{{scTypeNote}}" placeholder="I thought of you when I found this…"></textarea></div>
<div class="fld"><label class="alabel" for="scHint">A whispered hint of your own (optional)</label><input id="scHint" class="field" type="text" maxlength="200" value="{{scHint}}" onChange="{{scTypeHint}}" placeholder="It appears after all the clues. Nudge, but leave the finding to them."></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center"><button class="go tornbtn" style="background: #F5EEE1" onClick="{{scSeal}}">{{scSealLabel}}</button></div>
<sc-if value="{{scReady}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 6px">
<label class="alabel" for="scLink">Your sealed scroll</label>
<input id="scLink" class="field" type="text" readonly value="{{scLink}}">
<div style="display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center">
<sc-if value="{{scCanShare}}" hint-placeholder-val="{{ false }}"><button class="chip on" onClick="{{scShare}}">Send the scroll</button></sc-if>
<button class="chip" onClick="{{scCopy}}">{{scCopyLabel}}</button>
<a href="{{scMail}}" class="lnk">Send by email</a>
<a href="{{scLink}}" class="lnk" target="_blank" rel="noopener">See it as they will</a>
</div>
<p class="p" style="font-size: 15px; font-style: italic">Each scroll you seal is your own. Make as many as you like, for as many people as you like.</p>
</div>
</sc-if>
</section>

<p class="note" style="font-size: 17px">The way here stays open for you. Arriving was remembered only in this browser and inside your Boat. When you are ready, the mist will bring you back.</p>
</main>

<footer class="bayfoot"><a href="/flow">Back to the River, quietly</a><span>Tended by the Institute of Relational Being. Every source links to its makers.</span><a href="/privacy">Privacy</a></footer>
</sc-if>
</div>

</template>

    out.scTypeHint = function (e) { self.state.sc.hint = e && e.target ? e.target.value : ''; };
    out.scSealLabel = sc.link ? 'Seal it again with your changes' : 'Seal the scroll';
    out.scSeal = function () {
      var c = self.state.sc, d = {};
      var f = (c.from || '').trim().slice(0, 40), n = (c.note || '').trim().slice(0, 300), h = (c.hint || '').trim().slice(0, 200);
      if (f) { d.f = f; } if (n) { d.n = n; } if (h) { d.h = h; }
      var link = location.origin + '/scroll';
      if (f || n || h) { var b64 = window.btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); link += '#s=' + b64; }
      scSet({ link: link, copied: false });
      setTimeout(function () { var el = document.getElementById('scLink'); if (el) { try { el.focus(); el.select(); } catch (x) {} } }, 60);
    };
    out.scReady = !!sc.link; out.scLink = sc.link;
    out.scCanShare = !!(navigator && navigator.share);
    out.scShare = function () { try { navigator.share({ title: 'A scroll for you', text: scText, url: self.state.sc.link }).catch(function () {}); } catch (x) {} };
    out.scCopyLabel = sc.copied ? 'Copied' : 'Copy the link';
    out.scCopy = function () {
      var link = self.state.sc.link, done = function () { scSet({ copied: true }); };
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(link).then(done, function () { var el = document.getElementById('scLink'); if (el) { el.select(); } }); }
      else { var el = document.getElementById('scLink'); if (el) { el.select(); try { document.execCommand('copy'); done(); } catch (x) {} } }
    };
    out.scMail = sc.link ? 'mailto:?subject=' + encodeURIComponent('A scroll for you') + '&body=' + encodeURIComponent(scText + '\n\n' + sc.link + '\n') : '#';
    return out;
  }
}
