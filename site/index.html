      var tx = (sx0 + wx + m.dx * mk) * k, ty = (sy0 + wy + m.dy * mk) * k;
      var rot = rot0 * k + m.rot * mk, sc = 1 + (sc0 - 1) * k;
      var sxx = 1 + (m.sx - 1) * mk, syy = 1 + (m.sy - 1) * mk, sk = m.sk * mk;
      var tw = 1 + (m.op - 1) * mk;
      return {
        src: B + d[0], l: d[1] + '%', t: d[2] + '%', w: d[3] + '%',
        tf: 'translate(' + tx.toFixed(2) + 'vmin, ' + ty.toFixed(2) + 'vmin) rotate(' + rot.toFixed(2) + 'deg) scale(' + (sc * sxx).toFixed(3) + ', ' + (sc * syy).toFixed(3) + ') skewX(' + sk.toFixed(2) + 'deg)',
        origin: d[5] === 'sway' ? '50% 100%' : '50% 50%',
        op: ph >= 2 ? 0 : (op * tw).toFixed(3)
      };
    });
    var IRB = 'https://instituteofrelationalbeing.org', wi = 0;
    var words = function (parts, base) {
      var out = [];
      parts.forEach(function (pt) {
        var toks = pt.link ? [pt.t] : pt.t.split(' ');
        toks.forEach(function (w) {
          if (!w) { return; }
          var k = wi++;
          out.push({ sp: ' ', t: w, link: !!pt.link, plain: !pt.link, href: pt.link || '',
            d: (base + k * 0.032).toFixed(3) + 's',
            dx: (-34 - 10 * Math.sin(k * 0.53)).toFixed(1) + 'px',
            dy: (12 * Math.sin(k * 0.71)).toFixed(1) + 'px',
            r: (5 * Math.sin(k * 0.93 + 1)).toFixed(1) + 'deg' });
        });
      });
      return out;
    };
    var wKicker = words([{ t: 'Welcome to' }], 0);
    var wTitle = words([{ t: 'The Relational River' }], 0.1);
    var wP1 = words([{ t: 'A Source, like the headwaters of any river, offered through the' }, { t: 'Institute of Relational Being.', link: IRB }], 0.3);
    var wP2 = words([{ t: 'Good present to you, being of the human variety. The Relational River is an open-source offering of reciprocity and care. It gathers the practices, teachings, circles and projects already flowing, so each of us can find a way in, at our own pace, from a first spring of curiosity toward an ocean of people and places tending life.' }], 0.5);
    var probe = document.querySelector('.vhprobe'), vh = (probe && probe.offsetHeight) || window.innerHeight || 800, wrap = document.querySelector('.arrwrap'), Hc = wrap ? wrap.offsetHeight : vh;
    var srcY = (0.296 * Hc - 0.5 * vh).toFixed(1) + 'px', hoverY = (0.296 * Hc - 0.58 * vh).toFixed(1) + 'px';
    var condense = ph >= 5;
    return {
      pieces: pieces,
      stage: 'min(62vmin, 560px)',
      logoCls: condense ? 'logo condense' : (ph >= 2 ? 'logo dissolve' : 'logo'),
      wKicker: wKicker, wTitle: wTitle, wP1: wP1, wP2: wP2,
      descCls: ph >= 6 ? 'desc flowing' : 'desc',
      btnDelay: (0.7 + wi * 0.032 + 0.6).toFixed(2) + 's',
      logoTf: condense ? 'translate(-50%, -50%) translateY(' + srcY + ') scale(0.05) rotate(-24deg)' : (ph >= 4 ? 'translate(-50%, -50%) translateY(' + hoverY + ') scale(0.36) rotate(-14deg)' : 'translate(-50%, -50%)'),
      logoOpacity: condense ? 0 : 1,
      glowCls: condense ? 'glow condense' : 'glow',
      glowTf: condense ? 'translate(-50%, -50%) translateY(' + srcY + ') scale(0.07)' : (ph >= 4 ? 'translate(-50%, -50%) translateY(' + hoverY + ') scale(0.5)' : 'translate(-50%, -50%) scale(0.9)'),
      glowOpacity: condense ? 1 : (ph >= 4 ? 0.18 : 0),
      discOpacity: ph >= 2 ? 1 : 0,
      fullOpacity: ph >= 2 ? 1 : 0,
      logoAlt: ph >= 2 && !condense ? 'Institute of Relational Being' : '',
      rvCls: ph >= 4 ? 'rv on' : 'rv',
      riverOpacity: ph >= 4 ? (ph >= 6 ? 0.7 : 1) : 0,
      showSkip: ph < 6,
      descVis: ph >= 6 ? 'visible' : 'hidden',
      lineCls: ph >= 6 ? 'line' : 'linehold',
      skip: function () { self.stop(); self.setState({ t: 14.2, phase: 6 }); },
      replay: function () { self.start(); }
    };
  }
}
