<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 50px; letter-spacing: -0.03em; line-height: 1.04">Steady places in turbulent water</h1>
<p style="margin: 0; font-size: 19px; max-width: 640px; line-height: 1.55">When a river runs high and fast, islands are where the water slows, where seeds take root and birds can rest. In times like these, islands of coherence are the circles, households, organisations and places that stay grounded, kind and capable while much around them shakes, and that help the whole river find a new shape.</p>

<section class="torn tl" style="background: #F5EEE1; padding: 34px 40px; display: flex; flex-direction: column; gap: 12px; color: #2F2B28">
<div class="k">Where the idea comes from</div>
<h2 class="h2">Small coherence can shift a whole system</h2>
<p class="p" style="font-size: 17px">The phrase grew from the work of the chemist and Nobel laureate Ilya Prigogine, who studied systems far from equilibrium. His insight, as it is often shared, is that when a complex system is far from balance, small islands of coherence can shift the whole system to a new order. Turbulent times are exactly when small, steady, well-related groups matter most.</p>
<p class="p" style="font-size: 17px">Isabel Carlisle, writing in Kosmos, suggests that bioregions, the places shaped by their own geology, waters, plants and animals, can give these islands their cultural grounding, tying what has been true of a place to what its future needs.</p>
<p class="p" style="font-size: 17px">In the language of <a href="/ways-of-seeing#horizons" style="color: #2B4A5E">three horizons</a>, islands of coherence are pockets of the third horizon: a different future, already alive in small places now.</p>
<p class="minor" style="margin: 0">Read more: <a href="https://www.garrisoninstitute.org/pathways-to-planetary-health/islands-of-coherence/" style="color: #2B4A5E">Islands of Coherence, Garrison Institute</a> · <a href="https://kosmosjournal.org/kj_article/bioregioning-sense-of-place/" style="color: #2B4A5E">Bioregioning and Our Felt Sense of Place, Kosmos</a></p>
</section>

<section style="display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch">
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Why now</div>
<h2 class="h2">Glitch happens</h2>
<p class="p" style="font-size: 18px; color: #EDEDED">In <i>Glitch Happens: Organizational Adaptation at the End of Growth</i> (Frankly 167, November 2026), Nate Hagens reflects on a run of high-profile technology and infrastructure outages, and on the fragility they reveal beneath the systems that sustain modern life. They may not mean immediate catastrophe, he suggests, but they show how interconnected, and how vulnerable, everything has become.</p>
<p class="p" style="font-size: 18px; color: #EDEDED">His question for organisations is not only how to make today’s institutions sturdier, but which qualities will make them worth keeping as the assumptions of endless growth weaken. He points toward organisations built around slack and robustness instead of relentless efficiency, able to adapt as conditions change, and held by networks of trusted relationships that protect their purpose from short-term financial pressure.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px">
<a href="https://natehagens.substack.com/p/glitch-happens-organizational-adaptation" class="go tornbtn" style="background: #F5E3B0">Read or listen to Frankly 167</a>
<a href="/tributaries" class="lnk" style="color: #EDEDED; align-self: center">More from The Great Simplification</a>
</div>
</div>
<div class="torn tr card" style="flex: 1 1 320px; background: #E6E2F2">
<div class="k">What future stewards may need</div>
<h3 class="h3">Qualities, not just structures</h3>
<ul class="steps" style="font-size: 16px">
<li>Deep commitment, and real competence</li>
<li>Maturity in uncertain times</li>
<li>The ability to work across political and cultural divides</li>
<li>A good sense of humour</li>
</ul>
<p class="minor" style="margin: 0">Drawn from Nate Hagens’ reflections in Frankly 167.</p>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">What makes an island of coherence</h2>
<p class="p" style="font-size: 18px; max-width: 780px; color: #EDEDED">No two islands are alike, but steady ones tend to share a few qualities. These are offered as an invitation to notice, not a checklist to pass.</p>

<section class="torn tr" style="background: #DCE6D2; padding: 32px 40px; display: flex; flex-direction: column; gap: 10px; color: #2F2B28">
<div class="k">Tools for holding a group together</div>
<h2 class="h2" style="font-size: 26px">Eight conditions for cooperation</h2>
<p class="p" style="font-size: 17px; max-width: 800px">Steadiness in a group is not luck. ProSocial World has generalised Elinor Ostrom’s Nobel prize-winning work on the commons into eight core design principles that help almost any group cooperate well. They begin with a shared identity and purpose, include fair sharing of contributions and benefits, decisions made together and kind ways through conflict, and end with collaborative relations with other groups: the move from island to archipelago.</p>
<p class="p" style="font-size: 17px; max-width: 800px">Their handouts, noticing tools and group processes are open for anyone to use.</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px 24px">
<a href="https://www.prosocial.world/resources/resource-posts/short-core-design-principle-handout" class="lnk">The eight principles, in brief</a>
<a href="https://www.prosocial.world/resources/processes" class="lnk">ProSocial’s open processes</a>
</div>
<p class="meta" style="margin: 0">ProSocial World is one of the River’s wellsprings. No formal partnership.</p>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">From islands to archipelagos</h2>
<p class="p" style="font-size: 18px; max-width: 800px; color: #EDEDED">An island alone can become a fortress. The River’s hope is for islands that stay porous and in relationship, so that together they form archipelagos: distinct initiatives, connected through relationships that let resources, knowledge and care circulate between them. Natasha Hulst describes this shift as <a href="https://wiki.p2pfoundation.net/From_Islands_of_Coherence_to_Archipelagos_of_Coherence" style="color: #EDEDED">from islands of coherence to archipelagos of coherence</a>.</p>
<div class="cards">
<article class="torn tl card" style="background: #DCE6D2"><div class="k">Lakes</div><h3 class="h3">Where islands often begin</h3><p class="p">A circle that meets with care, again and again, is often the first island.</p><a href="/lakes" class="lnk">Find a lake</a></article>
<article class="torn tr card" style="background: #CFE1E4"><div class="k">Local currents</div><h3 class="h3">Islands near you</h3><p class="p">Groups already tending your bioregion, who may welcome another steady hand.</p><a href="/local-currents" class="lnk">See who is near you</a></article>
<article class="torn tl card" style="background: #F5E3B0"><div class="k">The Well</div><h3 class="h3">Resourcing islands</h3><p class="p">Pour in your skills and draw on others, so an island has what it needs to hold steady.</p><a href="/well" class="lnk">Visit the Well</a></article>
<article class="torn tr card" style="background: #E6E2F2"><div class="k">Groundwater</div><h3 class="h3">Threads between islands</h3><p class="p">The connections forming between projects and places, so islands can become archipelagos.</p><a href="/groundwater" class="lnk">See emerging threads</a></article>
<article class="torn tl card" style="background: #F2D3BC"><div class="k">Eddies</div><h3 class="h3">Steadiness within</h3><p class="p">Coherence begins inside: grief, gratitude and rest help us stay present when things shake.</p><a href="/eddies" class="lnk">Visit the eddies</a></article>
</div>
</section>

<section class="torn tl care">
<div class="k">A note of care</div>
<h2 class="h2" style="font-size: 26px">Coherence, not retreat</h2>
<ul class="steps">
<li>Islands of coherence are not bunkers. They stay open to the river, generous with what they learn, and welcoming to newcomers.</li>
<li>Coherence is not sameness. Steady groups make room for difference, disagreement and repair.</li>
<li>Many peoples, Indigenous communities among them, have long kept place-rooted, relational ways of living through great upheaval. Where the River shares such knowledge, it does so from their own voices and with their consent.</li>
</ul>
</section>

<p class="note">All our ancestors once lived in close relationship with the land and ecology they were a part of. Every island of coherence is, in its way, a remembering of that.</p>
</main>
