<noscript><p style="color:#EDEDED;font-family:sans-serif;padding:24px">The Relational River needs JavaScript turned on to flow.</p></noscript>
<template id="rr-template">

<div style="background: linear-gradient(180deg, #231C4D 0%, #0E2849 42%, #174A5B 100%); font-family: Jost, sans-serif; color: #EDEDED; min-height: 100vh">

<nav class="vnav" aria-label="Main">
<div class="vgroup"><button class="vbtn">Begin</button><div class="vmenu"><a href="/flow"><b>The River</b><span>the whole River at a glance</span></a><a href="/source"><b>The source</b><span>a minute of gentle questions</span></a><a href="/"><b>The arrival</b><span>watch the Beings gather</span></a></div></div>

<div class="vgroup"><button class="vbtn here">Act</button><div class="vmenu"><a href="/channels"><b>Channels</b><span>ways to act, from small to large</span></a><a href="/waterfall"><b>Waterfall</b><span>offer an idea, see what it feeds</span></a><a href="/estuary"><b>Estuary</b><span>workplaces, schools and councils</span></a><a href="/groundwater"><b>Groundwater</b><span>emerging threads and systems</span></a></div></div>
<a href="/my-river" class="vmine">My river</a>

<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 34px">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #C9CCD6">Channels</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 400; font-size: 54px; line-height: 1.05; color: #DCDCDC">Where the river waters the land</h1>
<p style="margin: 0; font-size: 19px; max-width: 760px; line-height: 1.55">Channels carry the river's water out to where it is needed. These are ways to act, from a change in your own life to movements that span the planet. Start wherever you have the capacity today. Action and rest belong together.</p>
</div>

<div role="group" aria-label="Choose a scale of action" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{scales}}" as="c" hint-placeholder-count="6"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>

<div aria-live="polite" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="6">
<article class="torn {{a.tilt}}" style="background: {{a.bg}}; padding: 30px 28px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase"><span>{{a.scale}}</span><span style="letter-spacing: 0; text-transform: none; font-style: italic">{{a.time}}</span></div>
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 700; font-size: 21px; line-height: 1.2">{{a.title}}</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5">{{a.text}}</p>
<div style="font-size: 14px; font-style: italic">{{a.by}}</div>
<a href="{{a.href}}" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">{{a.cta}}</a>
</article>
</sc-for>
</div>

<section class="torn tr" style="background: #E6E2F2; padding: 30px 40px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<p style="margin: 0; font-size: 17px; max-width: 700px">Feeling stretched? Rest is part of the work. The grief and courage eddy is always close by.</p>
<a href="/eddies" class="go tornbtn">Rest in an eddy</a>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #C9CCD6">Groundwater</div>
<h2 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 400; font-size: 38px; color: #DCDCDC">Emerging threads</h2>
<p style="margin: 0; font-size: 18px; max-width: 760px; line-height: 1.55">Beneath the river runs groundwater: the hidden connections between people, projects and places. A systems view helps us notice where threads are quietly forming, and where something new might emerge if two things were introduced.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px">
<article class="torn tl" style="background: #CFE1E4; padding: 28px 28px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">A thread noticed by the River</div>
<h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 700; font-size: 20px">Seed keepers on two shores</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.5">Irish Seed Savers in East Clare, and the Seed Library of Los Angeles and Theodore Payne Foundation in LA, all keep living seed in circulation.</p>
</article>
<article class="torn tr" style="background: #CFE1E4; padding: 28px 28px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">A thread noticed by the River</div>
<h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 700; font-size: 20px">Economies beyond growth</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.5">The Post Growth Institute and The Great Simplification are both asking what a good life looks like once endless growth is no longer the goal.</p>
</article>
<article class="torn tl" style="background: #FBF7EF; padding: 28px 28px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">Questions for noticing emergence</div>
<ul style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.7; font-style: italic"><li>What wants to connect here?</li><li>Where is energy already gathering?</li><li>What small move could help two things meet?</li></ul>
</article>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px">
<article class="torn tr" style="background: #F2D3BC; padding: 30px 30px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">Feeding the groundwater · UK charity and community</div>
<h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 700; font-size: 21px">Perspectiva</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.5">A community of scholars, artists, activists and seekers who see our deepest challenges as a crisis of perception and imagination. Essays on worldviews and the metacrisis, the Emerge gathering, the Realisation Festival, Perspectiva Press, and the Antidebate, which welcomes volunteers.</p>
<a href="https://systems-souls-society.com/" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">Visit Perspectiva</a>
</article>
<article class="torn tl" style="background: #F2D3BC; padding: 30px 30px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">Feeding the groundwater · collaborator</div>
<h3 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 700; font-size: 21px">Sympoiesis</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.5">A Berlin experience and design lab whose name means making-with. Through workshops, storytelling and design, they help people and organisations grow their response-ability to metabolise loss and regenerate living systems.</p>
<a href="https://www.sympoiesis.world/" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">Visit Sympoiesis</a>
</article>
</div>
</section>
</main>
<footer style="max-width: 1160px; margin: 0 auto; padding: 24px 32px 40px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; font-style: italic; color: #C9CCD6"><a href="https://instituteofrelationalbeing.org" target="_blank" rel="noopener" aria-label="The Institute of Relational Being (opens in a new tab)" style="display: block; min-height: 44px"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="" style="width: 64px; height: 64px; display: block"></a><span>Every offering links to its makers.</span><a href="/privacy" style="color: #EDEDED; min-height: 44px; display: inline-flex; align-items: center">Privacy</a></footer>
</div>
</template>
