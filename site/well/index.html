<main style="max-width: 1160px; margin: 0 auto; padding: 16px 32px 64px; display: flex; flex-direction: column; gap: 40px">
<a href="/flow" style="font-size: 15px; font-style: italic; min-height: 44px; display: inline-flex; align-items: center">Back to the whole River</a>

<div class="hero" style="margin-top: -24px">
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">The Well</div>
<h1 style="margin: 0; font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 800; font-size: 50px; letter-spacing: -0.03em; line-height: 1.04">The Well of Wonder, Wit, Wisdom and Wealth</h1>
<p style="margin: 0; font-size: 19px; max-width: 640px; line-height: 1.55">Beneath every river lies groundwater, and a well is where a community draws on it together. Here, people pour in what they can offer a more vibrant, regenerative and relational future: their skills, experience, passions and ideas. Others draw from the well to resource the projects they care about, and the River helps gather the people who could make them happen.</p>
<p style="margin: 0; font-size: 17px; max-width: 640px; line-height: 1.55">Everyone who pours in can also say what they need, so support can flow both ways, in money and in many other ways.</p>
</div>
<svg class="wellart" viewBox="0 0 400 360" role="img" aria-label="Four streams, wonder, wit, wisdom and wealth, flowing into a well that reflects the stars">
<path d="M30 40 C 90 70, 120 120, 168 178" stroke="#B9A8E8" stroke-width="5" fill="none" stroke-linecap="round" class="flow"></path>
<path d="M370 52 C 310 80, 280 130, 234 180" stroke="#7FC4D0" stroke-width="5" fill="none" stroke-linecap="round" class="flow f2"></path>
<path d="M18 300 C 80 290, 120 260, 160 226" stroke="#E8A97A" stroke-width="5" fill="none" stroke-linecap="round" class="flow f3"></path>
<path d="M384 296 C 320 292, 282 262, 242 228" stroke="#E8C77A" stroke-width="5" fill="none" stroke-linecap="round" class="flow f4"></path>
<text x="24" y="28" fill="#D9CFF5" font-family="Jost, sans-serif" font-size="17">Wonder</text>
<text x="330" y="40" fill="#BFE3EA" font-family="Jost, sans-serif" font-size="17">Wit</text>
<text x="14" y="330" fill="#F4CDB0" font-family="Jost, sans-serif" font-size="17">Wisdom</text>
<text x="324" y="330" fill="#F0DCA6" font-family="Jost, sans-serif" font-size="17">Wealth</text>
<path d="M120 196 C 122 160, 170 146, 204 147 C 246 148, 284 166, 282 200 C 280 238, 240 256, 200 255 C 156 254, 118 236, 120 196 Z" fill="#8C8178"></path>
<path d="M136 198 C 138 172, 174 162, 202 162 C 236 163, 266 176, 265 200 C 264 226, 232 240, 201 240 C 166 239, 134 226, 136 198 Z" fill="#0E2849"></path>
<g fill="#EDEDED"><circle cx="178" cy="190" r="2"></circle><circle cx="214" cy="182" r="2.6" class="twinkle"></circle><circle cx="236" cy="206" r="1.8"></circle><circle cx="196" cy="216" r="2.2" class="twinkle t2"></circle><circle cx="160" cy="208" r="1.5"></circle></g>
<path d="M150 186 L178 190 L214 182 L236 206 L196 216 L160 208" stroke="#EDEDED" stroke-opacity="0.35" fill="none"></path>
<path d="M124 194 C 120 228, 150 262, 200 266 C 252 268, 286 238, 280 200" stroke="#6E655D" stroke-width="10" fill="none" stroke-linecap="round"></path>
</svg>
</div>

<p class="note">An old folk tale tells of travellers who arrive in a hungry village with only a cooking pot and a stone. They set the pot to boil and say they are making stone soup. One neighbour adds a carrot, another a handful of herbs, another an onion, until there is a soup that feeds everyone. The well works the same way: no one has to bring everything, only what they have.</p>

<section style="display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">What flows into the well</h2>
<div class="cards" style="grid-template-columns: repeat(auto-fit, minmax(230px, 1fr))">
<article class="torn tl card" style="background: #E6E2F2"><div class="k">Wonder</div><h3 class="h3">Visions, ideas and questions</h3><p class="p">The future you can picture, the idea that won’t leave you alone, the question worth gathering people around.</p></article>
<article class="torn tr card" style="background: #CFE1E4"><div class="k">Wit</div><h3 class="h3">Skills and craft</h3><p class="p">What your hands and mind know how to do: building, growing, cooking, facilitating, designing, coding, mending, teaching.</p></article>
<article class="torn tl card" style="background: #F2D3BC"><div class="k">Wisdom</div><h3 class="h3">Experience and lived knowledge</h3><p class="p">Years with a place or a practice, lessons learned the hard way, and the guidance of elders.</p></article>
<article class="torn tr card" style="background: #F5E3B0"><div class="k">Wealth</div><h3 class="h3">Resources to share</h3><p class="p">Money, and also land, space, tools, transport, time and networks. Wealth is anything that can help something living grow.</p></article>
</div>
</section>

<section id="pour" class="torn tall tl" style="background: #FBF7EF; padding: 40px 44px; display: flex; flex-direction: column; gap: 18px; color: #2F2B28">
<sc-if value="{{managing}}" hint-placeholder-val="{{ false }}">
<div class="torn tr card" style="background: #DCE6D2" aria-live="polite">
<div class="k">Your offering in the well</div>
<sc-if value="{{mineShown}}" hint-placeholder-val="{{ false }}">
<h3 class="h3">{{mineTitle}}</h3>
<p class="p">{{mineText}}</p>
<p class="p" style="font-size: 14px">{{mineMeta}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><button class="go tornbtn" style="background: #FBF7EF" onClick="{{download}}">Download a copy</button><button class="go tornbtn" style="background: #F2D3BC" onClick="{{withdraw}}">Withdraw my offering</button></div>
<p class="minor" style="margin: 0">Withdrawing deletes it from the River completely. You are always welcome to pour in again.</p>
</sc-if>
<p class="p">{{mineNote}}</p>
</div>
</sc-if>
<div class="chips" role="group" aria-label="I would like to"><span class="chiplabel">I would like to</span>
<sc-for list="{{modeChips}}" as="c" hint-placeholder-count="2"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>

<sc-if value="{{pourMode}}" hint-placeholder-val="{{ true }}">
<div class="pourgrid">
<div style="display: flex; flex-direction: column; gap: 14px">
<h2 class="h2" style="font-size: 28px">Pour into the well</h2>
<div class="chips" role="group" aria-label="What are you pouring in?"><span class="chiplabel">I’m offering</span>
<sc-for list="{{wChips}}" as="c" hint-placeholder-count="4"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
<label for="w-skills" class="lbl">Skills and craft</label>
<input id="w-skills" class="field" value="{{skills}}" onChange="{{typedSkills}}" placeholder="For example: native plant propagation, bookkeeping, facilitation">
<label for="w-exp" class="lbl">Experience</label>
<input id="w-exp" class="field" value="{{exp}}" onChange="{{typedExp}}" placeholder="For example: twenty years as a hydrologist in the Santa Monica Mountains">
<label for="w-pass" class="lbl">Passions and ideas for how to be of service</label>
<textarea id="w-pass" class="field" rows="3" value="{{pass}}" onChange="{{typedPass}}" placeholder="What would you love to help bring about?"></textarea>
<label for="w-need" class="lbl">What I need, in return or simply in life</label>
<input id="w-need" class="field" value="{{need}}" onChange="{{typedNeed}}" placeholder="For example: help with my garden, a place to stay, learning a new skill, paid work">
<label for="w-where" class="lbl">Where I am</label>
<input id="w-where" class="field" value="{{where}}" onChange="{{typedWhere}}" placeholder="A town, a watershed or a bioregion is plenty">
<label for="w-contact" class="lbl">Email, so the River can send you invitations (optional)</label>
<input id="w-contact" type="email" class="field" value="{{contact}}" onChange="{{typedContact}}" placeholder="Never shown to anyone. Used only for invitations you can say yes or no to.">
<input class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" value="{{hp}}" onChange="{{typedHp}}">
<div class="chips" role="group" aria-label="How much time I have"><span class="chiplabel">Time</span>
<sc-for list="{{timeChips}}" as="c" hint-placeholder-count="4"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
<div class="chips" role="group" aria-label="How far I can reach"><span class="chiplabel">Reach</span>
<sc-for list="{{reachChips}}" as="c" hint-placeholder-count="3"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
<div class="chips" role="group" aria-label="Kinds of exchange I welcome"><span class="chiplabel">Exchange</span>
<sc-for list="{{exChips}}" as="c" hint-placeholder-count="5"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
<div class="chips" role="group" aria-label="Who can see my offering"><span class="chiplabel">Who can see this</span>
<sc-for list="{{visChips}}" as="c" hint-placeholder-count="3"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
<sc-if value="{{notPoured}}" hint-placeholder-val="{{ true }}">
<button class="{{consentCls}}" aria-pressed="{{consentOn}}" onClick="{{toggleConsent}}" style="align-self: flex-start; text-align: left">{{consentLabel}}</button>
<a href="/privacy" class="lnk" style="font-size: 15px">Read how the River cares for your information</a>
<button class="go tornbtn" style="align-self: flex-start; background: #CFE1E4" onClick="{{pour}}">{{pourLabel}}</button>
<p class="minor" style="margin: 0" aria-live="polite">{{pourNote}}</p>
</sc-if>
<sc-if value="{{kept}}" hint-placeholder-val="{{ false }}">
<p class="p" style="font-size: 17px" aria-live="polite">Thank you. Your offering is in the well, kept as privately as you chose.</p>
<p class="p">This is your private link for reading or withdrawing your offering. Keep it somewhere safe: it is the only key, and the River can’t send it again.</p>
<input class="field" readonly value="{{manageLink}}" aria-label="Your private link" onClick="{{selectAll}}">
<a href="{{manageLink}}" class="lnk">Open my offering</a>
</sc-if>
<sc-if value="{{notConnected}}" hint-placeholder-val="{{ false }}">
<p class="p" style="font-size: 17px" aria-live="polite">Thank you. The well isn’t open yet while the River is being tested, so nothing has been saved or sent. When it opens, your offering will be kept exactly as privately as you chose.</p>
<a href="https://www.hylo.com/groups/institute-of-relational-being/chat" class="lnk">Tell IRB on Hylo that you’d like to pour in</a>
</sc-if>
</div>
<aside style="display: flex; flex-direction: column; gap: 10px">
<div class="k">How your offering would appear</div>
<article class="torn tr card" style="background: {{previewBg}}">
<div class="k">{{previewW}}</div>
<h3 class="h3">{{previewTitle}}</h3>
<p class="p">{{previewExp}}</p>
<p class="p" style="font-style: italic">{{previewPass}}</p>
<p class="p"><b>Needs:</b> {{previewNeed}}</p>
<p class="p" style="font-size: 14px">{{previewMeta}}</p>
</article>
<p class="minor" style="margin: 0">{{visNote}}</p>
</aside>
</div>
</sc-if>

<sc-if value="{{drawMode}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<h2 class="h2" style="font-size: 28px">Draw from the well</h2>
<p class="p" style="font-size: 17px; max-width: 760px">Describe what you hope to bring about, and the River gathers a constellation of people whose offerings fit: nearby first, and further afield where a skill isn’t found close to home. Try one of these examples, or write your own.</p>
<div class="chips" role="group" aria-label="Example projects"><sc-for list="{{needChips}}" as="c" hint-placeholder-count="4"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
<sc-if value="{{ownNeed}}" hint-placeholder-val="{{ false }}">
<label for="w-own" class="lbl">What would you love to bring about?</label>
<textarea id="w-own" class="field" rows="3" value="{{own}}" onChange="{{typedOwn}}" placeholder="For example: a seed library and repair café in our town, with help on funding and a website"></textarea>
<div class="chips" role="group" aria-label="Where"><span class="chiplabel">Where</span><sc-for list="{{ownWhereChips}}" as="c" hint-placeholder-count="3"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
</sc-if>
<div class="constellation">

<line x1="300" y1="210" x2="420" y2="350" stroke-opacity="{{l3}}"></line>

<line x1="300" y1="210" x2="160" y2="78" stroke-opacity="{{l7}}"></line>
<path d="M300 62 L452 104 L512 236 L420 350 L268 372 L128 318 L92 186 L160 78 Z" stroke-opacity="{{ring}}" stroke-dasharray="4 7"></path>
</g>

</g>
<g font-family="Jost, sans-serif" font-size="13" fill="#EDEDED">
<circle cx="26" cy="398" r="6" fill="#B9A8E8"></circle><text x="38" y="403">Wonder</text>
<circle cx="112" cy="398" r="6" fill="#7FC4D0"></circle><text x="124" y="403">Wit</text>
<circle cx="170" cy="398" r="6" fill="#E8A97A"></circle><text x="182" y="403">Wisdom</text>
<circle cx="254" cy="398" r="6" fill="#E8C77A"></circle><text x="266" y="403">Wealth</text>

</svg>
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="k">A constellation the River might gather</div>
<h3 class="h3">{{needTitle}}</h3>
<ol class="stars">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="5"><li><span class="dot" style="background: {{s.color}}"></span><div><b>{{s.role}}</b><span>{{s.meta}}</span></div></li></sc-for>
</ol>
<sc-if value="{{hasGaps}}" hint-placeholder-val="{{ true }}"><p class="p"><b>Still to find:</b> {{gaps}}. The River would keep looking, and say so honestly.</p></sc-if>
<sc-if value="{{noStars}}" hint-placeholder-val="{{ false }}"><p class="p">Say a little more about the skills, places or resources you hope for, and a constellation will begin to appear.</p></sc-if>
<sc-if value="{{notInvited}}" hint-placeholder-val="{{ true }}"><button class="go tornbtn" style="align-self: flex-start; background: #F5E3B0" onClick="{{invite}}">Invite this constellation</button></sc-if>
<sc-if value="{{invited}}" hint-placeholder-val="{{ false }}"><p class="p" style="font-size: 16px">When the well opens, each person would receive a gentle invitation describing the project, and decides for themselves whether to say yes. No one’s details are shared until they do. For now this is an example, and no invitations have been sent.</p></sc-if>
</div>
</div>
<p class="minor" style="margin: 0">The people in these examples are imagined, to show how the well could work. Real offerings appear only with the consent of the people who pour them in.</p>
</div>
</sc-if>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">Reciprocity, in many currencies</h2>
<p class="p" style="font-size: 18px; max-width: 780px; color: #EDEDED">Money is one current among many. Each offering says which kinds of exchange it welcomes, and each person can name what they need, so support can circle back in the form that truly helps. For deeper thinking about money and resources that circulate rather than pool, the <a href="https://postgrowth.org/" style="color: inherit; text-decoration: underline">Post Growth Institute</a> is a generous companion.</p>
<div class="cards">
<article class="torn tl card" style="background: #DCE6D2"><div class="k">Gift</div><h3 class="h3">Freely given</h3><p class="p">Offered for the love of the place or the work, with nothing asked in return.</p></article>
<article class="torn tr card" style="background: #CFE1E4"><div class="k">Time exchange</div><h3 class="h3">An hour for an hour</h3><p class="p">Every hour given is honoured equally, whoever gives it, and can be drawn on later.</p></article>
<article class="torn tl card" style="background: #E6E2F2"><div class="k">Skill swap</div><h3 class="h3">Your craft for mine</h3><p class="p">A website for a vegetable garden, a workshop for a weekend of help on the land.</p></article>
<article class="torn tr card" style="background: #F2D3BC"><div class="k">Paid</div><h3 class="h3">Fair pay for good work</h3><p class="p">Many people need income to keep giving their best. Paid offerings are welcome and honoured.</p></article>
<article class="torn tl card" style="background: #F5E3B0"><div class="k">Funded</div><h3 class="h3">A whole constellation, resourced</h3><p class="p">Funders and family offices can resource a constellation together, so everyone in it is supported.</p></article>
</div>
<div class="torn tr timenote">
<div class="tn-head">
<div class="k">A recorded hour, for example</div>
<h3 class="h3">One native plant grower’s season of time exchange</h3>
<p class="p">For now, time exchange in the well is informal: people agree it between themselves. This is a picture of how recorded hours could look one day. The grower is imagined.</p>
</div>
<table class="ledger">
<caption class="sr">An imagined time note: hours given and received, with a balance</caption>
<thead><tr><th scope="col">When</th><th scope="col">What the hour held</th><th scope="col">With</th><th scope="col" class="num">Hours</th></tr></thead>
<tbody>
<tr><td>March</td><td>Planting native sages and buckwheat along a creek in Fryman Canyon</td><td>A neighbourhood restoration day</td><td class="num give">+3</td></tr>
<tr><td>April</td><td>Showing a neighbour how to collect and dry seed</td><td>A new seed saver</td><td class="num give">+1</td></tr>
<tr><td>May</td><td>Setting up simple accounts for the nursery</td><td>A bookkeeper for co-operatives</td><td class="num take">−2</td></tr>
<tr><td>June</td><td>Hosting the nursery’s first open-day circle</td><td>A facilitator</td><td class="num take">−1</td></tr>
</tbody>
<tfoot><tr><td colspan="3">Hours to draw on</td><td class="num">1</td></tr></tfoot>
</table>
<div class="tn-value">
<div class="k">What an hour is worth</div>
<p class="p"><b>Every hour counts the same,</b> whether it holds bookkeeping, planting, cooking or listening. A bookkeeper’s hour and a gardener’s hour are equal.</p>
<p class="p"><b>And every hour holds more than it measures.</b> Those four hours given put about sixty native plants in the ground, taught a neighbour to save seed, and in return gave a small nursery tidy books and its first gathering.</p>
</div>
</div>
</section>

<section class="torn tr" style="background: #F5E3B0; padding: 40px 44px; display: flex; flex-wrap: wrap; gap: 32px; color: #2F2B28">
<div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 12px">
<div class="k">For funders, foundations and family offices</div>
<h2 class="h2">Wealth that listens</h2>
<p class="p" style="font-size: 17px">The well can show where the capacity to act already exists, and where a little money would unlock it: a constellation of skilled, willing people in a bioregion, ready to begin and waiting only for resources.</p>
<p class="p" style="font-size: 17px">Instead of funding a single organisation from afar, you can resource a whole constellation, meet its people as relationships, and see the skills, care and local knowledge your money joins.</p>
</div>
<ul class="steps" style="flex: 1 1 320px; font-size: 17px; list-style: none; padding-left: 0">
<li><b>See constellations, not profiles.</b> Funders see what a constellation can do and needs, never people’s private details, until those people choose to meet.</li>
<li><b>Fund the gaps.</b> The well shows which skills and resources are still missing in a place.</li>
<li><b>Begin with learning.</b> The capital journey is a good first step before giving.</li>
<li style="margin-top: 10px"><a href="/capital-journey" class="go tornbtn" style="background: #FBF7EF">Open the capital journey</a></li>
</ul>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">What the well can reveal</h2>
<p class="p" style="font-size: 18px; max-width: 780px; color: #EDEDED">Imagine hundreds, then thousands, of people pouring in their skills and visions. Seen together, the well becomes a living picture of what is possible, in the spirit of ecological design and systems thinking: patterns, relationships and potential that no one could see alone.</p>
<div class="cards">
<article class="torn tl card" style="background: #CFE1E4"><div class="k">Abundance maps</div><h3 class="h3">What a place already holds</h3><p class="p">The skills, wisdom and resources gathered in each bioregion, shown together and never person by person.</p></article>
<article class="torn tr card" style="background: #F2D3BC"><div class="k">Gaps worth tending</div><h3 class="h3">What is still missing</h3><p class="p">Where a community’s hopes need a skill or resource it doesn’t yet have, and where help from further afield could flow.</p></article>
<article class="torn tl card" style="background: #E6E2F2"><div class="k">Constellations ready to move</div><h3 class="h3">People who could begin tomorrow</h3><p class="p">Groups the River has helped gather who have said yes, have the time, and are ready for support.</p></article>
</div>
</section>

<section class="torn tl care">
<div class="k">How the well keeps care</div>
<h2 class="h2" style="font-size: 26px">Your offering is yours</h2>
<ul class="steps">
<li>Private by default. You choose who can see your offering, and you can read, download or withdraw it at any time with your private link. Withdrawing deletes it completely, and nothing is kept longer than three years.</li>
<li>The River suggests; people decide. No one joins a constellation without saying yes to an invitation.</li>
<li>No ranking or scoring of people, ever. Every kind of offering is honoured.</li>
<li>Kept in the River itself, with only what an offering needs. Your email, if you give it, is never shown and is used only for invitations. There is no tracking, and nothing is sold or shared.</li>
<li>Stewards tend the well, help new people pour in, and keep it a kind place.</li>
<li>The well follows GDPR wherever it applies. <a href="/privacy" style="color: inherit">Read the River’s privacy notice</a>.</li>
</ul>
</section>

<p class="note">Earth is every human’s first home, and it has always been tended by many hands. The well is one more way for those hands to find each other.</p>

<section style="display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">Where the well flows</h2>
<div class="cards">
<article class="torn tl card" style="background: #DCE6D2"><div class="k">Waterfall</div><h3 class="h3">Offer an idea</h3><p class="p">An idea at the falls can draw the people it needs from the well.</p><a href="/waterfall" class="lnk">Visit the waterfall</a></article>
<article class="torn tr card" style="background: #CFE1E4"><div class="k">Local currents</div><h3 class="h3">Near you</h3><p class="p">Groups already tending your bioregion, who may need just what you offer.</p><a href="/local-currents" class="lnk">See who is near you</a></article>
<article class="torn tl card" style="background: #E6E2F2"><div class="k">Groundwater</div><h3 class="h3">Threads between projects</h3><p class="p">The connections forming between organisations, which the well can help resource.</p><a href="/groundwater" class="lnk">See emerging threads</a></article>
<article class="torn tr card" style="background: #F2D3BC"><div class="k">Ocean and confluences</div><h3 class="h3">Projects worldwide</h3><p class="p">Organisations sharing what they offer and what they need.</p><a href="/ocean" class="lnk">Explore the ocean</a></article>
</div>
</section>
</main>

<footer style="max-width: 1160px; margin: 0 auto; padding: 24px 32px 40px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; font-style: italic; color: #C9CCD6"><a href="https://instituteofrelationalbeing.org" target="_blank" rel="noopener" aria-label="The Institute of Relational Being (opens in a new tab)" style="display: block; min-height: 44px"><img src="/assets/e8c0fc7b44ab44f6fd08f8a17c9a0149.png" alt="" style="width: 64px; height: 64px; display: block"></a><span>An open commons tended by the Institute of Relational Being. The well is in its early days: the people in the examples are imagined.</span><a href="/privacy" style="color: #EDEDED; min-height: 44px; display: inline-flex; align-items: center">Privacy</a></footer>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":2600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'pour', w: { wit: true }, skills: '', exp: '', pass: '', need: '', where: '', time: 'month', reach: 'local', ex: { gift: true, swap: true }, vis: 'river', contact: '', hp: '', consent: false, status: 'idle', key: '', manage: '', mine: null, mineStatus: '',
      needKey: 'creek', own: '', ownWhere: 'anywhere', invited: false };
  }
  componentDidMount() {
    var self = this, h = '';
    try { h = (location.hash || '').replace(/^#/, ''); } catch (e) {}
    var mm = /(?:^|&)manage=([0-9a-f-]+\.[0-9a-f]+)/.exec(h);
    if (!mm) { return; }
    this.setState({ manage: mm[1], mineStatus: 'loading' });
    try {
      fetch('/api/well/mine', { headers: { 'x-well-key': mm[1] } })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, code: r.status, d: d }; }); })
        .then(function (res) { if (res.ok && res.d.offering) { self.setState({ mine: res.d.offering, mineStatus: 'shown' }); } else { self.setState({ mineStatus: res.code === 404 ? 'missing' : 'offline' }); } }, function () { self.setState({ mineStatus: 'offline' }); });
    } catch (e) { this.setState({ mineStatus: 'offline' }); }
    try { var el = document.getElementById('pour'); if (el) { el.scrollIntoView(); } } catch (e) {}
  }
  chips(opts, key) {
    var self = this, cur = this.state[key];
    return opts.map(function (o) { var on = cur === o[0]; return { label: o[1], on: on ? 'true' : 'false', cls: on ? 'chip on' : 'chip', pick: function () { var s = {}; s[key] = o[0]; s.invited = false; self.setState(s); } }; });
  }
  multi(opts, key) {
    var self = this, cur = this.state[key];
    return opts.map(function (o) { var on = !!cur[o[0]]; return { label: o[1], on: on ? 'true' : 'false', cls: on ? 'chip on' : 'chip', pick: function () { var n = Object.assign({}, self.state[key]); if (n[o[0]]) { delete n[o[0]]; } else { n[o[0]] = true; } var s = {}; s[key] = n; self.setState(s); } }; });
  }
  typed(key) { var self = this; return function (e) { var s = {}; s[key] = e && e.target ? e.target.value : ''; s.invited = false; self.setState(s); }; }
  renderVals() {
    var self = this, s = this.state;
    var W = { wonder: ['Wonder', '#B9A8E8', '#E6E2F2'], wit: ['Wit', '#7FC4D0', '#CFE1E4'], wisdom: ['Wisdom', '#E8A97A', '#F2D3BC'], wealth: ['Wealth', '#E8C77A', '#F5E3B0'] };
    var TIME = [['hours', 'A few hours'], ['month', 'A few hours a month'], ['week', 'A day a week'], ['season', 'A season'], ['project', 'Project by project']];
    var REACH = [['local', 'Close to home'], ['online', 'Close to home and online'], ['anywhere', 'Anywhere']];
    var EX = [['gift', 'Gift'], ['time', 'Time exchange'], ['swap', 'Skill swap'], ['paid', 'Paid'], ['funded', 'Funded']];
    var VIS = [['river', 'Only the River, to suggest me privately'], ['members', 'River members'], ['anyone', 'Anyone']];
    var label = function (list, k) { for (var i = 0; i < list.length; i++) { if (list[i][0] === k) { return list[i][1]; } } return ''; };
    var v = {};
    v.modeChips = this.chips([['pour', 'Pour into the well'], ['draw', 'Draw from the well']], 'mode');
    v.pourMode = s.mode === 'pour'; v.drawMode = s.mode === 'draw';

    // pour
    v.wChips = this.multi([['wonder', 'Wonder'], ['wit', 'Wit'], ['wisdom', 'Wisdom'], ['wealth', 'Wealth']], 'w');
    v.timeChips = this.chips(TIME, 'time'); v.reachChips = this.chips(REACH, 'reach'); v.exChips = this.multi(EX, 'ex'); v.visChips = this.chips(VIS, 'vis');
    v.skills = s.skills; v.exp = s.exp; v.pass = s.pass; v.need = s.need; v.where = s.where;
    v.typedSkills = this.typed('skills'); v.typedExp = this.typed('exp'); v.typedPass = this.typed('pass'); v.typedNeed = this.typed('need'); v.typedWhere = this.typed('where');
    var ws = ['wonder', 'wit', 'wisdom', 'wealth'].filter(function (k) { return s.w[k]; });
    v.previewW = ws.length ? ws.map(function (k) { return W[k][0]; }).join(' · ') : 'Choose what you are offering';
    v.previewBg = ws.length ? W[ws[0]][2] : '#F5EEE1';
    v.previewTitle = s.skills || 'Your skills and craft';
    v.previewExp = s.exp || 'Your experience will appear here.';
    v.previewPass = s.pass || 'And how you would love to be of service.';
    v.previewNeed = s.need || 'whatever would help you, in return or simply in life';
    var exs = EX.filter(function (x) { return s.ex[x[0]]; }).map(function (x) { return x[1].toLowerCase(); });
    v.previewMeta = [(s.where || 'Your place'), label(TIME, s.time).toLowerCase(), label(REACH, s.reach).toLowerCase(), exs.length ? 'welcomes ' + exs.join(', ') : ''].filter(Boolean).join(' · ');

    var TAGL = { water: 'water knowledge', creek: 'creek care', survey: 'survey skills', mentoring: 'mentoring', plants: 'native plants', restoration: 'restoration', seed: 'seed saving', organising: 'organising', events: 'gatherings', outreach: 'outreach', art: 'art', storytelling: 'storytelling', design: 'design', tools: 'tools', transport: 'transport', youth: 'young people', species: 'species knowledge', food: 'food', woodland: 'woodland ecology', building: 'building', craft: 'craft', land: 'land', farming: 'farming', facilitation: 'facilitation', energy: 'energy', funding: 'funding', systems: 'systems thinking', mapping: 'mapping', finance: 'finance', legal: 'legal help', writing: 'writing', website: 'a website', data: 'data', repair: 'repair skills', permits: 'permits' };
    var NEEDS = {
