name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -w "\nplaces %{http_code}\n" "https://relationalriver.org/api/inat/places?q=asheville" | head -c 400; echo
          u=$(curl -s "https://relationalriver.org/api/inat/observations?place_id=1&quality_grade=research&photos=true&per_page=1" | python3 -c "import json,sys;print(json.load(sys.stdin)['results'][0]['photos'][0]['url'].replace('/square.','/medium.'))")
          curl -s -o ph.jpg -w "photo %{http_code} %{content_type} %{size_download}\n" "https://relationalriver.org/api/inat/photo?u=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$u")"
          curl -s -o /dev/null -w "beings.json %{http_code}\n" https://relationalriver.org/data/beings.json
